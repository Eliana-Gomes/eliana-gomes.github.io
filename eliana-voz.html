<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tutora de Voz — Luz em Movimento</title>
<meta name="theme-color" content="#00343d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tutora">
<link rel="apple-touch-icon" href="/tutora-icon-192.png">
<link rel="icon" type="image/png" href="/tutora-icon-192.png">
<link rel="manifest" href="/tutora-manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --petrol: #00343d; --gold: #7A6200; --gold-light: #b89a00;
    --muted: #93927c; --light-gray: #d8d9dd; --cream: #f4f0ea;
    --white: #ffffff; --error: #c0392b; --success: #1a6b3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--petrol); color: var(--cream); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .lang-row { display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto; scrollbar-width: none; width: 100%; }
  .lang-row::-webkit-scrollbar { display: none; }
  .lang-pill { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.15); background: transparent; color: var(--muted); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
  .lang-pill.active { background: var(--gold); border-color: var(--gold); color: var(--white); }
  .main { flex: 1; width: 100%; max-width: 480px; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .topic-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .topic-row::-webkit-scrollbar { display: none; }
  .topic-pill { flex-shrink: 0; padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: var(--light-gray); font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
  .topic-pill.active, .topic-pill:hover { background: rgba(122,98,0,0.3); border-color: var(--gold); color: var(--gold-light); }
  .transcript-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; min-height: 200px; max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { font-size: 0.88rem; line-height: 1.55; }
  .msg.tutor .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-light); margin-bottom: 4px; }
  .msg.tutor .bubble { background: rgba(122,98,0,0.18); border-left: 3px solid var(--gold); border-radius: 0 12px 12px 0; padding: 10px 13px; color: var(--cream); }
  .msg.user .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7ab8c0; margin-bottom: 4px; text-align: right; }
  .msg.user .bubble { background: rgba(0,84,100,0.4); border-right: 3px solid #7ab8c0; border-radius: 12px 0 0 12px; padding: 10px 13px; color: var(--cream); text-align: right; }
  .correction { background: rgba(255,200,0,0.08); border: 1px solid rgba(122,98,0,0.4); border-radius: 10px; padding: 9px 12px; font-size: 0.78rem; color: #d4b800; line-height: 1.6; margin-top: 6px; }
  .fix-main { font-size: 0.95rem; color: #9be3a8; font-weight: 500; }
  .fix-list { margin-top: 4px; color: #d4b800; }
  .fix-why { margin-top: 6px; color: #b8b49a; }
  .fix-why summary { cursor: pointer; color: #d4b800; text-decoration: underline; list-style: none; }
  .msg-tools { display: flex; gap: 6px; margin-top: 5px; }
  .msg-tools button { background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: var(--muted); font-size: 0.75rem; padding: 3px 9px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .msg-tr { margin-top: 5px; font-size: 0.8rem; color: #b8b49a; font-style: italic; line-height: 1.5; }
  .msg-tr.hide { display: none; }
  .msg.user mark.err { background: rgba(192,57,43,0.35); color: #ffd0c9; border-bottom: 2px solid #e57368; border-radius: 3px; padding: 0 2px; }
  .hint-btn { background: transparent; border: 1px solid rgba(184,154,0,0.6); color: var(--gold-light); border-radius: 20px; padding: 7px 16px; font-size: 0.82rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .suggest-box { display: none; width: 100%; flex-direction: column; gap: 6px; }
  .suggest-box.show { display: flex; }
  .suggest-chip { text-align: left; background: rgba(184,154,0,0.12); border: 1px solid rgba(184,154,0,0.4); color: var(--cream); border-radius: 12px; padding: 9px 12px; font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .suggest-note { font-size: 0.78rem; color: var(--muted); text-align: center; }

  /* RACHA 🔥 */
  .streak-badge { flex-shrink: 0; background: rgba(122,98,0,0.25); border: 1px solid var(--gold); color: var(--gold-light); border-radius: 16px; padding: 4px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .streak-badge.off { opacity: 0.55; }
  .celebrate { position: fixed; inset: 0; z-index: 1000; background: rgba(0,25,30,0.85); display: none; align-items: center; justify-content: center; padding: 16px; }
  .celebrate.show { display: flex; }
  .cel-card { background: var(--petrol); border: 2px solid var(--gold); border-radius: 20px; padding: 24px 18px; text-align: center; max-width: 340px; width: 100%; box-shadow: 0 0 40px rgba(184,154,0,0.35); }
  .cel-flame { font-size: 4rem; display: inline-block; animation: flame-pop 0.9s ease-out, flame-flicker 1.4s ease-in-out 0.9s infinite; }
  @keyframes flame-pop { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes flame-flicker { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.08) rotate(-3deg); } }
  .cel-title { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; color: var(--gold-light); margin-top: 6px; }
  .cel-sub { color: var(--cream); font-size: 0.9rem; margin-top: 4px; }
  .week-row { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.65rem; color: var(--muted); }
  .week-dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .week-dot.done { background: var(--gold); border-color: var(--gold); }
  .week-dot.today { box-shadow: 0 0 0 2px var(--gold-light); }
  .streak-stats { width: 100%; background: rgba(122,98,0,0.15); border: 1px solid rgba(122,98,0,0.5); border-radius: 14px; padding: 14px 10px; }
  .streak-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .streak-num { font-size: 1.4rem; color: var(--gold-light); font-weight: 600; }
  .streak-lbl { font-size: 0.68rem; color: var(--muted); }
  .backup-row { width: 100%; display: flex; gap: 10px; }
  .backup-btn { flex: 1; padding: 12px 8px; background: transparent; border: 1px solid var(--gold); color: var(--gold-light); border-radius: 12px; font-size: 0.82rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .streak-today { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 8px; }

  /* VISTAS E NAVEGAÇÃO */
  .view { display: none; width: 100%; }
  .view.active { display: flex; flex-direction: column; align-items: center; }
  .main { padding-bottom: 96px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; display: flex; justify-content: center; background: #002a31; border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; max-width: 120px; background: none; border: none; border-top: 2px solid transparent; color: var(--muted); padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .tabbar button .tab-ico { font-size: 1.25rem; opacity: 0.55; }
  .tabbar button.active { color: var(--gold-light); border-top-color: var(--gold); }
  .tabbar button.active .tab-ico { opacity: 1; }
  .chat-top { width: 100%; max-width: 480px; padding: 12px 20px 0; display: flex; align-items: center; }
  .back-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--cream); border-radius: 18px; padding: 6px 14px; font-size: 0.82rem; font-family: 'Inter', sans-serif; cursor: pointer; }

  /* 🏠 INÍCIO */
  .home-view.active { gap: 14px; max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; align-items: stretch; }
  .home-top { display: flex; align-items: center; gap: 12px; }
  .photo-circle { border-radius: 50%; border: 2px solid var(--gold); background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .home-photo { width: 56px; height: 56px; font-size: 1.6rem; }
  .home-hello { flex: 1; min-width: 0; }
  .home-hello h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem; font-weight: 400; color: var(--cream); overflow-wrap: anywhere; }
  .home-brand { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .home-tutor { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .home-avatar { width: 120px; height: 120px; }
  .home-sub { color: var(--light-gray); font-size: 0.9rem; text-align: center; }
  .home-view .lang-row { padding: 0; justify-content: center; flex-wrap: wrap; }
  .home-card { width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 16px; color: var(--cream); font-family: 'Inter', sans-serif; cursor: pointer; }
  .home-card.primary { background: rgba(122,98,0,0.25); border-color: var(--gold); }
  .home-card .ico { font-size: 1.8rem; flex-shrink: 0; }
  .home-card .ctxt { flex: 1; min-width: 0; }
  .home-card .ct { display: block; font-size: 1rem; font-weight: 600; }
  .home-card .cd { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  /* 👤 PERFIL E FOTO */
  .prof-view.active { gap: 20px; max-width: 480px; margin: 0 auto; padding: 24px 24px 110px; }
  .prof-view h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--cream); text-align: center; font-weight: 400; }
  .prof-view p { font-size: 0.83rem; color: var(--muted); text-align: center; line-height: 1.7; }
  .pf-photo-row { display: flex; align-items: center; gap: 14px; width: 100%; }
  .pf-photo { width: 84px; height: 84px; font-size: 2.4rem; }
  .pf-photo-btns { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; }
  .pf-photo-btns .backup-btn { flex: 1 1 45%; padding: 9px 6px; }
  .pf-check { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--cream); cursor: pointer; }
  .pf-check input { width: 20px; height: 20px; accent-color: var(--gold); flex-shrink: 0; }
  .pf-tests { width: 100%; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--cream); }
  .pf-tests .none { color: var(--muted); }
  .pf-tests .lvl { color: var(--gold-light); font-weight: 600; }
  .pf-tests .when { color: var(--muted); font-size: 0.75rem; }
  .test-card { background: rgba(122,98,0,0.15); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; margin-bottom: 6px; color: var(--cream); font-size: 0.85rem; line-height: 1.5; }
  .test-card .lvl-title { font-size: 1.05rem; font-weight: 600; color: var(--gold-light); margin-bottom: 4px; }
  .test-card .sec { margin-top: 8px; font-weight: 600; }
  .test-card ul { margin: 2px 0 0 18px; }
  .test-card .rec { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .test-card .rec button { text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--gold); background: transparent; color: var(--gold-light); font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .test-card .rec button.primary { background: var(--gold); color: var(--white); }
  .msg-hint { margin-top: 5px; font-size: 0.85rem; color: #9be3a8; }
  .msg-hint.hide { display: none; }
  .key-btn { width: 100%; border-color: rgba(192,57,43,0.7); color: #e57368; }
  .lbl-photo { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px; border: 1px solid #7ab8c0; }
  .nb-view.active { padding: 20px 16px 100px; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 1100; max-width: 90%; background: #0b3d47; border: 1px solid var(--gold); color: var(--cream); border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }

  /* 🌱 DO ZERO */
  .zero-intro { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .zero-item { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; color: var(--cream); font-family: 'Inter', sans-serif; cursor: pointer; }
  .zero-item.next { border-color: var(--gold); background: rgba(122,98,0,0.2); box-shadow: 0 0 0 1px var(--gold); }
  .zero-num { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; flex-shrink: 0; }
  .zero-item.done .zero-num { background: var(--gold); border-color: var(--gold); color: var(--white); }
  .zero-txt { flex: 1; min-width: 0; }
  .zero-title { font-size: 0.9rem; font-weight: 600; }
  .zero-goal { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .zero-tag { font-size: 0.7rem; color: var(--gold-light); flex-shrink: 0; }
  .lesson-banner { display: none; background: rgba(122,98,0,0.15); border: 1px solid rgba(122,98,0,0.5); border-radius: 12px; padding: 8px 12px; font-size: 0.8rem; color: var(--cream); line-height: 1.5; }
  .lesson-banner.show { display: block; }
  .lesson-banner b { color: var(--gold-light); }
  .lesson-banner .goal { color: var(--muted); }
  .ln-nat { color: #b8b49a; font-style: italic; }
  .zero-dots { display: flex; gap: 5px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .zero-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
  .zero-dot.done { background: var(--gold); border-color: var(--gold); }
  .cel-btns { display: flex; gap: 8px; margin-top: 16px; }
  .cel-btn { flex: 1; padding: 11px 8px; border-radius: 12px; border: 1px solid var(--gold); background: transparent; color: var(--gold-light); font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .cel-btn.primary { background: var(--gold); color: var(--white); }

  /* MEU CADERNO */
  .nb-screen { position: fixed; inset: 0; background: var(--petrol); z-index: 998; overflow-y: auto; padding: 20px 16px 30px; display: flex; flex-direction: column; align-items: center; }
  .nb-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  .nb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nb-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 400; color: var(--cream); }
  .nb-close { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--cream); border-radius: 50%; width: 36px; height: 36px; font-size: 1rem; cursor: pointer; flex-shrink: 0; }
  .nb-tabs { display: flex; gap: 8px; }
  .nb-tab { flex: 1; padding: 9px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.15); background: transparent; color: var(--muted); font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .nb-tab.active { background: var(--gold); border-color: var(--gold); color: var(--white); }
  .nb-list { display: flex; flex-direction: column; gap: 8px; }
  .nb-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
  .nb-body { flex: 1; min-width: 0; font-size: 0.88rem; line-height: 1.5; overflow-wrap: anywhere; }
  .nb-wrong { color: #e57368; text-decoration: line-through; }
  .nb-right { color: #9be3a8; font-weight: 500; }
  .nb-why { color: #b8b49a; font-size: 0.78rem; margin-top: 2px; }
  .nb-date { color: var(--muted); font-size: 0.7rem; margin-top: 4px; }
  .nb-actions { display: flex; flex-direction: column; gap: 6px; }
  .nb-actions button { background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: var(--cream); font-size: 0.85rem; width: 36px; height: 32px; cursor: pointer; }
  .nb-empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 30px 10px; line-height: 1.6; }
  .mic-section { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; }
  .mic-ring { position: relative; width: 96px; height: 96px; }
  .mic-ring-pulse { position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; transition: all 0.3s; }
  .mic-ring-pulse.active { opacity: 0.6; animation: pulse-ring 1.2s ease-out infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } }
  .mic-btn { width: 96px; height: 96px; border-radius: 50%; border: none; background: var(--gold); color: var(--white); font-size: 2rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(122,98,0,0.4); position: relative; z-index: 1; }
  .mic-btn.recording { background: #c0392b; box-shadow: 0 4px 24px rgba(192,57,43,0.5); animation: mic-pulse 1s ease-in-out infinite; }
  @keyframes mic-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .mic-label { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.05em; text-align: center; }
  .text-toggle { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .text-toggle span { font-size: 0.72rem; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .text-input-row { display: none; gap: 8px; align-items: flex-end; }
  .text-input-row.show { display: flex; }
  .text-inp { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 11px 14px; font-size: 0.87rem; color: var(--cream); font-family: 'Inter', sans-serif; outline: none; resize: none; min-height: 44px; }
  .text-inp::placeholder { color: var(--muted); }
  .text-inp:focus { border-color: var(--gold); }
  .send-btn { background: var(--gold); color: var(--white); border: none; border-radius: 12px; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .status-bar { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 14px; font-size: 0.78rem; color: var(--muted); text-align: center; min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status-dot.green { background: #2ecc71; animation: blink 1.2s infinite; }
  .status-dot.gold { background: var(--gold); }
  .status-dot.red { background: var(--error); }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .tip-strip { background: rgba(0,84,100,0.25); border-radius: 10px; padding: 10px 14px; font-size: 0.77rem; color: #7ab8c0; line-height: 1.55; border-left: 3px solid #7ab8c0; }
  .tip-strip strong { color: var(--cream); }
  .avatar-wrap { display: flex; justify-content: center; margin: 0; padding: 6px 0 8px; position: sticky; top: 0; z-index: 50; background: var(--petrol); }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #f4f0ea 0%, #d8d9dd 100%); border: 3px solid var(--gold); box-shadow: 0 6px 24px rgba(0,0,0,0.35); overflow: hidden; transition: box-shadow .3s, transform .3s; }
  .avatar.listening { box-shadow: 0 0 0 6px rgba(46,204,113,0.35), 0 6px 24px rgba(0,0,0,0.35); }
  .avatar.talking { animation: av-bob 1.6s ease-in-out infinite; }

<script>

const DEFAULT_LEVELS = { es: 'intermediário', en: 'básico', fr: 'iniciante', it: 'iniciante', pt: 'iniciante' };

let uiOverride = null; // língua escolhida no perfil antes de guardar (pré-visualização)
function detectNative() {
  const l = (navigator.language || 'pt-BR').toLowerCase();
  if (l === 'pt-pt') return 'pt-PT';
  const base = l.split('-')[0];
  return ['es', 'en', 'fr', 'it'].includes(base) ? base : 'pt-BR';
}
// Perfis antigos guardavam só "expl" (variante do português das explicações).
function getNative(P) {
  if (P && NATIVES[P.native]) return P.native;
  if (P && P.expl === 'português de Portugal') return 'pt-PT';
  return P ? 'pt-BR' : detectNative();
}
function nativeInfo() { return NATIVES[uiOverride || getNative(PROFILE)]; }
function uiLang() { return nativeInfo().ui; }
function t(key, vars) {
  const d = I18N[uiLang()] || I18N['pt-BR'];
  let s = d[key] != null ? d[key] : (I18N['pt-BR'][key] != null ? I18N['pt-BR'][key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function langUI(code) { return t('lang_' + code); }
function visibleLangs() { const hide = nativeInfo().hide; return LANGS.filter(l => l.code !== hide); }

// Aplica o dicionário a todos os elementos marcados com data-i18n*.
function applyI18n() {
  document.documentElement.lang = uiLang();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.getElementById('mic-label').textContent = isRecording ? t('mic_listening') : t('mic_tap');
  document.getElementById('tip-text').textContent = (TIPS[uiLang()] || {})[currentLang] || '';
  renderLangPills();
  updateStreakBadge();
  updateLessonBanner();
  if (currentView === 'notebook') renderNotebook();
  renderHome();
  if (document.getElementById('zero-screen').style.display !== 'none') renderZero();
}

// Seletores de idioma (no Início e na conversa).
function renderLangPills() {
  document.querySelectorAll('.lang-row').forEach(row => {
    row.innerHTML = '';
    visibleLangs().forEach(l => {
      const b = document.createElement('button');
      b.className = 'lang-pill' + (l.code === currentLang ? ' active' : '');
      b.textContent = langFlag(l.code) + ' ' + langUI(l.code);
      b.onclick = () => setLang(l.code);
      row.appendChild(b);
    });
  });
}

// Se o idioma atual for igual à língua nativa (escondido), passa para o primeiro visível.
function ensureVisibleLang() {
  applyLangVars();
  if (visibleLangs().some(l => l.code === currentLang)) return;
  const l = visibleLangs()[0];
  currentLang = l.code; applyLangVars();
}

// ── PROFILE ──
let PROFILE = null;
function loadProfile() {
  try { return JSON.parse(localStorage.getItem('tutora_profile') || 'null'); } catch(e) { return null; }
}
function renderLevelGrid(levels) {
  const grid = document.getElementById('pf-levels');
  const cur = {};
  LANGS.forEach(l => { const s = document.getElementById('pf-lv-' + l.code); if (s) cur[l.code] = s.value; });
  grid.innerHTML = '';
  // "Variante do português" só aparece quando o português está disponível para aprender.
  document.getElementById('pf-ptvar-wrap').style.display = visibleLangs().some(l => l.code === 'pt') ? 'contents' : 'none';
  visibleLangs().forEach(l => {
    const lab = document.createElement('label');
    lab.className = 'prof-label'; lab.style.margin = '0';
    lab.append(langFlag(l.code) + ' ' + langUI(l.code));
    const sel = document.createElement('select');
    sel.className = 'api-select'; sel.id = 'pf-lv-' + l.code;
    LEVELS.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = t('lvl_' + v); sel.appendChild(o); });
    sel.value = (levels && levels[l.code]) || cur[l.code] || DEFAULT_LEVELS[l.code];
    lab.appendChild(sel);
    grid.appendChild(lab);
  });
}
// Ao mudar "Minha língua" no perfil, a tela do perfil passa logo para essa língua.
function previewNative(v) { uiOverride = v; applyI18n(); renderLevelGrid(); renderStreakStats(); }
// Preenche os campos do perfil com os dados guardados.
function fillProfileForm() {
  const p = PROFILE || {};
  uiOverride = null;
  document.getElementById('pf-native').value = getNative(PROFILE);
  document.getElementById('pf-name').value = p.name || '';
  document.getElementById('pf-city').value = p.city || '';
  document.getElementById('pf-speed').value = p.speed || 'normal';
  document.getElementById('pf-accent').value = p.accent || 'Espanha';
  document.getElementById('pf-ptvar').value = p.ptVariant || 'Brasil';
  document.getElementById('pf-style').value = p.style || 'amigável';
  document.getElementById('pf-readnat').checked = !!p.readNative;
  applyI18n();
  renderLevelGrid(p.levels || DEFAULT_LEVELS);
  renderStreakStats();
  renderTestsSummary();
  renderPhotos();
}
function saveProfile() {
  const name = document.getElementById('pf-name').value.trim();
  if (!name) { alert(t('name_required')); return; }
  const old = PROFILE;
  const levels = Object.assign({}, DEFAULT_LEVELS, (PROFILE && PROFILE.levels) || {});
  LANGS.forEach(l => { const s = document.getElementById('pf-lv-' + l.code); if (s) levels[l.code] = s.value; });
  PROFILE = {
    name, city: document.getElementById('pf-city').value.trim(),
    native: document.getElementById('pf-native').value, levels,
    speed: document.getElementById('pf-speed').value,
    accent: document.getElementById('pf-accent').value,
    ptVariant: document.getElementById('pf-ptvar').value,
    style: document.getElementById('pf-style').value,
    readNative: document.getElementById('pf-readnat').checked
  };
  uiOverride = null;
  const langChanged = old && (getNative(old) !== PROFILE.native || (old.ptVariant || 'Brasil') !== PROFILE.ptVariant);
  if (langChanged) { try { localStorage.removeItem(LESSON_KEY); } catch(e) {} }
  try { localStorage.setItem('tutora_profile', JSON.stringify(PROFILE)); } catch(e) {}
  chatHistory = []; repeatTarget = ""; repeatTries = 0; clearTranscript();
  init();
  goHome();
  if (langChanged) showToast(t('lang_changed'));
}
function startApp() {
  PROFILE = loadProfile();
  if (!PROFILE) { fillProfileForm(); showView('profile'); return; } // primeira vez: perfil sem barra de navegação
  init();
  goHome();
}

// ── API KEY ──
function saveKey() {
  const k = document.getElementById('api-key-input').value.trim();
  if (!k.startsWith('sk-ant-') && !k.startsWith('sk-')) {
    alert(t('key_invalid'));
    return;
  }
  try { localStorage.setItem('eliana_api_key', k); } catch(e) {}
  API_KEY = k;
  document.getElementById('setup-screen').style.display = 'none';
  startApp();
}

function clearKey() {
  try { localStorage.removeItem('eliana_api_key'); } catch(e) {}
  API_KEY = '';
  document.getElementById('api-key-input').value = '';
  document.getElementById('setup-screen').style.display = 'flex';
}

function loadKey() {
  try { return localStorage.getItem('eliana_api_key') || ''; } catch(e) { return ''; }
}

// ── INIT ──
window.addEventListener('load', () => {
  // O Início é a base do histórico: o "voltar" das outras telas volta aqui; no Início, sai do app.
  try { history.replaceState({ view: 'home' }, ''); } catch(e) {}
  document.getElementById('home-avatar').innerHTML = document.getElementById('avatar').innerHTML;
  PROFILE = loadProfile();
  // Idioma escolhido da última vez (se ainda estiver visível para a língua nativa).
  try { const sl = localStorage.getItem('tutora_idioma'); if (LANGS.some(l => l.code === sl)) currentLang = sl; } catch(e) {}
  ensureVisibleLang();
  applyI18n();
  setStatus('ready', t('st_starting'));
  API_KEY = loadKey();
  if (API_KEY) {
    document.getElementById('setup-screen').style.display = 'none';
    startApp();
  }
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  updateStreakBadge();
});

function init() {
  ensureVisibleLang();
  exitLesson();
  exitTest();
  applyI18n();
  setStatus('ready', t('st_ready_start'));
  initRecognition();
  renderHome();
  // A conversa (e a saudação da tutora) só começa ao abrir "Conversar".
  if (currentView === 'chat') setTimeout(ensureChatStarted, 600);
}

// ── TELAS E NAVEGAÇÃO ──
// Vistas: home, chat, notebook, profile. O Início fica na base do histórico; as outras telas ocupam
// uma única entrada por cima dele, para que o "voltar" do Android leve sempre ao Início.
let currentView = 'home';
function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('tabbar').style.display = PROFILE ? 'flex' : 'none';
  const prev = currentView;
  currentView = v;
  // Sair do Perfil sem salvar desfaz a pré-visualização de "Minha língua".
  if (prev === 'profile' && v !== 'profile' && uiOverride) { uiOverride = null; applyI18n(); }
  window.scrollTo(0, 0);
  if (v !== 'chat' && prev === 'chat') { stopRecording(); synth.cancel(); }
  if (v === 'home') renderHome();
  if (v === 'notebook') renderNotebook();
  if (v === 'profile' && PROFILE) fillProfileForm();
  if (v === 'chat') ensureChatStarted();
}
// history.back() é assíncrono: enquanto houver um "voltar" pendente, não se volta outra vez
// (sairia do app) e a navegação seguinte espera pelo popstate.
let backPending = false, pendingNav = null;
function navTo(v) {
  if (v === 'home') { goHome(); return; }
  if (!PROFILE) return;
  if (backPending) { pendingNav = v; return; }
  const st = history.state;
  try {
    if (st && st.view && st.view !== 'home') history.replaceState({ view: v }, '');
    else history.pushState({ view: v }, '');
  } catch(e) {}
  showView(v);
}
function goHome() {
  pendingNav = null;
  if (backPending) return;
  const st = history.state;
  if (st && st.view && st.view !== 'home') { backPending = true; history.back(); } // o popstate mostra o Início
  else showView('home');
}
window.addEventListener('popstate', (e) => {
  backPending = false;
  if (!PROFILE) return; // ainda no primeiro perfil
  document.getElementById('zero-screen').style.display = 'none';
  hideCelebrate();
  showView((e.state && e.state.view) || 'home');
  if (pendingNav) { const v = pendingNav; pendingNav = null; navTo(v); }
});

// Ao entrar em "Conversar" sem conversa: abre a trilha (iniciante, 1.ª vez) ou a tutora cumprimenta.
function ensureChatStarted() {
  if (!PROFILE || currentTest || document.getElementById('transcript').children.length) return;
  if (!maybeAutoZero()) greet();
}

function renderHome() {
  if (!PROFILE) return;
  document.getElementById('home-hello').textContent = t('home_hello', { name: PROFILE.name });
  const e = zeroLang(), card = document.getElementById('card-continue');
  const cur = Number.isInteger(e.current) && !e.done.includes(e.current) ? e.current : null;
  card.style.display = cur === null ? 'none' : 'flex';
  if (cur !== null) {
    document.getElementById('card-continue-t').textContent = t('card_continue', { n: cur + 1 });
    document.getElementById('card-continue-d').textContent = lessonUI(cur)[0];
  }
  const last = testLoad()[currentLang], lv = last && normLevel(last.level);
  document.getElementById('card-test-d').textContent = lv ? t('card_test_last', { level: t('lvl_' + lv) }) : t('card_test_d');
  renderPhotos();
}
// "Continuar lição": se a lição ainda está aberta na conversa, volta a ela; senão, repõe a conversa guardada
// (startLesson retoma a sessão gravada) ou, se não houver, começa-a.
function continueLesson() {
  const e = zeroLang();
  if (!Number.isInteger(e.current)) return;
  if (currentLesson !== e.current || !document.getElementById('transcript').children.length) startLesson(e.current);
  navTo('chat');
}

function loadVoices() { voices = synth.getVoices(); }

// Locale da voz e do microfone: espanhol da América Latina usa es-MX (conforme o perfil).
function voiceLocale() {
  return currentLang === 'es' && PROFILE && PROFILE.accent === 'América Latina' ? 'es-MX' : currentLocale;
}

function getBestVoice(locale) {
  const base = locale.split('-')[0].toLowerCase();
  const norm = l => (l || '').replace('_', '-').toLowerCase();
  const latam = locale === 'es-MX';
  const same = voices.filter(v => latam ? /^es-(mx|us|419|ar|co|cl|pe)$/.test(norm(v.lang)) : norm(v.lang) === locale.toLowerCase());
  const lang = voices.filter(v => norm(v.lang).startsWith(base) && !(latam && norm(v.lang) === 'es-es'));
  const any = voices.filter(v => norm(v.lang).startsWith(base));
  const rank = v => /natural|neural|online|premium|enhanced/i.test(v.name) ? 0 : /google/i.test(v.name) ? 1 : v.localService === false ? 2 : 3;
  const pick = list => list.slice().sort((a, b) => rank(a) - rank(b))[0];
  return pick(same) || pick(lang) || pick(any) || voices[0];
}

const RATES = { lenta: 0.75, normal: 0.95, 'rápida': 1.15 };

// ── LANGUAGE & TOPIC ──
function setLang(code) {
  const l = LANGS.find(x => x.code === code);
  if (!l) return;
  currentLang = l.code; applyLangVars();
  try { localStorage.setItem('tutora_idioma', l.code); } catch(e) {}
  renderLangPills();
  document.getElementById('tip-text').textContent = (TIPS[uiLang()] || {})[code] || '';
  chatHistory = []; repeatTarget = ''; repeatTries = 0; clearTranscript(); stopRecording(); synth.cancel();
  exitLesson();
  exitTest();
  initRecognition();
  renderHome();
  if (currentView === 'chat') setTimeout(ensureChatStarted, 300);
}

function setTopic(el, topic) {
  currentTopic = topic;
  exitTest();
  currentLesson = null; updateLessonBanner();
  document.querySelectorAll('.topic-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  chatHistory = []; repeatTarget = ""; repeatTries = 0; clearTranscript(); synth.cancel();
  setTimeout(() => greet(), 200);
}

// ── 🌱 DO ZERO ──
// localStorage 'tutora_zero' = { es: { done: [índices das lições concluídas], seen: true }, ... }
const ZERO_KEY = 'tutora_zero', ZERO_TOTAL = 12;
let currentLesson = null, lessonCompleted = false, topicElBeforeLesson = null;
function zeroLoad() {
  try { const z = JSON.parse(localStorage.getItem(ZERO_KEY) || '{}'); return z && typeof z === 'object' ? z : {}; } catch(e) { return {}; }
}
function zeroStore(z) { try { localStorage.setItem(ZERO_KEY, JSON.stringify(z)); } catch(e) {} }
function zeroLang() {
  const e = zeroLoad()[currentLang];
  const cur = e && Number.isInteger(e.current) && e.current >= 0 && e.current < ZERO_TOTAL ? e.current : null;
  return { done: e && Array.isArray(e.done) ? e.done.filter(n => Number.isInteger(n) && n >= 0 && n < ZERO_TOTAL) : [], seen: !!(e && e.seen), current: cur };
}
function zeroSave(entry) { const z = zeroLoad(); z[currentLang] = entry; zeroStore(z); }
function nextLessonIdx(done) { for (let i = 0; i < ZERO_TOTAL; i++) if (!done.includes(i)) return i; return -1; }

function openZero() {
  stopRecording(); synth.cancel();
  const e = zeroLang();
  if (!e.seen) { e.seen = true; zeroSave(e); }
  renderZero();
  document.getElementById('zero-screen').style.display = 'flex';
}
function closeZero() {
  document.getElementById('zero-screen').style.display = 'none';
  // Se a trilha abriu sozinha e a aluna fechou sem escolher, começa a conversa normal.
  if (currentLesson === null && !document.getElementById('transcript').children.length) greet();
}
function renderZero() {
  document.getElementById('zero-title').textContent = t('zero_title', { lang: langUI(currentLang) });
  const { done } = zeroLang(), next = nextLessonIdx(done);
  const list = document.getElementById('zero-list');
  list.innerHTML = '';
  for (let i = 0; i < ZERO_TOTAL; i++) {
    const [title, goal] = lessonUI(i);
    const b = document.createElement('button');
    b.className = 'zero-item' + (done.includes(i) ? ' done' : '') + (i === next ? ' next' : '');
    b.innerHTML = `<div class="zero-num">${done.includes(i) ? '✓' : i + 1}</div>` +
      `<div class="zero-txt"><div class="zero-title">${esc(title)}</div><div class="zero-goal">${esc(goal)}</div></div>` +
      (done.includes(i) ? `<div class="zero-tag">${esc(t('zero_done_tag'))}</div>` : i === next ? `<div class="zero-tag">${esc(t('zero_next'))}</div>` : '');
    b.onclick = () => startLesson(i);
    list.appendChild(b);
  }
}
// Na primeira vez num idioma em que o perfil diz "iniciante", abre a trilha sozinha.
function maybeAutoZero() {
  if (!PROFILE) return false;
  const lvl = (PROFILE.levels || {})[currentLang] || DEFAULT_LEVELS[currentLang];
  if (lvl === 'iniciante' && !zeroLang().seen) { openZero(); return true; }
  return false;
}

// ── Conversa da lição em andamento (para "Continuar lição" retomar de onde parou) ──
// localStorage 'tutora_licao' = { idioma: { lesson, history: chatHistory, log: [mensagens mostradas] } }
const LESSON_KEY = 'tutora_licao';
let lessonLog = [], restoringLesson = false;
function lessonSessions() { try { const s = JSON.parse(localStorage.getItem(LESSON_KEY) || '{}'); return s && typeof s === 'object' ? s : {}; } catch(e) { return {}; } }
function saveLessonSession() {
  if (currentLesson === null || restoringLesson || lessonCompleted) return;
  const all = lessonSessions();
  all[currentLang] = { lesson: currentLesson, native: getNative(PROFILE), ptVariant: (PROFILE && PROFILE.ptVariant) || 'Brasil', history: chatHistory.slice(-60), log: lessonLog.slice(-80) };
  try { localStorage.setItem(LESSON_KEY, JSON.stringify(all)); } catch(e) {}
}
function clearLessonSession() {
  const all = lessonSessions();
  delete all[currentLang];
  try { localStorage.setItem(LESSON_KEY, JSON.stringify(all)); } catch(e) {}
}

// Abre a lição i. Se houver conversa guardada dessa lição (e resume não for false), retoma-a; senão começa do início.
function startLesson(i, resume) {
  exitTest();
  document.getElementById('zero-screen').style.display = 'none';
  if (currentLesson === null) topicElBeforeLesson = document.querySelector('.topic-pill.active:not(#zero-pill)');
  currentLesson = i; lessonCompleted = false;
  const ze = zeroLang(); ze.current = i; ze.seen = true; zeroSave(ze); // lição em andamento (cartão "Continuar" no Início)
  document.querySelectorAll('.topic-pill').forEach(b => b.classList.remove('active'));
  document.getElementById('zero-pill').classList.add('active');
  chatHistory = []; repeatTarget = ''; repeatTries = 0; clearTranscript(); stopRecording(); synth.cancel();
  lessonLog = [];
  updateLessonBanner();
  const sess = lessonSessions()[currentLang];
  // Só se retoma uma conversa criada com a mesma língua nativa e a mesma variante do português.
  const sameLang = sess && sess.native === getNative(PROFILE) && (sess.ptVariant || 'Brasil') === ((PROFILE && PROFILE.ptVariant) || 'Brasil');
  if (resume !== false && sess && sess.lesson === i && !sameLang) showToast(t('lang_changed'));
  if (resume !== false && sameLang && sess.lesson === i && Array.isArray(sess.log) && sess.log.length && Array.isArray(sess.history)) {
    restoringLesson = true;
    chatHistory = sess.history.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
    sess.log.forEach(m => {
      if (!m || (m.role !== 'user' && m.role !== 'tutor')) return;
      const div = addMsg(m.role, String(m.text || ''), m.correction, m.correctionFirst, m.spoken, m.saveText, m.hint);
      lessonLog.push(m);
      div.dataset.log = lessonLog.length - 1;
      if (m.role === 'user') { lastUserDiv = div; if (m.hl) highlightError(div, m.hl); }
    });
    restoringLesson = false;
    setStatus('ready', t('st_ready_reply'));
    return;
  }
  clearLessonSession();
  greet();
}
function exitLesson() {
  if (currentLesson === null) return;
  currentLesson = null;
  document.getElementById('zero-pill').classList.remove('active');
  if (topicElBeforeLesson) topicElBeforeLesson.classList.add('active');
  updateLessonBanner();
}
function updateLessonBanner() {
  const el = document.getElementById('lesson-banner');
  if (currentTest) {
    const total = currentTest.q.length || TEST_TOTAL;
    const txt = currentTest.done ? t('test_done_banner') : currentTest.finished ? t('test_evaluating') : t('test_banner', { n: Math.min(currentTest.idx + 1, total), total });
    el.innerHTML = `<b>${esc(txt)}</b>`;
    el.classList.add('show');
    return;
  }
  if (currentLesson === null) { el.classList.remove('show'); el.innerHTML = ''; return; }
  const [title, goal] = lessonUI(currentLesson);
  el.innerHTML = `<b>🌱 ${esc(t('lesson_banner', { n: currentLesson + 1 }))} · ${esc(title)}</b><br><span class="goal">${esc(goal)}</span>`;
  el.classList.add('show');
}
function markLessonDone(i) {
  const e = zeroLang();
  if (!e.done.includes(i)) e.done.push(i);
  e.seen = true;
  if (e.current === i) e.current = null;
  zeroSave(e);
  clearLessonSession(); // lição concluída: a conversa guardada já não é precisa
}
function celebrateLesson(i) {
  const { done } = zeroLang(), next = nextLessonIdx(done);
  const [title] = lessonUI(i);
  const dots = '<div class="zero-dots">' + Array.from({ length: ZERO_TOTAL }, (_, k) => `<div class="zero-dot${done.includes(k) ? ' done' : ''}"></div>`).join('') + '</div>';
  document.getElementById('cel-card').innerHTML =
    `<div class="cel-flame">🌱</div><div class="cel-title">✓ ${esc(t('lesson_done'))}</div>` +
    `<div class="cel-sub">${esc(title)}</div>${dots}` +
    (next < 0 ? `<div class="cel-sub" style="margin-top:10px">${esc(t('all_done'))}</div>` : '') +
    `<div class="cel-btns">` +
    (next >= 0 ? `<button class="cel-btn primary" id="cel-next">${esc(t('next_lesson_btn'))}</button>` : '') +
    `<button class="cel-btn" id="cel-close">${esc(t('close'))}</button></div>`;
  const nb = document.getElementById('cel-next');
  if (nb) nb.onclick = (ev) => { ev.stopPropagation(); hideCelebrate(); startLesson(next); };
  document.getElementById('cel-close').onclick = (ev) => { ev.stopPropagation(); hideCelebrate(); };
  clearTimeout(celebrateTimer);
  document.getElementById('celebrate').classList.add('show');
}

// ── SPEECH RECOGNITION ──
let repeatTarget = '', repeatTries = 0;
let wantRecording = false, sendOnEnd = false, finalText = '', sessionParts = [], interimText = '';

function sessionText() {
  const parts = sessionParts.filter(Boolean);
  const kept = parts.filter((p, i) => !(parts[i + 1] && parts[i + 1].trim().toLowerCase().startsWith(p.trim().toLowerCase())));
  return kept.join(' ').trim();
}

function fullText() {
  return [finalText, sessionText(), interimText].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
}

function avatarState(cls, on) {
  const a = document.getElementById('avatar'); if (a) a.classList.toggle(cls, on);
}

function setMicUI(on) {
  avatarState('listening', on);
  const cb = document.getElementById('cancel-btn'); if (cb) cb.classList.toggle('show', on);
  const btn = document.getElementById('mic-btn');
  btn.classList.toggle('recording', on);
  btn.textContent = on ? '⏹' : '🎤';
  document.getElementById('mic-ring').classList.toggle('active', on);
  document.getElementById('mic-label').textContent = on ? t('mic_listening') : t('mic_tap');
}

function initRecognition() {
  if (recognition) { try { recognition.onend = null; recognition.abort(); } catch(e) {} }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('error', t('st_chrome')); return; }
  recognition = new SR();
  recognition.lang = voiceLocale();
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => { sessionParts = []; interimText = ''; };

  recognition.onresult = (e) => {
    interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) sessionParts[i] = t; else interimText += t;
    }
    const txt = fullText();
    if (txt) setStatus('green', '🎙️ ' + txt);
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wantRecording = false; sendOnEnd = false; setMicUI(false);
      setStatus('error', t('st_mic_blocked'));
    }
  };

  recognition.onend = () => {
    const st = sessionText();
    if (st) finalText = [finalText, st].filter(Boolean).join(' ');
    else if (interimText) finalText = [finalText, interimText].filter(Boolean).join(' ');
    sessionParts = []; interimText = '';
    if (wantRecording) {
      try { recognition.start(); } catch(e) { setTimeout(() => { try { recognition.start(); } catch(_) {} }, 250); }
      return;
    }
    isRecording = false;
    setMicUI(false);
    if (sendOnEnd) {
      sendOnEnd = false;
      const text = finalText.replace(/\s+/g, ' ').trim();
      finalText = '';
      if (text) handleUserSpeech(text);
      else setStatus('ready', t('st_nothing'));
    }
  };
}

function toggleMic() {
  if (isSpeaking) { synth.cancel(); isSpeaking = false; document.getElementById('speaking-badge').classList.remove('show'); avatarState('talking', false); }
  if (isRecording) { finishRecording(); return; }
  startRecording();
}

function startRecording() {
  if (!recognition) initRecognition();
  if (!recognition) return;
  finalText = ''; sessionParts = []; interimText = '';
  wantRecording = true; sendOnEnd = false; isRecording = true;
  setMicUI(true);
  setStatus('green', t('st_listening'));
  try { recognition.start(); } catch(e) { initRecognition(); setTimeout(() => { try { recognition.start(); } catch(_) {} }, 250); }
}

function cancelRecording() {
  wantRecording = false; sendOnEnd = false; isRecording = false;
  finalText = ''; sessionParts = []; interimText = '';
  try { if (recognition) recognition.abort(); } catch(e) {}
  setMicUI(false);
  setStatus('ready', t('st_cancelled'));
}

function finishRecording() {
  wantRecording = false; sendOnEnd = true;
  setStatus('gold', t('st_sending'));
  try { recognition.stop(); } catch(e) { recognition.onend && recognition.onend(); }
}

function stopRecording() {
  wantRecording = false; sendOnEnd = false; isRecording = false;
  finalText = ''; sessionParts = []; interimText = '';
  setMicUI(false);
  if (!isSpeaking) setStatus('ready', t('st_ready'));
  try { if (recognition) recognition.abort(); } catch(e) {}
}

// ── SPEECH SYNTHESIS ──
// Marcas de voz no início das linhas: [nat] = língua nativa do aluno, [alvo] = idioma estudado (linha sem marca = idioma estudado).
const VOICE_TAG = /^\s*\[(nat|alvo)\]\s*/i;
function stripTags(text) { return String(text || '').split('\n').map(l => l.replace(VOICE_TAG, '')).join('\n').replace(/\[(nat|alvo)\]\s*/gi, ''); }
// Só as linhas [alvo] são lidas em voz alta; as [nat] só se o perfil tiver "Ler explicações em voz alta".
// As traduções entre parênteses ficam sempre só escritas.
function voiceParts(text) {
  const parts = [];
  const readNat = !!(PROFILE && PROFILE.readNative);
  String(text || '').split('\n').forEach(line => {
    const m = line.match(VOICE_TAG);
    const who = m ? m[1].toLowerCase() : 'alvo';
    if (who === 'nat' && !readNat) return;
    const s = line.replace(VOICE_TAG, '').replace(/\[(nat|alvo)\]\s*/gi, '').replace(/[📝✅❌🎤🔊💡👤🛒🏥🏠🏦🎓🗣️🎯🔁💬🌐🌱]/gu, '').replace(/\*\*/g, '')
      .replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return;
    const last = parts[parts.length - 1];
    if (last && last.who === who) last.text += ' ' + s; else parts.push({ who, text: s });
  });
  return parts;
}
// Voz da língua nativa (para as linhas [nat]).
function nativeVoiceLocale() {
  const n = getNative(PROFILE);
  if (n === 'es') return PROFILE && PROFILE.accent === 'América Latina' ? 'es-MX' : 'es-ES';
  return NATIVES[n].locale;
}

let speakToken = 0;
function speak(text, onEnd) {
  synth.cancel();
  const token = ++speakToken;
  const parts = voiceParts(text);
  if (typeof SpeechSynthesisUtterance === 'undefined' || !parts.length) { if (onEnd) onEnd(); return; }
  const base = RATES[PROFILE && PROFILE.speed] || 0.95;
  isSpeaking = true;
  document.getElementById('speaking-badge').classList.add('show'); avatarState('talking', true);
  setStatus('green', t('speaking'));
  let finished = false;
  const finish = (ok) => {
    if (finished || token !== speakToken) return; // já terminou, ou já começou outra fala
    finished = true;
    isSpeaking = false;
    document.getElementById('speaking-badge').classList.remove('show'); avatarState('talking', false);
    setStatus('ready', ok ? t('st_ready_reply') : t('st_ready'));
    if (onEnd) onEnd();
  };
  parts.forEach((p, i) => {
    const utt = new SpeechSynthesisUtterance(p.text);
    const loc = p.who === 'nat' ? nativeVoiceLocale() : voiceLocale();
    utt.lang = loc; utt.pitch = 1.0;
    // No modo Do zero, o idioma estudado é lido mais devagar.
    utt.rate = p.who === 'alvo' && currentLesson !== null ? Math.max(0.55, base * 0.8) : base;
    const voice = getBestVoice(loc);
    if (voice) utt.voice = voice;
    if (i === parts.length - 1) utt.onend = () => finish(true);
    utt.onerror = () => finish(false);
    synth.speak(utt);
  });
}

// Resposta da tutora no modo Do zero: linhas [nat]/[alvo], no máximo uma 📝, e 🎯 LIÇÃO CONCLUÍDA no fim.
function processLessonReply(reply) {
  const finished = /🎯\s*LI[CÇ][AÃ]O\s+CONCLU[IÍ]DA/i.test(reply);
  const lines = reply.replace(/🎯[^\n]*/gu, '').split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
  const starts = (l, s) => l.trim().startsWith(s);
  const formKey = s => (s || '').replace(/^[📝\s]+/u, '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const gramFix = lines.filter(l => starts(l, '📝') && l.includes('→')).filter(l => {
    const [a, b] = l.split('·')[0].split('→'); return formKey(a) && formKey(b) && formKey(a) !== formKey(b);
  }).slice(0, 1);
  // 💡 = resposta do passo LEMBRAR: fica escondida num botão "Dica" (nem escrita no balão, nem lida).
  const hint = lines.filter(l => starts(l, '💡')).map(l => l.trim().replace(/^💡\s*/u, '').replace(VOICE_TAG, '')).join(' · ');
  const main = lines.filter(l => !['📝', '✅', '🗣', '💡'].some(s => starts(l, s))).join('\n').trim();
  chatHistory.push({ role: 'assistant', content: [main, ...gramFix, hint ? '💡 ' + hint : ''].filter(Boolean).join('\n') });
  let html = '';
  if (gramFix.length) {
    const unq = s => (s || '').replace(/^[📝\s]+/u, '').replace(/["“”«»]/g, '').trim();
    const p0 = gramFix[0].split('·'), [wa, wb] = p0[0].split('→').map(unq), why = p0.slice(1).join('·').trim();
    highlightError(lastUserDiv, wa);
    if (wa && wb) nbAdd({ type: 'erro', wrong: wa, right: wb, why });
    html = `<div class="fix-list">${esc('📝 ' + wa + ' → ' + wb)}</div>` +
      (why ? `<details class="fix-why"><summary>${esc(t('why'))}</summary>${esc(why)}</details>` : '');
  }
  // ⭐ guarda a primeira frase no idioma estudado.
  const firstAlvo = (main.split('\n').find(l => !/^\s*\[nat\]/i.test(l)) || '').replace(VOICE_TAG, '');
  addMsg('tutor', main || stripTags(reply), html, true, main, firstAlvo, hint);
  if (finished && !lessonCompleted && currentLesson !== null) {
    const i = currentLesson;
    lessonCompleted = true;
    markLessonDone(i);
    let shown = false;
    const show = () => { if (shown) return; shown = true; celebrateLesson(i); };
    speak(main, show);
    setTimeout(show, 12000); // se a voz falhar ou for interrompida
  } else {
    speak(main);
  }
}
