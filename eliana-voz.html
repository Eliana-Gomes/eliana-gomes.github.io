<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Parlia</title>
<meta name="theme-color" content="#0B2A30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlia">
<link rel="apple-touch-icon" href="/tutora-icon-192.png">
<link rel="icon" type="image/png" href="/tutora-icon-192.png">
<link rel="manifest" href="/tutora-manifest.json">
<link rel="preload" as="image" href="parlia-logo.webp" type="image/webp">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');
  /* Cores da marca: ouro antigo (principal, brilho, profundo), petróleo noite e petróleo. */
  :root {
    --gold: #BC8833; --gold-glow: #DBA84C; --gold-deep: #9D6F26; --night: #0B2A30; --petrol: #00343D;
    --cream: #F4F0EA; --white: #ffffff; --error: #c0392b; --success: #1a6b3c;
    /* Tema das áreas de identidade (escuro): Início, celebrações, faixa da lição, barra de baixo. */
    --bg: var(--night); --surface: rgba(255,255,255,0.05); --surface-2: rgba(255,255,255,0.08);
    --line: rgba(255,255,255,0.14); --text: #F4F0EA; --text-2: #C9C2B6; --muted: #A9B4B2;
    --accent: #DBA84C; --accent-title: #DBA84C; --fill: #BC8833; --on-fill: #0B2A30;
    --fix-bg: rgba(219,168,76,0.12); --fix-line: #DBA84C; --fix-text: #F3DDB0;
    --ok: #9be3a8; --err: #f08a7e; --err-bg: rgba(192,57,43,0.35);
    --tutor-bg: rgba(188,136,51,0.14); --user-bg: rgba(0,84,100,0.45); --user-line: #7ab8c0; --user-label: #9fd0d6;
    --input-bg: rgba(255,255,255,0.06); --chip-bg: rgba(219,168,76,0.12); --busy: #5a5a4a; --shadow: rgba(0,0,0,0.35);
  }
  /* Telas de estudo (Conversar, lição, teste, Caderno, Perfil): creme, cartões brancos, texto escuro. */
  body.study {
    --bg: #F4F0EA; --surface: #FFFFFF; --surface-2: #FBF8F3;
    --line: #E6DCCB; --text: #1F2A2C; --text-2: #5A5348; --muted: #6E6659;
    --accent: #8A6220; --accent-title: #9D6F26; --fill: #BC8833; --on-fill: #0B2A30;
    --fix-bg: #FBF3E3; --fix-line: #DBA84C; --fix-text: #5C3F10;
    --ok: #1a6b3c; --err: #b03a2e; --err-bg: #fbe1dd;
    --tutor-bg: #FFFFFF; --user-bg: #E3EEEF; --user-line: #00343D; --user-label: #00343D;
    --input-bg: #FFFFFF; --chip-bg: #FBF3E3; --busy: #B8AE9C; --shadow: rgba(60,45,20,0.12);
  }
  /* Modo escuro (Perfil): o petróleo como fundo das telas de estudo. */
  body.study.dark {
    --bg: #00343D; --surface: #0B3D47; --surface-2: #0E4550;
    --line: rgba(255,255,255,0.16); --text: #F4F0EA; --text-2: #D5CEC2; --muted: #B7C2C0;
    --accent: #DBA84C; --accent-title: #DBA84C;
    --fix-bg: rgba(219,168,76,0.14); --fix-line: #DBA84C; --fix-text: #F3DDB0;
    --ok: #9be3a8; --err: #f6a196; --err-bg: rgba(192,57,43,0.4);
    --tutor-bg: #0B3D47; --user-bg: #0F4D58; --user-line: #7ab8c0; --user-label: #9fd0d6;
    --input-bg: #0B3D47; --chip-bg: rgba(219,168,76,0.14); --busy: #5a6a6a; --shadow: rgba(0,0,0,0.35);
  }
  /* Tamanho do texto (Perfil): todas as fontes estão em rem. */
  html.fs-l { font-size: 112.5%; }
  html.fs-xl { font-size: 125%; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; transition: background .2s; }
  .lang-row { display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto; scrollbar-width: none; width: 100%; }
  .lang-row::-webkit-scrollbar { display: none; }
  .lang-pill { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
  .lang-pill.active { background: var(--fill); border-color: var(--fill); color: var(--on-fill); font-weight: 600; }
  .main { flex: 1; width: 100%; max-width: 480px; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .topic-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .topic-row::-webkit-scrollbar { display: none; }
  .topic-pill { flex-shrink: 0; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
  .topic-pill.active, .topic-pill:hover { background: var(--chip-bg); border-color: var(--fill); color: var(--accent); font-weight: 600; }
  .transcript-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-height: 200px; max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { font-size: 0.88rem; line-height: 1.55; }
  .msg.tutor .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .msg.tutor .bubble { background: var(--tutor-bg); border: 1px solid var(--line); border-left: 3px solid var(--fill); border-radius: 0 12px 12px 0; padding: 10px 13px; color: var(--text); box-shadow: 0 1px 3px var(--shadow); }
  .msg.user .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--user-label); font-weight: 600; margin-bottom: 4px; text-align: right; }
  .msg.user .bubble { background: var(--user-bg); border-right: 3px solid var(--user-line); border-radius: 12px 0 0 12px; padding: 10px 13px; color: var(--text); text-align: right; }
  .correction { background: var(--fix-bg); border: 1px solid var(--fix-line); border-radius: 10px; padding: 9px 12px; font-size: 0.78rem; color: var(--fix-text); line-height: 1.6; margin-top: 6px; }
  .fix-main { font-size: 0.95rem; color: var(--ok); font-weight: 600; }
  .fix-list { margin-top: 4px; color: var(--fix-text); }
  .fix-why { margin-top: 6px; color: var(--fix-text); }
  .fix-more { margin-top: 4px; font-size: 0.8rem; color: var(--fix-text); }
  .fix-short { margin-top: 2px; color: var(--fix-text); }
  .nb-more { margin-top: 2px; font-size: 0.78rem; color: var(--text-2); }
  .nb-more summary { cursor: pointer; color: var(--accent); text-decoration: underline; list-style: none; }
  .fix-why summary { cursor: pointer; color: var(--fix-text); font-weight: 600; text-decoration: underline; list-style: none; }
  .msg-tools { display: flex; gap: 6px; margin-top: 5px; }
  .msg-tools button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--text-2); font-size: 0.75rem; padding: 3px 9px; cursor: pointer; font-family: 'Inter', sans-serif; }
  .msg-tr { margin-top: 5px; font-size: 0.8rem; color: var(--text-2); font-style: italic; line-height: 1.5; }
  .msg-tr.hide { display: none; }
  .msg.user mark.err { background: var(--err-bg); color: var(--text); border-bottom: 2px solid var(--err); border-radius: 3px; padding: 0 2px; }
  .hint-btn { background: var(--surface); border: 1px solid var(--fill); color: var(--accent); border-radius: 20px; padding: 7px 16px; font-size: 0.82rem; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; }
  .suggest-box { display: none; width: 100%; flex-direction: column; gap: 6px; }
  .suggest-box.show { display: flex; }
  .suggest-chip { text-align: left; background: var(--chip-bg); border: 1px solid var(--fix-line); color: var(--text); border-radius: 12px; padding: 9px 12px; font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .sug-tr { display: block; margin-top: 2px; padding-left: 1.4em; font-size: 0.74rem; font-style: italic; color: var(--text-2); }
  .suggest-note { font-size: 0.78rem; color: var(--muted); text-align: center; }

  /* RACHA 🔥 */
  .streak-badge { flex-shrink: 0; background: rgba(188,136,51,0.2); border: 1px solid var(--gold-glow); color: var(--gold-glow); border-radius: 16px; padding: 4px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .streak-badge.off { opacity: 0.6; }
  .celebrate { position: fixed; inset: 0; z-index: 1000; background: rgba(5,22,26,0.88); display: none; align-items: center; justify-content: center; padding: 16px; }
  .celebrate.show { display: flex; }
  /* Celebrações e janelas: sempre petróleo noite com dourado. */
  .cel-card { background: var(--night); border: 2px solid var(--gold-glow); border-radius: 20px; padding: 24px 18px; text-align: center; max-width: 340px; width: 100%; box-shadow: 0 0 40px rgba(219,168,76,0.3); color: #F4F0EA; }
  .cel-flame { font-size: 4rem; display: inline-block; animation: flame-pop 0.9s ease-out, flame-flicker 1.4s ease-in-out 0.9s infinite; }
  @keyframes flame-pop { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes flame-flicker { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.08) rotate(-3deg); } }
  .cel-title { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; color: var(--gold-glow); margin-top: 6px; }
  .cel-sub { color: #F4F0EA; font-size: 0.9rem; margin-top: 4px; }
  .week-row { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.65rem; color: var(--muted); }
  .week-dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .cel-card .week-day { color: #A9B4B2; }
  .cel-card .week-dot { border-color: rgba(255,255,255,0.25); }
  .week-dot.done { background: var(--gold); border-color: var(--gold); }
  .week-dot.today { box-shadow: 0 0 0 2px var(--gold-glow); }
  .streak-stats { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; box-shadow: 0 1px 3px var(--shadow); }
  .streak-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .streak-num { font-size: 1.4rem; color: var(--accent-title); font-weight: 600; }
  .streak-lbl { font-size: 0.68rem; color: var(--muted); }
  .backup-row { width: 100%; display: flex; gap: 10px; }
  .backup-btn { flex: 1; padding: 12px 8px; background: var(--surface); border: 1px solid var(--fill); color: var(--accent); border-radius: 12px; font-size: 0.82rem; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; }
  .streak-today { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 8px; }

  /* VISTAS E NAVEGAÇÃO */
  .view { display: none; width: 100%; }
  .view.active { display: flex; flex-direction: column; align-items: center; }
  .main { padding-bottom: 96px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; display: flex; justify-content: center; background: var(--night); border-top: 1px solid rgba(219,168,76,0.3); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; max-width: 120px; background: none; border: none; border-top: 2px solid transparent; color: #A9B4B2; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .tabbar button .tab-ico { font-size: 1.25rem; opacity: 0.6; }
  .tabbar button.active { color: var(--gold-glow); border-top-color: var(--gold-glow); font-weight: 600; }
  .tabbar button.active .tab-ico { opacity: 1; }
  .chat-top { width: 100%; max-width: 480px; padding: 12px 20px 0; display: flex; align-items: center; }
  .back-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 18px; padding: 6px 14px; font-size: 0.82rem; font-family: 'Inter', sans-serif; cursor: pointer; }

  /* 🏠 INÍCIO (identidade: petróleo noite com dourado) */
  .home-view.active { gap: 14px; max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; align-items: stretch; position: relative; }
  .home-top { display: flex; align-items: center; gap: 12px; }
  .photo-circle { border-radius: 50%; border: 2px solid var(--gold-glow); background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .home-photo { width: 56px; height: 56px; font-size: 1.6rem; }
  .home-hello { flex: 1; min-width: 0; }
  .home-hello h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem; font-weight: 400; color: var(--text); overflow-wrap: anywhere; }
  /* Logotipo (fundo petróleo próprio): as bordas esbatem-se no petróleo noite, sem retângulo visível. */
  .logo-img { display: block; width: 100%; height: auto;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 11%, #000 89%, transparent);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 11%, #000 89%, transparent); mask-composite: intersect; }
  .home-logo { width: min(100%, 320px); margin: -8px auto -6px; }
  /* Abertura (~1 s): logotipo sobre o petróleo noite. */
  .splash { position: fixed; inset: 0; z-index: 3000; background: var(--night); display: flex; align-items: center; justify-content: center; padding: 24px; transition: opacity .35s ease; }
  .splash.hide { opacity: 0; pointer-events: none; }
  .splash .logo-img { width: min(86vw, 460px); animation: splash-in .7s ease-out both; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .splash .logo-img { animation: none; } .splash { transition: none; } }
  .home-tutor { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .home-avatar { width: 120px; height: 120px; }
  .home-sub { color: var(--text-2); font-size: 0.9rem; text-align: center; }
  .home-view .lang-row { padding: 0; justify-content: center; flex-wrap: wrap; }
  .home-card { width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid rgba(219,168,76,0.25); border-radius: 16px; padding: 16px; color: var(--text); font-family: 'Inter', sans-serif; cursor: pointer; }
  .home-card.primary { background: rgba(188,136,51,0.2); border-color: var(--gold-glow); }
  .home-card .ico { font-size: 1.8rem; flex-shrink: 0; }
  .home-card .ctxt { flex: 1; min-width: 0; }
  .home-card .ct { display: block; font-size: 1rem; font-weight: 600; }
  .home-card.primary .ct { color: var(--gold-glow); }
  .home-card.recommended { border-color: var(--gold-glow); box-shadow: 0 0 0 1px var(--gold-glow) inset; }
  .rec-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: var(--gold); color: var(--night); font-size: 0.7rem; font-weight: 700; vertical-align: 2px; }
  .home-card .cd { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  /* 👤 PERFIL E FOTO */
  .prof-view.active { gap: 20px; max-width: 480px; margin: 0 auto; padding: 24px 24px 110px; }
  .prof-view h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; color: var(--accent-title); text-align: center; font-weight: 600; }
  .prof-view p { font-size: 0.83rem; color: var(--text-2); text-align: center; line-height: 1.7; }
  .pf-photo-row { display: flex; align-items: center; gap: 14px; width: 100%; }
  .pf-photo { width: 84px; height: 84px; font-size: 2.4rem; }
  .pf-photo-btns { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; }
  .pf-photo-btns .backup-btn { flex: 1 1 45%; padding: 9px 6px; }
  .pf-interests { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; }
  .int-chip { position: relative; cursor: pointer; }
  .int-chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .int-chip span { display: inline-block; padding: 7px 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 0.82rem; }
  .int-chip input:checked + span { background: var(--fill); border-color: var(--fill); color: var(--on-fill); font-weight: 600; }
  .int-chip input:focus-visible + span { outline: 2px solid var(--fill); outline-offset: 2px; }
  .pf-check { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text); cursor: pointer; }
  .pf-check input { width: 20px; height: 20px; accent-color: var(--gold); flex-shrink: 0; }
  .pf-tests { width: 100%; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--text); }
  .pf-tests .none { color: var(--muted); }
  .pf-tests .lvl { color: var(--accent); font-weight: 600; }
  .pf-tests .when { color: var(--muted); font-size: 0.75rem; }
  .test-card { background: var(--surface); border: 1px solid var(--fix-line); border-radius: 12px; padding: 12px; margin-bottom: 6px; color: var(--text); font-size: 0.85rem; line-height: 1.5; }
  .test-card .lvl-title { font-size: 1.05rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .test-card .sec { margin-top: 8px; font-weight: 600; }
  .test-card ul { margin: 2px 0 0 18px; }
  .test-card .rec { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .test-card .rec button { text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--fill); background: transparent; color: var(--accent); font-size: 0.85rem; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; }
  .test-card .rec button.primary { background: var(--fill); color: var(--on-fill); font-weight: 600; }
  .msg-hint { margin-top: 5px; font-size: 0.85rem; color: var(--ok); font-weight: 500; }
  .msg-hint.hide { display: none; }
  .key-btn { width: 100%; border-color: var(--err); color: var(--err); }
  .lbl-photo { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px; border: 1px solid var(--user-line); }
  .nb-view.active { padding: 20px 16px 100px; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 1100; max-width: 90%; background: var(--night); border: 1px solid var(--gold-glow); color: #F4F0EA; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
  .modal { position: fixed; inset: 0; z-index: 1060; background: rgba(5,22,26,0.88); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.show { display: flex; }
  .modal .cel-title { font-size: 1.5rem; }

  /* 🌱 DO ZERO */
  .zero-intro { font-size: 0.82rem; color: var(--text-2); line-height: 1.6; }
  .zero-item { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font-family: 'Inter', sans-serif; cursor: pointer; box-shadow: 0 1px 3px var(--shadow); }
  .zero-item.next { border-color: var(--fill); background: var(--fix-bg); box-shadow: 0 0 0 1px var(--fill); }
  .zero-num { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; flex-shrink: 0; }
  .zero-item.done .zero-num { background: var(--fill); border-color: var(--fill); color: var(--on-fill); }
  .zero-txt { flex: 1; min-width: 0; }
  .zero-title { font-size: 0.9rem; font-weight: 600; }
  .zero-goal { font-size: 0.78rem; color: var(--text-2); margin-top: 2px; }
  .zero-tag { font-size: 0.7rem; color: var(--accent); font-weight: 600; flex-shrink: 0; }
  /* Faixa da lição / do teste (identidade): petróleo noite, dourado e barra de progresso. */
  .lesson-banner { display: none; background: var(--night); border: 1px solid rgba(219,168,76,0.45); border-radius: 12px; padding: 10px 12px; font-size: 0.8rem; color: #F4F0EA; line-height: 1.5; }
  .lesson-banner.show { display: block; }
  .lesson-banner b { color: var(--gold-glow); }
  .lesson-banner .goal { color: #C9C2B6; }

  .lz-pattern { display: block; margin: 6px 0 4px; padding: 8px 10px; border-radius: 10px; background: var(--fix-bg); border: 1px dashed var(--fix-line); color: var(--fix-text); font-weight: 600; font-style: normal; }

  .cel-btn.primary { background: var(--gold); border-color: var(--gold); color: var(--night); font-weight: 600; }

  /* 💬 CONVERSAR E LIÇÕES: tela fixa entre o topo e a barra de baixo (--tabbar-h, medida em JS). */
  #view-chat.active { position: fixed; top: 0; left: 0; right: 0; bottom: var(--tabbar-h, 64px); display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  #view-chat > * { width: 100%; max-width: 480px; }
  .chat-head { flex: none; padding: 8px 16px 4px; display: flex; flex-direction: column; gap: 8px; }

  .chat-head .chat-top .back-btn { justify-self: start; }
  .chat-head .lang-row { padding: 0; }
  /* Avatar pequeno durante a conversa (metade do tamanho), continua animado. */
  .chat-head .avatar-wrap { position: static; padding: 0; background: none; }

  /* Conversa: ocupa todo o espaço livre e rola sozinha até a mensagem mais recente. */

  /* Área do microfone: fixa, logo acima da barra de baixo, sempre inteira. */
  .chat-dock { flex: none; padding: 8px 16px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -4px 12px var(--shadow); }
  .chat-dock .status-bar { min-height: 0; padding: 5px 10px; font-size: 0.74rem; }

  .chat-dock .mic-ring, .chat-dock .mic-btn { width: 72px; height: 72px; }

  .chat-dock .cancel-btn { align-self: center; padding: 6px 16px; }

  /* MEU CADERNO */
  .nb-screen { position: fixed; inset: 0; background: var(--bg); z-index: 998; overflow-y: auto; padding: 20px 16px 30px; display: flex; flex-direction: column; align-items: center; }
  .nb-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  .nb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nb-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--accent-title); }
  .nb-close { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 50%; width: 36px; height: 36px; font-size: 1rem; cursor: pointer; flex-shrink: 0; }
  .nb-tabs { display: flex; gap: 8px; }
  .nb-tab { flex: 1; padding: 9px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .nb-tab.active { background: var(--fill); border-color: var(--fill); color: var(--on-fill); font-weight: 600; }
  .nb-list { display: flex; flex-direction: column; gap: 8px; }
  .nb-sort { display: flex; gap: 6px; justify-content: flex-end; }
  .nb-sort button { background: var(--surface); border: 1px solid var(--line); color: var(--text-2); border-radius: 14px; padding: 4px 12px; font-size: 0.75rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .nb-sort button.active { border-color: var(--fill); background: var(--chip-bg); color: var(--accent); font-weight: 600; }
  .nb-count { display: inline-block; background: var(--fill); color: var(--on-fill); border-radius: 10px; padding: 0 7px; font-size: 0.72rem; font-weight: 700; vertical-align: 1px; }
  .nb-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 1px 3px var(--shadow); }
  .nb-body { flex: 1; min-width: 0; font-size: 0.88rem; line-height: 1.5; overflow-wrap: anywhere; }
  .nb-wrong { color: var(--err); text-decoration: line-through; }
  .nb-right { color: var(--ok); font-weight: 600; }
  .nb-why { color: var(--text-2); font-size: 0.78rem; margin-top: 2px; }
  .nb-date { color: var(--muted); font-size: 0.7rem; margin-top: 4px; }
  .nb-actions { display: flex; flex-direction: column; gap: 6px; }
  .nb-actions button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 0.85rem; width: 36px; height: 32px; cursor: pointer; }
  .nb-empty { color: var(--text-2); font-size: 0.85rem; text-align: center; padding: 30px 10px; line-height: 1.6; }
  .mic-section { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; }
  .mic-ring { position: relative; width: 96px; height: 96px; }
  .mic-ring-pulse { position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--gold-glow); opacity: 0; transition: all 0.3s; }
  .mic-ring-pulse.active { opacity: 0.6; animation: pulse-ring 1.2s ease-out infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } }
  /* Microfone: redondo, ouro antigo, ícone branco. */
  .mic-btn { width: 96px; height: 96px; border-radius: 50%; border: none; background: var(--gold); color: var(--white); font-size: 2rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(188,136,51,0.45); position: relative; z-index: 1; }
  .mic-btn svg { width: 40px; height: 40px; }
  .mic-btn.your-turn { animation: turn-pulse 1.6s ease-in-out infinite; }
  @keyframes turn-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(219,168,76,0.7), 0 4px 24px rgba(188,136,51,0.45); } 50% { box-shadow: 0 0 0 14px rgba(219,168,76,0), 0 4px 24px rgba(188,136,51,0.45); } }
  @media (prefers-reduced-motion: reduce) { .mic-btn.your-turn { animation: none; box-shadow: 0 0 0 4px var(--gold-glow); } }
  .mic-btn.busy { background: var(--busy); box-shadow: none; opacity: 0.55; cursor: not-allowed; }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .avatar.can-stop { cursor: pointer; }
  .mic-btn.recording { background: #c0392b; box-shadow: 0 4px 24px rgba(192,57,43,0.5); animation: mic-pulse 1s ease-in-out infinite; }
  @keyframes mic-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .mic-label { font-size: 0.8rem; color: var(--text-2); letter-spacing: 0.05em; text-align: center; }
  .text-toggle { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .text-toggle span { font-size: 0.75rem; color: var(--text-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .text-input-row { display: none; gap: 8px; align-items: flex-end; }
  .text-input-row.show { display: flex; }
  .text-inp { flex: 1; background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 0.87rem; color: var(--text); font-family: 'Inter', sans-serif; outline: none; resize: none; min-height: 44px; }
  .text-inp::placeholder { color: var(--muted); }
  .text-inp:focus { border-color: var(--fill); }
  .send-btn { background: var(--fill); color: var(--on-fill); border: none; border-radius: 12px; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .status-bar { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 0.78rem; color: var(--text-2); text-align: center; min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status-dot.green { background: #2ecc71; animation: blink 1.2s infinite; }
  .status-dot.gold { background: var(--gold); }
  .status-dot.red { background: var(--error); }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .tip-strip { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--user-line); border-radius: 10px; padding: 10px 14px; font-size: 0.78rem; color: var(--text-2); line-height: 1.55; }
  .tip-strip strong { color: var(--text); }
  .avatar-wrap { display: flex; justify-content: center; margin: 0; padding: 6px 0 8px; position: sticky; top: 0; z-index: 50; background: var(--bg); }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #f4f0ea 0%, #d8d9dd 100%); border: 3px solid var(--gold); box-shadow: 0 6px 24px var(--shadow); overflow: hidden; transition: box-shadow .3s, transform .3s; }
  .avatar.listening { box-shadow: 0 0 0 6px rgba(46,204,113,0.35), 0 6px 24px var(--shadow); }
  .avatar.talking { animation: av-bob 1.6s ease-in-out infinite; }
  @keyframes av-bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-1.5deg); } }
  .av-eyes { animation: av-blink 4.5s infinite; transform-origin: 50% 47%; transform-box: view-box; }
  @keyframes av-blink { 0%,93%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .av-mouth-open { transform-origin: 60px 78.5px; transform-box: view-box; transform: scaleY(0.15); }
  .avatar.talking .av-mouth-open { animation: av-talk .26s ease-in-out infinite alternate; }
  @keyframes av-talk { 0% { transform: scaleY(0.2); } 60% { transform: scaleY(1); } 100% { transform: scaleY(0.45); } }
  .avatar.listening .av-brows { transform: translateY(-2px); }
  .av-brows { transition: transform .3s; }
  .cancel-btn { display: none; background: var(--surface); border: 1px solid var(--err); color: var(--err); border-radius: 20px; padding: 8px 18px; font-size: 0.85rem; font-family: 'Inter', sans-serif; cursor: pointer; }
  .cancel-btn.show { display: inline-block; }
  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: bounce 1.1s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce { 0%,80%,100% { transform: scale(0.5); opacity:0.4; } 40% { transform: scale(1); opacity:1; } }

  /* API KEY SETUP (identidade) */
  .setup-screen { position: fixed; inset: 0; background: var(--night); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; gap: 20px; color: #F4F0EA; }
  .setup-screen h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--gold-glow); text-align: center; }
  .setup-screen p { font-size: 0.83rem; color: #C9C2B6; text-align: center; line-height: 1.7; }
  .setup-screen a { color: var(--gold-glow); }
  .setup-logo { width: min(100%, 340px); }
  .who-screen { position: fixed; inset: 0; z-index: 1500; background: var(--night); color: #F4F0EA; overflow-y: auto; display: flex; justify-content: center; padding: 24px 16px 40px; }
  .who-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; }
  .who-wrap h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 600; color: var(--gold-glow); text-align: center; }
  .diag-screen { position: fixed; inset: 0; z-index: 1700; background: var(--night); color: #F4F0EA; display: flex; justify-content: center; padding: 16px 12px; }
  .diag-wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .diag-head { display: flex; align-items: center; justify-content: space-between; }
  .diag-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--gold-glow); }
  .diag-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .diag-btns .cel-btn { flex: 1 1 auto; padding: 8px 10px; }
  .diag-text { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(219,168,76,0.3); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.68rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; color: #F4F0EA; }
  .who-top { width: 100%; display: flex; justify-content: flex-end; }
  .who-close { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--gold-glow); background: rgba(219,168,76,0.15); color: var(--gold-glow); font-size: 1.15rem; font-weight: 600; line-height: 1; cursor: pointer; flex-shrink: 0; }
  .who-grid { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 4px; }
  .who-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(219,168,76,0.3); border-radius: 18px; padding: 16px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #F4F0EA; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
  .who-item.active { border-color: var(--gold-glow); box-shadow: 0 0 0 1px var(--gold-glow) inset; }
  .who-item .photo-circle { width: 84px; height: 84px; font-size: 2.4rem; background: rgba(255,255,255,0.08); }
  .who-item.add .photo-circle { border-style: dashed; color: var(--gold-glow); font-size: 2.2rem; }
  .home-photo { cursor: pointer; }
  .setup-screen .api-input { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); color: #F4F0EA; }
  .setup-screen .api-note { color: #A9B4B2; }
  .api-input { width: 100%; background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 0.85rem; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
  .api-input:focus { border-color: var(--fill); }
  .api-btn { width: 100%; padding: 14px; background: var(--fill); color: var(--on-fill); border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .api-select { width: 100%; background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 0.85rem; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
  #view-profile > .backup-btn { width: 100%; flex: none; }

  .prof-label { width: 100%; font-size: 0.78rem; font-weight: 500; color: var(--text-2); margin-bottom: -12px; }

</head>
<body>
<!-- ABERTURA (cerca de 1 s) -->
<div class="splash" id="splash" aria-hidden="true"><picture><source srcset="parlia-logo.webp" type="image/webp"><img class="logo-img" src="parlia-logo.png" width="800" height="300" alt="Parlia · by Luz em Movimento"></picture></div>

<!-- SETUP SCREEN -->
<div class="setup-screen" id="setup-screen">
  <div class="setup-logo"><picture><source srcset="parlia-logo.webp" type="image/webp"><img class="logo-img" src="parlia-logo.png" width="800" height="300" alt="Parlia · by Luz em Movimento"></picture></div>
  <p data-i18n-html="setup_text"></p>
  <input class="api-input" id="api-key-input" type="password" data-i18n-ph="key_ph" />
  <button class="api-btn" onclick="saveKey()" data-i18n="enter_btn"></button>
  <p class="api-note" data-i18n-html="key_note_html"></p>
</div>


<!-- QUEM VAI ESTUDAR? (vários perfis no mesmo aparelho) -->
<div class="who-screen" id="who-screen" style="display:none" role="dialog" aria-modal="true">
  <div class="who-wrap">
    <div class="who-top" id="who-top"><button class="who-close" id="who-close" onclick="closeChooser()" data-i18n-title="close" aria-label="✕">✕</button></div>
    <div class="setup-logo"><picture><source srcset="parlia-logo.webp" type="image/webp"><img class="logo-img" src="parlia-logo.png" width="800" height="300" alt="Parlia · by Luz em Movimento"></picture></div>
    <h2 data-i18n="who_title"></h2>
    <div class="who-grid" id="who-grid"></div>
  </div>
</div>

<!-- DIAGNÓSTICO (escondido: 5 toques na versão, no fim do Perfil) -->
<div class="diag-screen" id="diag-screen" style="display:none" role="dialog" aria-modal="true">
  <div class="diag-wrap">
    <div class="diag-head"><h2>Diagnóstico</h2><button class="who-close" onclick="closeDiag()" aria-label="✕">✕</button></div>
    <div class="diag-btns">
      <button class="cel-btn primary" onclick="copyDiag()">Copiar registro</button>
      <button class="cel-btn" onclick="testDiagVoice()">Testar voz</button>
      <button class="cel-btn" onclick="renderDiag()">Atualizar</button>
      <button class="cel-btn" onclick="clearDiag()">Limpar</button>
    </div>
    <pre class="diag-text" id="diag-text"></pre>
  </div>
</div>

<!-- 👤 PERFIL (vista) -->
<section class="view prof-view" id="view-profile">
  <h2 data-i18n="profile_title"></h2>
  <div class="pf-photo-row">
    <div class="photo-circle pf-photo" id="pf-photo"></div>
    <div class="pf-photo-btns">
      <button class="backup-btn" onclick="document.getElementById('photo-gallery').click()" data-i18n="photo_gallery"></button>
      <button class="backup-btn" onclick="document.getElementById('photo-camera').click()" data-i18n="photo_camera"></button>
      <button class="backup-btn" id="photo-remove" onclick="removePhoto()" data-i18n="photo_remove"></button>
    </div>
    <input type="file" id="photo-gallery" accept="image/*" style="display:none" onchange="handlePhoto(this)" />
    <input type="file" id="photo-camera" accept="image/*" capture="user" style="display:none" onchange="handlePhoto(this)" />
  </div>
  <p data-i18n="profile_text"></p>
  <div class="streak-stats" id="pf-streak"></div>
  <div class="prof-label" data-i18n="pf_tests_label"></div>
  <div class="pf-tests" id="pf-tests"></div>
  <div class="prof-label" data-i18n="native_q"></div>
  <select class="api-select" id="pf-native" onchange="previewNative(this.value)">
    <option value="pt-BR">🇧🇷 Português (Brasil)</option>
    <option value="pt-PT">🇵🇹 Português (Portugal)</option>
    <option value="es">🇪🇸 Español</option>
    <option value="en">🇬🇧 English</option>
    <option value="fr">🇫🇷 Français</option>
    <option value="it">🇮🇹 Italiano</option>

         it: '"In autobus / in treno / in metro", but "a piedi" (on foot). "Solo andata" = single, "andata e ritorno" = return.',
         pt: 'Brazil: "ônibus", "trem", "metrô", "passagem" (ticket for a trip); Portugal: "autocarro", "comboio", "metro", "bilhete".' } },
  { // 6) No médico ou na farmácia
    s: 'Estou com dor de + [cabeça / garganta / barriga]~Dói-me + [a cabeça / a garganta / a barriga] | Me duele + [la cabeza / la garganta / el estómago] | I have a + [headache / sore throat / stomach ache] | J’ai mal + [à la tête / à la gorge / au ventre] | Ho mal di + [testa / gola / pancia]',
    p: ['🤕 | Estou com dor de cabeça.~Dói-me a cabeça. | Me duele la cabeza. | I have a headache. | J’ai mal à la tête. | Ho mal di testa.',
        '🤒 | Estou com febre. | Tengo fiebre. | I have a temperature. | J’ai de la fièvre. | Ho la febbre.',
        '💊 | Você tem algo para a garganta?~Tem alguma coisa para a garganta? | ¿Tiene algo para la garganta? | Do you have something for a sore throat? | Vous avez quelque chose pour la gorge ? | Ha qualcosa per il mal di gola?',
        '📅 | Eu queria marcar uma consulta.~Queria marcar uma consulta. | Quería pedir cita con el médico.~Quería sacar una cita con el médico. | I’d like to make an appointment. | Je voudrais prendre rendez-vous. | Vorrei prendere un appuntamento.',
        '⏱️ | Faz dois dias.~Há dois dias. | Desde hace dos días. | For two days. | Depuis deux jours. | Da due giorni.'],
    c: [['Diga o que dói ou como você se sente.~Diz o que te dói ou como te sentes. | Di qué te duele o cómo te sientes. | Say what hurts or how you feel. | Dis où tu as mal ou comment tu te sens. | Di’ dove ti fa male o come ti senti.',
         'Estou com dor de garganta e com febre.~Dói-me a garganta e tenho febre. | Me duele la garganta y tengo fiebre. | I have a sore throat and a temperature. | J’ai mal à la gorge et j’ai de la fièvre. | Ho mal di gola e ho la febbre.'],
        ['Na farmácia, peça algo para um problema seu.~Na farmácia, pede algo para um problema teu. | En la farmacia, pide algo para un problema tuyo. | At the pharmacy, ask for something for a problem you have. | À la pharmacie, demande quelque chose pour un problème que tu as. | In farmacia, chiedi qualcosa per un tuo problema.',
         'Você tem algo para dor de cabeça?~Tem alguma coisa para as dores de cabeça? | ¿Tiene algo para el dolor de cabeza? | Do you have something for a headache? | Vous avez quelque chose contre le mal de tête ? | Ha qualcosa per il mal di testa?']],
    k: [['Bom dia. O que você está sentindo?~Bom dia. O que sente? | Buenos días. ¿Qué le pasa? | Good morning. What seems to be the problem? | Bonjour. Qu’est-ce qui ne va pas ? | Buongiorno. Che disturbi ha?', '0'],
        ['Desde quando? | ¿Desde cuándo? | How long have you had it? | Depuis quand ? | Da quando?', '4']],
    u: { es: '"Me duele" + body part ("me duelen los pies" in plural). Spain "pedir cita", Latin America "sacar/hacer una cita". With the doctor use "usted".',
         en: 'UK "I have a temperature", US "I have a fever". "Make an appointment" with a doctor.',
         fr: '"J’ai mal à la/au/aux…": à la tête, au ventre, aux dents. "Depuis" + time for how long.',
         it: '"Ho mal di…" (testa, gola, pancia); doctors use "Lei". "Da" + time for how long: "da due giorni".',
         pt: 'Brazil: "Estou com dor de…", "Faz dois dias"; Portugal: "Dói-me…" or "Tenho dores de…", "Há dois dias".' } },
  { // 7) O que eu fiz ontem
    s: 'Ontem eu + [fui / comi / trabalhei]…~Ontem + [fui / comi / trabalhei]… | Ayer + [fui / comí / trabajé]… | Yesterday I + [went / ate / worked]… | Hier, + [j’ai mangé / j’ai travaillé / je suis allé(e)]… | Ieri + [ho mangiato / ho lavorato / sono andato/a]…',
    p: ['🛒 | Ontem eu fui ao supermercado.~Ontem fui ao supermercado. | Ayer fui al supermercado. | Yesterday I went to the supermarket. | Hier, je suis allé au supermarché. /= Hier, je suis allée au supermarché. | Ieri sono andato al supermercato. / Ieri sono andata al supermercato.',
        '🍕 | Eu comi pizza com amigos.~Comi pizza com amigos. | Comí pizza con amigos. | I ate pizza with friends. | J’ai mangé une pizza avec des amis. | Ho mangiato una pizza con gli amici.',
        '💼 | Eu trabalhei até tarde.~Trabalhei até tarde. | Trabajé hasta tarde. | I worked late. | J’ai travaillé tard. | Ho lavorato fino a tardi.',
        '📺 | À noite, eu vi um filme.~À noite, vi um filme. | Por la noche vi una película. | In the evening, I watched a film. | Le soir, j’ai regardé un film. | La sera ho visto un film.',
        '❓ | E você, o que fez ontem?~E tu, o que fizeste ontem? | ¿Y tú, qué hiciste ayer? | And you, what did you do yesterday? | Et toi, qu’est-ce que tu as fait hier ? | E tu, cosa hai fatto ieri?'],
    c: [['Conte uma coisa que você fez ontem.~Conta uma coisa que fizeste ontem. | Cuenta algo que hiciste ayer. | Tell me something you did yesterday. | Raconte une chose que tu as faite hier. | Racconta una cosa che hai fatto ieri.',
         'Ontem eu passeei no parque com a minha filha.~Ontem passeei no parque com a minha filha. | Ayer di un paseo por el parque con mi hija. | Yesterday I went for a walk in the park with my daughter. | Hier, j’ai fait une balade au parc avec ma fille. | Ieri ho fatto una passeggiata al parco con mia figlia.'],
        ['Diga o que você comeu ontem à noite.~Diz o que comeste ontem à noite. | Di qué cenaste anoche. | Say what you had for dinner last night. | Dis ce que tu as mangé hier soir. | Di’ cosa hai mangiato ieri sera.',
         'Ontem à noite eu comi uma sopa.~Ontem à noite comi uma sopa. | Anoche cené sopa. | Last night I had soup. | Hier soir, j’ai mangé une soupe. | Ieri sera ho mangiato una minestra.']],
    k: [['Ontem eu fui à praia. E você, o que fez?~Ontem fui à praia. E tu, o que fizeste? | Ayer fui a la playa. ¿Y tú, qué hiciste? | Yesterday I went to the beach. What about you? | Hier, je suis allée à la plage. Et toi, qu’est-ce que tu as fait ? | Ieri sono andata al mare. E tu, cosa hai fatto?', '0'],
        ['E à noite? | ¿Y por la noche? | And in the evening? | Et le soir ? | E la sera?', '3']],
    u: { es: 'With "ayer", use the simple past: fui, comí, trabajé, hice (not "he ido"). "Fui" is the past of both "ir" and "ser".',
         en: 'Common irregular pasts: go → went, eat → ate, see → saw, do → did. Questions use "did": "What did you do?".',
         fr: 'Most verbs use "avoir": j’ai mangé, j’ai travaillé. "Aller" uses "être" and agrees: je suis allé (man) / je suis allée (woman).',
         it: '"Andare" uses "essere" and agrees: sono andato (man) / sono andata (woman); most verbs use "avere": ho mangiato, ho lavorato.',
         pt: 'Simple past in both: "fui", "comi", "trabalhei". Brazil "Você fez…?"; Portugal "Fizeste…?"..' } },
  { // 8) O que vou fazer amanhã
    s: 'Amanhã eu vou + [trabalhar / viajar / cozinhar]~Amanhã vou + [trabalhar / viajar / cozinhar] | Mañana voy a + [trabajar / viajar / cocinar] | Tomorrow I’m going to + [work / travel / cook] | Demain, je vais + [travailler / voyager / cuisiner] | Domani + [lavoro / parto / cucino]',
    p: ['🍳 | Amanhã eu vou cozinhar para a minha família.~Amanhã vou cozinhar para a minha família. | Mañana voy a cocinar para mi familia. | Tomorrow I’m going to cook for my family. | Demain, je vais cuisiner pour ma famille. | Domani cucino per la mia famiglia.',
        '🧳 | No fim de semana, eu vou viajar.~No fim de semana, vou viajar. | El fin de semana voy a viajar. | At the weekend, I’m going to travel. | Ce week-end, je vais voyager. | Questo fine settimana faccio un viaggio.',
        '📞 | Mais tarde, eu vou ligar para a minha mãe.~Mais logo, vou ligar à minha mãe. | Más tarde voy a llamar a mi madre.~Más tarde voy a llamar a mi mamá. | Later, I’m going to call my mum. | Plus tard, je vais appeler ma mère. | Più tardi chiamo mia madre.',
        '🏠 | Hoje à noite, eu não vou sair.~Hoje à noite, não vou sair. | Esta noche no voy a salir. | Tonight I’m not going to go out. | Ce soir, je ne vais pas sortir. | Stasera non esco.',
        '❓ | O que você vai fazer amanhã?~O que vais fazer amanhã? | ¿Qué vas a hacer mañana? | What are you going to do tomorrow? | Qu’est-ce que tu vas faire demain ? | Cosa fai domani?'],
    c: [['Diga o que você vai fazer amanhã.~Diz o que vais fazer amanhã. | Di qué vas a hacer mañana. | Say what you are going to do tomorrow. | Dis ce que tu vas faire demain. | Di’ cosa fai domani.',
         'Amanhã eu vou estudar e depois vou correr.~Amanhã vou estudar e depois vou correr. | Mañana voy a estudiar y luego voy a correr. | Tomorrow I’m going to study and then go for a run. | Demain, je vais étudier et ensuite je vais courir. | Domani studio e poi vado a correre.'],
        ['Diga um plano para as próximas férias.~Diz um plano para as próximas férias. | Di un plan para tus próximas vacaciones. | Say one plan for your next holiday. | Dis un projet pour tes prochaines vacances. | Di’ un programma per le tue prossime vacanze.',
         'Nas férias, eu vou visitar a Itália.~Nas férias, vou visitar Itália. | En vacaciones voy a visitar Italia. | On holiday, I’m going to visit Italy. | Pendant les vacances, je vais visiter l’Italie. | In vacanza vado in Italia.']],
    k: [['Amanhã é sábado! O que você vai fazer?~Amanhã é sábado! O que vais fazer? | ¡Mañana es sábado! ¿Qué vas a hacer? | Tomorrow is Saturday! What are you going to do? | Demain, c’est samedi ! Qu’est-ce que tu vas faire ? | Domani è sabato! Cosa fai?', '0'],
        ['Vamos sair hoje à noite? | ¿Salimos esta noche? | Shall we go out tonight? | On sort ce soir ? | Usciamo stasera?', '3']],
    u: { es: '"Ir a + infinitive" is the most common way to talk about plans. Spain "madre/mamá", Latin America usually "mamá".',
         en: '"Going to" for plans; UK "at the weekend", US "on the weekend"; UK "mum", US "mom".',
         fr: '"Aller + infinitive": je vais partir; negative around "vais": je ne vais pas sortir.',
         it: 'Italian usually uses the present for near plans: "Domani lavoro", "Stasera non esco".',
         pt: 'Brazil: "ligar para a mãe", "mais tarde"; Portugal: "ligar à mãe", "mais logo". "Ir + infinitive" in both.' } },
  { // 9) Minha casa e meu bairro
    s: 'No meu bairro tem + [um parque / uma padaria / um mercado]~No meu bairro há + [um parque / uma padaria / um mercado] | En mi barrio hay + [un parque / una panadería / un mercado] | In my neighbourhood there is + [a park / a bakery / a market] | Dans mon quartier, il y a + [un parc / une boulangerie / un marché] | Nel mio quartiere c’è + [un parco / una panetteria / un mercato]',
    p: ['🏢 | Eu moro em um apartamento.~Moro num apartamento. | Vivo en un piso.~Vivo en un departamento. | I live in a flat. | J’habite dans un appartement. | Abito in un appartamento.',
        '🛏️ | A minha casa tem dois quartos. | Mi casa tiene dos habitaciones. | My home has two bedrooms. | Chez moi, il y a deux chambres. | La mia casa ha due camere da letto.',
        '🌳 | Perto da minha casa tem um parque.~Perto da minha casa há um parque. | Cerca de mi casa hay un parque. | There’s a park near my house. | Il y a un parc près de chez moi. | Vicino a casa mia c’è un parco.',
        '🥖 | No meu bairro tem uma padaria muito boa.~No meu bairro há uma padaria muito boa. | En mi barrio hay una panadería muy buena. | There’s a very good bakery in my neighbourhood. | Dans mon quartier, il y a une très bonne boulangerie. | Nel mio quartiere c’è una panetteria molto buona.',
        '🤫 | É um bairro tranquilo.~É um bairro sossegado. | Es un barrio tranquilo. | It’s a quiet neighbourhood. | C’est un quartier calme. | È un quartiere tranquillo.'],
    c: [['Descreva a sua casa em uma frase.~Descreve a tua casa numa frase. | Describe tu casa en una frase. | Describe your home in one sentence. | Décris ton logement en une phrase. | Descrivi casa tua in una frase.',
         'Eu moro em uma casa pequena com jardim.~Moro numa casa pequena com jardim. | Vivo en una casa pequeña con jardín. | I live in a small house with a garden. | J’habite dans une petite maison avec un jardin. | Abito in una casa piccola con il giardino.'],
        ['Diga o que tem no seu bairro.~Diz o que há no teu bairro. | Di qué hay en tu barrio. | Say what there is in your neighbourhood. | Dis ce qu’il y a dans ton quartier. | Di’ cosa c’è nel tuo quartiere.',
         'No meu bairro tem um supermercado e uma escola.~No meu bairro há um supermercado e uma escola. | En mi barrio hay un supermercado y una escuela. | In my neighbourhood there’s a supermarket and a school. | Dans mon quartier, il y a un supermarché et une école. | Nel mio quartiere ci sono un supermercato e una scuola.']],
    k: [['Você mora em uma casa ou em um apartamento?~Moras numa casa ou num apartamento? | ¿Vives en una casa o en un piso?~¿Vives en una casa o en un departamento? | Do you live in a house or a flat? | Tu habites dans une maison ou dans un appartement ? | Abiti in una casa o in un appartamento?', '0'],
        ['E como é o seu bairro?~E como é o teu bairro? | ¿Y cómo es tu barrio? | And what’s your neighbourhood like? | Et ton quartier, il est comment ? | E com’è il tuo quartiere?', '4']],
    u: { es: 'Spain: "piso"; Latin America: "departamento" (or "apartamento"). "Hay" = there is / there are.',
         en: 'UK "flat", "neighbourhood"; US "apartment", "neighborhood". "There is" (one) / "there are" (several).',
         fr: '"Il y a" = there is / there are; "chez moi" = at my place.',
         it: '"C’è" (one thing) / "ci sono" (several things). "Casa mia" = my home.',
         pt: 'Brazil often says "tem" for "there is" in speech; Portugal says "há". Portugal: "sossegado" = quiet.' } },
  { // 10) Meu trabalho e minha rotina
    s: 'Eu trabalho + [em um escritório / em casa / em um hospital]~Trabalho + [num escritório / a partir de casa / num hospital] | Trabajo + [en una oficina / desde casa / en un hospital] | I work + [in an office / from home / in a hospital] | Je travaille + [dans un bureau / à la maison / dans un hôpital] | Lavoro + [in ufficio / da casa / in ospedale]',
    p: ['💻 | Eu trabalho em casa.~Trabalho a partir de casa. | Trabajo desde casa. | I work from home. | Je travaille à la maison. | Lavoro da casa.',
        '🧑‍🏫 | Eu sou professor. / Eu sou professora.~Sou professor. / Sou professora. | Soy profesor. / Soy profesora. | I’m a teacher. | Je suis professeur. /= Je suis professeure. | Faccio l’insegnante.',
        '🕘 | Eu começo às nove.~Começo às nove. | Empiezo a las nueve. | I start at nine. | Je commence à neuf heures. | Comincio alle nove.',
        '🍱 | Eu almoço com os meus colegas.~Almoço com os meus colegas. | Como con mis compañeros.~Almuerzo con mis compañeros. | I have lunch with my colleagues. | Je déjeune avec mes collègues. | Pranzo con i miei colleghi.',
        '😌 | Eu gosto do meu trabalho.~Gosto do meu trabalho. | Me gusta mi trabajo. | I like my job. | J’aime mon travail. | Mi piace il mio lavoro.'],
    c: [['Diga qual é o seu trabalho ou o que você estuda.~Diz qual é o teu trabalho ou o que estudas. | Di a qué te dedicas o qué estudias. | Say what your job is or what you study. | Dis quel est ton métier ou ce que tu étudies. | Di’ che lavoro fai o cosa studi.',
         'Eu sou enfermeira e trabalho em um hospital.~Sou enfermeira e trabalho num hospital. | Soy enfermera y trabajo en un hospital. | I’m a nurse and I work in a hospital. | Je suis infirmière et je travaille dans un hôpital. | Sono infermiera e lavoro in ospedale.'],
        ['Conte a que horas você começa e termina o seu dia de trabalho.~Conta a que horas começas e acabas o teu dia de trabalho. | Cuenta a qué hora empiezas y terminas tu jornada. | Say what time you start and finish work. | Dis à quelle heure tu commences et tu finis ta journée. | Di’ a che ora cominci e finisci di lavorare.',
         'Eu começo às oito e termino às cinco.~Começo às oito e acabo às cinco. | Empiezo a las ocho y termino a las cinco. | I start at eight and finish at five. | Je commence à huit heures et je finis à dix-sept heures. | Comincio alle otto e finisco alle cinque.']],
    k: [['Eu sou tutora de idiomas. E você, o que faz?~Sou tutora de línguas. E tu, o que fazes? | Yo soy profesora de idiomas. ¿Y tú, a qué te dedicas? | I’m a language tutor. What do you do? | Moi, je suis prof de langues. Et toi, tu fais quoi ? | Io faccio l’insegnante di lingue. E tu, che lavoro fai?', '1'],
        ['E a que horas você começa?~E a que horas começas? | ¿Y a qué hora empiezas? | And what time do you start? | Et tu commences à quelle heure ? | E a che ora cominci?', '2']],
    u: { es: 'No article with jobs: "Soy profesora". Spain: "comer" = to have lunch; Latin America: "almorzar". "¿A qué te dedicas?" = what do you do?',
         en: 'Use "a/an" with jobs: "I’m a teacher", "I’m a nurse".',
         fr: 'No article with jobs: "Je suis infirmière". In France, times often use 24 h: dix-sept heures.',
         it: '"Faccio l’insegnante" or "Sono insegnante": both common, no article after "sono".',
         pt: 'No article with jobs: "Sou professora". Brazil: "terminar", "em casa"; Portugal: "acabar", "a partir de casa".' } },
  { // 11) Dar opinião simples
    s: 'Eu acho que + [é bom / é caro / é interessante], porque…~Acho que + [é bom / é caro / é interessante], porque… | Creo que + [es bueno / es caro / es interesante], porque… | I think + [it’s good / it’s expensive / it’s interesting], because… | Je pense que + [c’est bien / c’est cher / c’est intéressant], parce que… | Secondo me + [è bello / è caro / è interessante], perché…',
    p: ['🎬 | Eu acho que este filme é muito bom.~Acho que este filme é muito bom. | Creo que esta película es muy buena. | I think this film is very good. | Je pense que ce film est très bien. | Secondo me questo film è molto bello.',
        '🤔 | Acho que não. | Creo que no. | I don’t think so. | Je ne pense pas. | Non credo.',
        '🏙️ | Eu gosto de Lisboa porque é bonita.~Gosto de Lisboa porque é bonita. | Me gusta Lisboa porque es bonita. | I like Lisbon because it’s beautiful. | J’aime Lisbonne parce que c’est beau. | Mi piace Lisbona perché è bella.',
        '👍 | Concordo com você.~Concordo contigo. | Estoy de acuerdo contigo. | I agree with you. | Je suis d’accord avec toi. | Sono d’accordo con te.',
        '💬 | Para mim, é muito caro. | Para mí, es demasiado caro. | For me, it’s too expensive. | Pour moi, c’est trop cher. | Per me è troppo caro.'],
    c: [['Dê a sua opinião sobre a cidade onde você mora, com um motivo.~Dá a tua opinião sobre a cidade onde moras, com um motivo. | Da tu opinión sobre la ciudad donde vives y di por qué. | Give your opinion about the city where you live, and say why. | Donne ton avis sur la ville où tu habites, et dis pourquoi. | Di’ cosa pensi della città dove abiti, e perché.',
         'Eu acho que a minha cidade é ótima, porque tem muitos parques.~Acho que a minha cidade é ótima, porque tem muitos parques. | Creo que mi ciudad es genial, porque tiene muchos parques. | I think my city is great, because it has lots of parks. | Je pense que ma ville est super, parce qu’il y a beaucoup de parcs. | Secondo me la mia città è bellissima, perché ci sono tanti parchi.'],
        ['Diga se você gosta de cozinhar e por quê.~Diz se gostas de cozinhar e porquê. | Di si te gusta cocinar y por qué. | Say whether you like cooking and why. | Dis si tu aimes cuisiner et pourquoi. | Di’ se ti piace cucinare e perché.',
         'Eu gosto de cozinhar porque é relaxante.~Gosto de cozinhar porque é relaxante. | Me gusta cocinar porque es relajante. | I like cooking because it’s relaxing. | J’aime cuisiner parce que c’est relaxant. | Mi piace cucinare perché è rilassante.']],
    k: [['Eu adoro este filme. O que você acha?~Adoro este filme. O que achas? | Me encanta esta película. ¿Qué te parece? | I love this film. What do you think? | J’adore ce film. Qu’est-ce que tu en penses ? | Adoro questo film. Tu che ne pensi?', '0'],
        ['Vamos comprar este relógio? Custa cem euros.~Compramos este relógio? Custa cem euros. | ¿Compramos este reloj? Cuesta cien euros. | Shall we buy this watch? It’s a hundred euros. | On achète cette montre ? Elle coûte cent euros. | Compriamo questo orologio? Costa cento euro.', '4']],
    u: { es: '"Creo que…" or "Me parece que…"; "¿Qué te parece?" asks for an opinion. "Demasiado" = too (much).',
         en: '"I think…" / "In my opinion…"; "I don’t think so" (not "I think no").',
         fr: '"Je pense que…" or "Je trouve que…"; "à mon avis" = in my opinion; "Qu’est-ce que tu en penses ?" asks for an opinion.',
         it: '"Secondo me…" is the simplest way; "penso che" needs the subjunctive (penso che sia…). "Non credo" = I don’t think so.',
         pt: 'Both: "Acho que…"; Brazil "Concordo com você", "por quê?"; Portugal "Concordo contigo", "porquê?" at the end of a question.' } },
  { // 12) Combinar um encontro
    s: 'Vamos nos encontrar + [no sábado / às oito / na praça]?~Encontramo-nos + [no sábado / às oito / na praça]? | ¿Quedamos + [el sábado / a las ocho / en la plaza]?~¿Nos vemos + [el sábado / a las ocho / en la plaza]? | Shall we meet + [on Saturday / at eight / in the square]? | On se retrouve + [samedi / à huit heures / sur la place] ? | Ci vediamo + [sabato / alle otto / in piazza]?',
    p: ['📅 | Você está livre no sábado?~Estás livre no sábado? | ¿Estás libre el sábado? | Are you free on Saturday? | Tu es libre samedi ? | Hai tempo sabato?',
        '🕗 | Vamos nos encontrar às oito?~Encontramo-nos às oito? | ¿Quedamos a las ocho?~¿Nos vemos a las ocho? | Shall we meet at eight? | On se retrouve à huit heures ? | Ci vediamo alle otto?',
        '📍 | Onde a gente se encontra?~Onde nos encontramos? | ¿Dónde quedamos?~¿Dónde nos vemos? | Where shall we meet? | On se retrouve où ? | Dove ci vediamo?',

let uiOverride = null; // língua escolhida no perfil antes de guardar (pré-visualização)
function detectNative() {
  const l = (navigator.language || 'pt-BR').toLowerCase();
  if (l === 'pt-pt') return 'pt-PT';
  const base = l.split('-')[0];
  return ['es', 'en', 'fr', 'it'].includes(base) ? base : 'pt-BR';
}
// Perfis antigos guardavam só "expl" (variante do português das explicações).
function getNative(P) {
  if (P && NATIVES[P.native]) return P.native;
  if (P && P.expl === 'português de Portugal') return 'pt-PT';
  return P ? 'pt-BR' : detectNative();
}
function nativeInfo() { return NATIVES[uiOverride || getNative(PROFILE)]; }
function uiLang() { return nativeInfo().ui; }
function t(key, vars) {
  const d = I18N[uiLang()] || I18N['pt-BR'];
  let s = d[key] != null ? d[key] : (I18N['pt-BR'][key] != null ? I18N['pt-BR'][key] : key);
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function langUI(code) { return t('lang_' + code); }
function visibleLangs() { const hide = nativeInfo().hide; return LANGS.filter(l => l.code !== hide); }

// Aplica o dicionário a todos os elementos marcados com data-i18n*.
function applyI18n() {
  document.documentElement.lang = uiLang();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  updateBusyUI();
  document.getElementById('tip-text').textContent = (TIPS[uiLang()] || {})[currentLang] || '';
  renderLangPills();
  updateStreakBadge();
  updateLessonBanner();
  if (currentView === 'notebook') renderNotebook();
  renderHome();
  if (document.getElementById('zero-screen').style.display !== 'none') renderZero();
}

// Seletores de idioma (no Início e na conversa).
function renderLangPills() {
  document.querySelectorAll('.lang-row').forEach(row => {
    row.innerHTML = '';
    visibleLangs().forEach(l => {
      const b = document.createElement('button');
      b.className = 'lang-pill' + (l.code === currentLang ? ' active' : '');
      b.textContent = langFlag(l.code) + ' ' + langUI(l.code);
      b.onclick = () => setLang(l.code);
      row.appendChild(b);
    });
  });
}

// Se o idioma atual for igual à língua nativa (escondido), passa para o primeiro visível.
function ensureVisibleLang() {
  applyLangVars();
  if (visibleLangs().some(l => l.code === currentLang)) return;
  const l = visibleLangs()[0];
  currentLang = l.code; applyLangVars();
}

// localStorage 'tutora_assuntos' = { chave do interesse: data em que foi o assunto principal pela última vez }.
const FOCUS_KEY = 'tutora_assuntos', FOCUS_EVERY = 10; // muda de assunto a cada 10 falas na mesma conversa
let chatFocus = null, focusTurns = 0;
function focusLoad() { try { const o = JSON.parse(store.getItem(FOCUS_KEY) || '{}'); return o && typeof o === 'object' ? o : {}; } catch(e) { return {}; } }
// Escolhe o assunto principal: o interesse usado há mais tempo (ou nunca usado), com sorteio nos empates,
// e nunca o mesmo que acabou de ser usado. Assim a Lia passa por todos ao longo dos dias.
function pickFocus() {
  const ks = (PROFILE && Array.isArray(PROFILE.interests) ? PROFILE.interests : []).filter(k => INTERESTS.some(x => x.k === k));
  focusTurns = 0;
  if (!ks.length) { chatFocus = null; return null; }
  const used = focusLoad();
  const pool = ks.length > 1 ? ks.filter(k => k !== chatFocus) : ks;
  const rnd = new Map(pool.map(k => [k, Math.random()]));
  pool.sort((a, b) => String(used[a] || '').localeCompare(String(used[b] || '')) || rnd.get(a) - rnd.get(b));
  chatFocus = pool[0];
  used[chatFocus] = new Date().toISOString();
  try { store.setItem(FOCUS_KEY, JSON.stringify(used)); } catch(e) {}
  return chatFocus;
}

// Locale da voz e do microfone: espanhol da América Latina usa es-MX (conforme o perfil).
function voiceLocale() {
  return currentLang === 'es' && PROFILE && PROFILE.accent === 'América Latina' ? 'es-MX' : currentLocale;

function getBestVoice(locale) {
  const base = locale.split('-')[0].toLowerCase();
  const norm = l => (l || '').replace('_', '-').toLowerCase();
  const latam = locale === 'es-MX';
  const same = voices.filter(v => latam ? /^es-(mx|us|419|ar|co|cl|pe)$/.test(norm(v.lang)) : norm(v.lang) === locale.toLowerCase());
  const lang = voices.filter(v => norm(v.lang).startsWith(base) && !(latam && norm(v.lang) === 'es-es'));
  const any = voices.filter(v => norm(v.lang).startsWith(base));
  const rank = v => /natural|neural|online|premium|enhanced/i.test(v.name) ? 0 : /google/i.test(v.name) ? 1 : v.localService === false ? 2 : 3;
  const pick = list => list.slice().sort((a, b) => rank(a) - rank(b))[0];
  return pick(same) || pick(lang) || pick(any) || voices[0];
}

const RATES = { lenta: 0.75, normal: 0.95, 'rápida': 1.15 };
// Leitura lenta: as vozes de rede (localService = false, ex.: as vozes "Google" do Chrome no Android) podem ignorar o rate.
// 1) Se a voz natural já é local, basta baixar o rate. 2) Senão, usa uma voz LOCAL do mesmo idioma com rate 0.7.
// 3) Se não houver voz local, diz a frase em pedaços curtos, com pausas de 300 ms (funciona mesmo que o rate seja ignorado).
function localVoice(locale) {
  const base = locale.split('-')[0].toLowerCase(), norm = l => (l || '').replace('_', '-').toLowerCase();
  const loc = voices.filter(v => v.localService === true && norm(v.lang).startsWith(base));
  return loc.find(v => norm(v.lang) === locale.toLowerCase()) || loc[0] || null;
}
function slowPlan(locale) {
  const best = getBestVoice(locale);
  if (best && best.localService === true) return { voice: best, rate: 0.6, chunks: true, path: 'mesma voz 0,6 + pedaços' };
  const lv = localVoice(locale);
  if (lv) return { voice: lv, rate: 0.7, chunks: true, path: 'voz local 0,7 + pedaços' };
  return { voice: best || null, rate: 0.7, chunks: true, path: 'pedaços (voz natural 0,7)' };

// Pedaços curtos: 1 palavra (frases até 4 palavras) ou 2 palavras.

  return out.length ? out : [String(text || '')];

// Próxima lição por fazer na trilha (0 = Do zero, 1 = Primeiros passos).

function openZero() {

// Abre a lição i. Se houver conversa guardada dessa lição (e resume não for false), retoma-a; senão começa do início.
function startLesson(i, resume) {

  if (currentLesson === null) topicElBeforeLesson = document.querySelector('.topic-pill.active:not(#zero-pill)');
  currentLesson = i; lessonCompleted = false; lessonState = null; lessonRun++;
  const ze = zeroLang(); ze.current = i; ze.seen = true; zeroSave(ze); // lição em andamento (cartão "Continuar" no Início)
  document.querySelectorAll('.topic-pill').forEach(b => b.classList.remove('active'));
  document.getElementById('zero-pill').classList.add('active');
  chatHistory = []; repeatTarget = ''; repeatTries = 0; clearTranscript(); stopRecording(); ttsCancel();
  lessonLog = [];
  updateLessonBanner();
  const sess = lessonSessions()[currentLang];
  // Só se retoma uma conversa criada com a mesma língua nativa e a mesma variante do português.
  const sameLang = sess && sess.native === getNative(PROFILE) && (sess.ptVariant || 'Brasil') === ((PROFILE && PROFILE.ptVariant) || 'Brasil');
  if (resume !== false && sess && sess.lesson === i && !sameLang) showToast(t('lang_changed'));
  if (resume !== false && lessonResumable(i) && Array.isArray(sess.history)) {
    restoringLesson = true;
    lessonState = { pos: sess.st.pos, tries: Number.isInteger(sess.st.tries) ? sess.st.tries : 0 };
    chatHistory = sess.history.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
    sess.log.forEach(m => {
      if (!m || (m.role !== 'user' && m.role !== 'tutor')) return;
      const div = addMsg(m.role, String(m.text || ''), m.correction, m.correctionFirst, m.spoken, m.saveText, m.hint);
      lessonLog.push(m);
      div.dataset.log = lessonLog.length - 1;

let repeatTarget = '', repeatTries = 0;
let wantRecording = false, sendOnEnd = false, finalText = '', sessionParts = [], interimText = '';

function sessionText() {
  const parts = sessionParts.filter(Boolean);
  const kept = parts.filter((p, i) => !(parts[i + 1] && parts[i + 1].trim().toLowerCase().startsWith(p.trim().toLowerCase())));
  return kept.join(' ').trim();
}

function fullText() {

}

// Ícones brancos do botão do microfone (gravar / parar).
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#fff"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M8.5 21h7"/></svg>';
const STOP_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="#fff"/></svg>';

  avatarState('listening', on);

function initRecognition() {
  if (recognition) { try { recognition.onend = null; recognition.abort(); } catch(e) {} }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('error', t('st_chrome')); return; }
  recognition = new SR();
  recognition.lang = voiceLocale();
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => { sessionParts = []; interimText = ''; dlog(0, 'microfone: onstart'); };

  recognition.onresult = (e) => {
    interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) sessionParts[i] = t; else interimText += t;
    }
    const txt = fullText();
    if (txt) setStatus('green', '🎙️ ' + txt);
  };

  recognition.onerror = (e) => {
    dlog(0, 'microfone: onerror ' + (e && e.error));
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wantRecording = false; sendOnEnd = false; setMicUI(false);
      setStatus('error', t('st_mic_blocked'));
    }
  };

  recognition.onend = () => {
    lastRecogEnd = Date.now(); dlog(0, 'microfone: onend');
    const st = sessionText();
    if (st) finalText = [finalText, st].filter(Boolean).join(' ');
    else if (interimText) finalText = [finalText, interimText].filter(Boolean).join(' ');
    sessionParts = []; interimText = '';
    if (wantRecording) {
      dlog(0, 'microfone: start() (reinício)');
      try { recognition.start(); } catch(e) { setTimeout(() => { try { recognition.start(); } catch(_) {} }, 250); }
      return;
    }
    isRecording = false;
    setMicUI(false);
    if (sendOnEnd) {
      sendOnEnd = false;
      const text = finalText.replace(/\s+/g, ' ').trim();
      finalText = '';
      if (text) handleUserSpeech(text);
      else setStatus('ready', t('st_nothing'));
    }
  };
}

function toggleMic() {
  if (!isRecording && isBusy()) return; // bloqueado enquanto a tutora pensa ou fala
  if (isRecording) { finishRecording(); return; }
  startRecording();
}

function startRecording() {
  if (!recognition) initRecognition();
  if (!recognition) return;
  finalText = ''; sessionParts = []; interimText = '';
  wantRecording = true; sendOnEnd = false; isRecording = true;
  setMicUI(true);
  setStatus('green', t('st_listening'));
  dlog(0, 'microfone: start()');
  try { recognition.start(); } catch(e) { initRecognition(); setTimeout(() => { try { recognition.start(); } catch(_) {} }, 250); }
}

function cancelRecording() {
  wantRecording = false; sendOnEnd = false; isRecording = false;
  finalText = ''; sessionParts = []; interimText = '';
  dlog(0, 'microfone: abort() (cancelar)');
  try { if (recognition) recognition.abort(); } catch(e) {}
  setMicUI(false);
  setStatus('ready', t('st_cancelled'));
}

function finishRecording() {
  wantRecording = false; sendOnEnd = true;
  setStatus('gold', t('st_sending'));
  dlog(0, 'microfone: stop()');
  try { recognition.stop(); } catch(e) { recognition.onend && recognition.onend(); }
}

function stopRecording() {
  wantRecording = false; sendOnEnd = false; isRecording = false;
  finalText = ''; sessionParts = []; interimText = '';
  setMicUI(false);
  if (!isSpeaking) setStatus('ready', t('st_ready'));
  try { if (recognition) recognition.abort(); } catch(e) {}
}

// ── DIAGNÓSTICO (escondido: 5 toques em "Parlia vN" no fim do Perfil) ──
// Registo das últimas 30 falas (texto, voz, rate, onstart/onend/onerror/cancelado) e do microfone (start/stop/onend),
// com a hora em ms. Fica também na sessão do navegador (sobrevive a recarregar a página).
let diagLog = [], diagUtt = 0, lastSlowPlan = null, lastRecogEnd = 0;
try { const s = JSON.parse(sessionStorage.getItem('parlia_diag') || '[]'); if (Array.isArray(s)) { diagLog = s; diagUtt = s.reduce((m, x) => Math.max(m, x.id || 0), 0); } } catch(e) {}
function dlog(id, ev) {
  diagLog.push({ ms: Date.now(), id: id || 0, ev: String(ev) });
  const ids = [...new Set(diagLog.filter(x => x.id).map(x => x.id))];
  if (ids.length > 30) { const keep = new Set(ids.slice(-30)); diagLog = diagLog.filter(x => !x.id || keep.has(x.id)); }
  if (diagLog.length > 300) diagLog = diagLog.slice(-300);
  try { sessionStorage.setItem('parlia_diag', JSON.stringify(diagLog)); } catch(e) {}
  if (diagOpen()) renderDiag();
}
// cancel() da voz, com registo de quem o chamou.
function ttsCancel(where) {
  if (!where) { try { const l = (new Error().stack || '').split('\n')[2] || ''; where = (l.match(/at (?:Object\.)?([\w$.]+)/) || [])[1] || '?'; } catch(e) { where = '?'; } }
  dlog(0, 'cancel() — ' + where);
  synth.cancel();
}
function diagOpen() { const d = document.getElementById('diag-screen'); return !!d && d.style.display !== 'none'; }
function diagTime(ms) { const d = new Date(ms); return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0'); }
function diagText() {
  const loc = voiceLocale(), base = loc.split('-')[0].toLowerCase();
  const vs = voices.filter(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(base));
  const best = getBestVoice(loc), sp = slowPlan(loc);
  const vn = v => v ? `${v.name} (${v.lang}, localService=${v.localService})` : '(nenhuma: voz padrão do aparelho)';
  const lines = [
    `Parlia v${APP_VERSION} · ${navigator.userAgent}`,
    `Idioma estudado: ${currentLang} · locale da voz: ${loc} · vozes no aparelho: ${voices.length}`,
    '', `VOZES DO IDIOMA (${vs.length}):`,
    ...vs.map(v => `- ${v.name} | lang=${v.lang} | localService=${v.localService} | default=${v.default}`),
    '', `1.ª leitura: ${vn(best)}`,
    `2.ª leitura (lenta): ${vn(sp.voice)} · rate ${sp.rate} · caminho: ${sp.path}`,
    `Última leitura lenta usada: ${lastSlowPlan ? lastSlowPlan.path + ' · ' + lastSlowPlan.voice + ' · rate ' + lastSlowPlan.rate : '(ainda nenhuma)'}`,
    `speechSynthesis agora: speaking=${!!synth.speaking} pending=${!!synth.pending} paused=${!!synth.paused}`,
    '', 'REGISTO (hora · nº da fala · evento):',
    ...diagLog.map(x => `${diagTime(x.ms)} ${x.id ? '#' + x.id : '  '} ${x.ev}`)
  ];
  return lines.join('\n');
}
function renderDiag() { const p = document.getElementById('diag-text'); if (p) p.textContent = diagText(); }
function openDiag() { loadVoices(); renderDiag(); document.getElementById('diag-screen').style.display = 'flex'; }
function closeDiag() { document.getElementById('diag-screen').style.display = 'none'; }
function copyDiag() {
  const txt = diagText();
  const done = () => showToast('✓ Registro copiado');

function fallbackCopy(txt, done) {

function clearDiag() { diagLog = []; try { sessionStorage.removeItem('parlia_diag'); } catch(e) {} renderDiag(); }
