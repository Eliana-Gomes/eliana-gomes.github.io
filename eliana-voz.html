<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tutora de Voz — Luz em Movimento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --petrol: #00343d;
    --gold: #7A6200;
    --gold-light: #b89a00;
    --muted: #93927c;
    --light-gray: #d8d9dd;
    --cream: #f4f0ea;
    --white: #ffffff;
    --error: #c0392b;
    --success: #1a6b3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--petrol);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* HEADER */
  .header {
    width: 100%;
    padding: 20px 24px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    color: var(--cream);
    letter-spacing: 0.05em;
    font-weight: 400;
  }

  .header p {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* LANG SELECTOR */
  .lang-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    width: 100%;
  }
  .lang-row::-webkit-scrollbar { display: none; }

  .lang-pill {
    flex-shrink: 0;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .lang-pill.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--white);
  }

  /* MAIN AREA */
  .main {
    flex: 1;
    width: 100%;
    max-width: 480px;
    padding: 10px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* TOPIC PILLS */
  .topic-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .topic-row::-webkit-scrollbar { display: none; }

  .topic-pill {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--light-gray);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .topic-pill.active, .topic-pill:hover {
    background: rgba(122,98,0,0.3);
    border-color: var(--gold);
    color: var(--gold-light);
  }

  /* TRANSCRIPT AREA */
  .transcript-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px;
    min-height: 200px;
    max-height: 340px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .msg { font-size: 0.88rem; line-height: 1.55; }

  .msg.tutor .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold-light);
    margin-bottom: 4px;
  }

  .msg.tutor .bubble {
    background: rgba(122,98,0,0.18);
    border-left: 3px solid var(--gold);
    border-radius: 0 12px 12px 0;
    padding: 10px 13px;
    color: var(--cream);
  }

  .msg.user .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #7ab8c0;
    margin-bottom: 4px;
    text-align: right;
  }

  .msg.user .bubble {
    background: rgba(0,84,100,0.4);
    border-right: 3px solid #7ab8c0;
    border-radius: 12px 0 0 12px;
    padding: 10px 13px;
    color: var(--cream);
    text-align: right;
  }

  .correction {
    background: rgba(255,200,0,0.08);
    border: 1px solid rgba(122,98,0,0.4);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.78rem;
    color: #d4b800;
    line-height: 1.6;
    margin-top: 6px;
  }

  .correction strong { color: #f0d000; }

  /* MIC BUTTON */
  .mic-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }

  .mic-ring {
    position: relative;
    width: 96px;
    height: 96px;
  }

  .mic-ring-pulse {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    opacity: 0;
    transition: all 0.3s;
  }

  .mic-ring-pulse.active {
    opacity: 0.6;
    animation: pulse-ring 1.2s ease-out infinite;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .mic-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    color: var(--white);
    font-size: 2rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 24px rgba(122,98,0,0.4);
    position: relative;
    z-index: 1;
  }

  .mic-btn:hover { background: var(--gold-light); transform: scale(1.04); }
  .mic-btn.recording {
    background: #c0392b;
    box-shadow: 0 4px 24px rgba(192,57,43,0.5);
    animation: mic-pulse 1s ease-in-out infinite;
  }

  @keyframes mic-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .mic-btn.loading {
    background: var(--muted);
    animation: none;
    cursor: not-allowed;
  }

  .mic-label {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
  }

  /* TEXT INPUT (alternative) */
  .text-toggle {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }

  .text-toggle span {
    font-size: 0.72rem;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .text-input-row {
    display: none;
    gap: 8px;
    align-items: flex-end;
  }

  .text-input-row.show { display: flex; }

  .text-inp {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 0.87rem;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    outline: none;
    resize: none;
    min-height: 44px;
  }

  .text-inp::placeholder { color: var(--muted); }
  .text-inp:focus { border-color: var(--gold); }

  .send-btn {
    background: var(--gold);
    color: var(--white);
    border: none;
    border-radius: 12px;
    width: 44px;
    height: 44px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* STATUS BAR */
  .status-bar {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .status-dot.green { background: #2ecc71; animation: blink 1.2s infinite; }
  .status-dot.gold { background: var(--gold); }
  .status-dot.red { background: var(--error); }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* TIPS */
  .tip-strip {
    background: rgba(0,84,100,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.77rem;
    color: #7ab8c0;
    line-height: 1.55;
    border-left: 3px solid #7ab8c0;
  }

  .tip-strip strong { color: var(--cream); }

  /* LOADING DOTS */
  .dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold-light);
    animation: bounce 1.1s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%,80%,100% { transform: scale(0.5); opacity:0.4; }
    40% { transform: scale(1); opacity:1; }
  }

  /* VOICE OUTPUT indicator */
  .speaking-badge {
    display: none;
    background: rgba(46,204,113,0.15);
    border: 1px solid #2ecc71;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.75rem;
    color: #2ecc71;
    text-align: center;
  }
  .speaking-badge.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <h1>🎤 Tutora de Voz</h1>
  <p>Luz em Movimento · Idiomas</p>
</div>

<div class="lang-row">
  <button class="lang-pill active" onclick="setLang('es','Espanhol','es-ES')">🇪🇸 Espanhol</button>
  <button class="lang-pill" onclick="setLang('en','Inglês','en-GB')">🇬🇧 Inglês</button>
  <button class="lang-pill" onclick="setLang('fr','Francês','fr-FR')">🇫🇷 Francês</button>
  <button class="lang-pill" onclick="setLang('it','Italiano','it-IT')">🇮🇹 Italiano</button>
</div>

<div class="main">

  <!-- TOPICS -->
  <div class="topic-row" id="topic-row">
    <button class="topic-pill active" onclick="setTopic(this,'Conversa livre')">🗣️ Livre</button>
    <button class="topic-pill" onclick="setTopic(this,'No supermercado')">🛒 Supermercado</button>
    <button class="topic-pill" onclick="setTopic(this,'No médico ou farmácia')">🏥 Médico</button>
    <button class="topic-pill" onclick="setTopic(this,'Pagar a renda e falar com o senhorio')">🏠 Senhorio</button>
    <button class="topic-pill" onclick="setTopic(this,'No banco ou correios')">🏦 Banco</button>
    <button class="topic-pill" onclick="setTopic(this,'Apresentação pessoal')">👤 Apresentação</button>
  </div>

  <!-- TRANSCRIPT -->
  <div class="transcript-box" id="transcript"></div>

  <!-- SPEAKING INDICATOR -->
  <div class="speaking-badge" id="speaking-badge">🔊 Tutora a falar...</div>

  <!-- STATUS -->
  <div class="status-bar" id="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">A iniciar tutora...</span>
  </div>

  <!-- MIC -->
  <div class="mic-section">
    <div class="mic-ring">
      <div class="mic-ring-pulse" id="mic-ring"></div>
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>
    <div class="mic-label" id="mic-label">Toca para falar</div>
  </div>

  <!-- TEXT ALTERNATIVE -->
  <div class="text-toggle">
    <span onclick="toggleTextMode()">⌨️ Preferes escrever?</span>
  </div>

  <div class="text-input-row" id="text-row">
    <textarea class="text-inp" id="text-inp" placeholder="Escreve aqui..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
    <button class="send-btn" onclick="sendText()">➤</button>
  </div>

  <!-- TIP -->
  <div class="tip-strip" id="tip-strip">
    <strong>💡 Dica:</strong> <span id="tip-text">A carregar...</span>
  </div>

</div>

<script>
// ── STATE ──
let currentLang = 'es';
let currentLangName = 'Espanhol';
let currentLocale = 'es-ES';
let currentTopic = 'Conversa livre';
let chatHistory = [];
let recognition = null;
let isRecording = false;
let isSpeaking = false;
let synth = window.speechSynthesis;
let voices = [];

const TIPS = {
  es: 'Em espanhol, usa "¿" e "¡" no início das perguntas e exclamações. Soa estranho no início mas é importante para a escrita!',
  en: 'Em inglês, o "th" (como em "the" ou "think") não existe em português. Coloca a língua entre os dentes suavemente.',
  fr: 'Em francês, o "r" é gutural — vem da garganta, não da língua como em português.',
  it: 'Em italiano, as vogais finais são sempre pronunciadas claramente. "Pasta" soa "PAS-ta", não "PAS-tuh".'
};

// ── INIT ──
window.addEventListener('load', () => {
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  setStatus('ready', 'Pronta! Toca no microfone para começar.');
  document.getElementById('tip-text').textContent = TIPS[currentLang];
  initRecognition();
  // Auto welcome
  setTimeout(() => greet(), 600);
});

function loadVoices() {
  voices = synth.getVoices();
}

function getBestVoice(locale) {
  // Try exact match first, then language prefix
  return voices.find(v => v.lang === locale)
    || voices.find(v => v.lang.startsWith(locale.split('-')[0]))
    || voices[0];
}

// ── LANGUAGE ──
function setLang(code, name, locale) {
  currentLang = code;
  currentLangName = name;
  currentLocale = locale;
  document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tip-text').textContent = TIPS[code];
  chatHistory = [];
  clearTranscript();
  stopRecording();
  synth.cancel();
  initRecognition();
  setTimeout(() => greet(), 300);
}

// ── TOPIC ──
function setTopic(el, topic) {
  currentTopic = topic;
  document.querySelectorAll('.topic-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  chatHistory = [];
  clearTranscript();
  synth.cancel();
  setTimeout(() => greet(), 200);
}

// ── SPEECH RECOGNITION ──
function initRecognition() {
  if (recognition) { try { recognition.abort(); } catch(e) {} }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('error', 'O teu navegador não suporta reconhecimento de voz. Usa o Chrome.');
    return;
  }

  recognition = new SR();
  recognition.lang = currentLocale;
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent = '⏹';
    document.getElementById('mic-ring').classList.add('active');
    document.getElementById('mic-label').textContent = 'A ouvir... fala agora!';
    setStatus('green', 'A ouvir a tua voz...');
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(r => r[0].transcript).join('');
    if (e.results[0].isFinal) {
      handleUserSpeech(transcript);
    } else {
      setStatus('green', '🎙️ ' + transcript);
    }
  };

  recognition.onerror = (e) => {
    stopRecording();
    if (e.error === 'no-speech') {
      setStatus('ready', 'Não ouvi nada. Toca novamente e fala.');
    } else if (e.error === 'not-allowed') {
      setStatus('error', 'Microfone bloqueado. Vai às definições do Chrome e permite o microfone.');
    } else {
      setStatus('ready', 'Erro: ' + e.error + '. Tenta de novo.');
    }
  };

  recognition.onend = () => { stopRecording(); };
}

function toggleMic() {
  if (isSpeaking) { synth.cancel(); isSpeaking = false; }
  if (isRecording) { stopRecording(); return; }
  startRecording();
}

function startRecording() {
  if (!recognition) { initRecognition(); }
  try { recognition.start(); }
  catch(e) { initRecognition(); setTimeout(() => recognition.start(), 200); }
}

function stopRecording() {
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').textContent = '🎤';
  document.getElementById('mic-ring').classList.remove('active');
  document.getElementById('mic-label').textContent = 'Toca para falar';
  if (!isSpeaking) setStatus('ready', 'Pronta. Toca para falar.');
  try { if (recognition) recognition.stop(); } catch(e) {}
}

// ── SPEECH SYNTHESIS ──
function speak(text, onEnd) {
  synth.cancel();
  // Remove emoji and markdown-like chars for cleaner speech
  const clean = text.replace(/[📝✅❌🎤🔊💡👤🛒🏥🏠🏦]/g, '').replace(/\*\*/g,'').trim();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = currentLocale;
  utt.rate = 0.88;
  utt.pitch = 1.05;
  const voice = getBestVoice(currentLocale);
  if (voice) utt.voice = voice;

  isSpeaking = true;
  document.getElementById('speaking-badge').classList.add('show');
  setStatus('green', '🔊 Tutora a falar...');

  utt.onend = () => {
    isSpeaking = false;
    document.getElementById('speaking-badge').classList.remove('show');
    setStatus('ready', 'Pronta. Toca para responder.');
    if (onEnd) onEnd();
  };

  utt.onerror = () => {
    isSpeaking = false;
    document.getElementById('speaking-badge').classList.remove('show');
    setStatus('ready', 'Pronta. Toca para falar.');
  };

  synth.speak(utt);
}

// ── AI ──
async function greet() {
  setStatus('gold', 'A preparar tutora...');
  addLoadingMsg();

  const system = buildSystem();
  const prompt = `Apresenta-te brevemente em ${currentLangName} e convida Eliana a praticar "${currentTopic}". Máximo 2 frases. Sem correção agora, só boas-vindas calorosas.`;

  try {
    const reply = await callAI([{ role: 'user', content: prompt }], system);
    removeLoading();
    addMsg('tutor', reply);
    speak(reply);
    chatHistory.push({ role: 'assistant', content: reply });
  } catch(e) {
    removeLoading();
    const fallback = currentLang === 'es'
      ? `¡Hola, Eliana! Soy tu tutora de español. Hoy practicamos: ${currentTopic}. ¡Habla cuando quieras!`
      : `Hello Eliana! I'm your ${currentLangName} tutor. Today: ${currentTopic}. Speak when ready!`;
    addMsg('tutor', fallback);
    speak(fallback);
  }
}

async function handleUserSpeech(text) {
  if (!text.trim()) return;
  addMsg('user', text);
  chatHistory.push({ role: 'user', content: text });
  await processInput(text);
}

async function sendText() {
  const inp = document.getElementById('text-inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  addMsg('user', text);
  chatHistory.push({ role: 'user', content: text });
  await processInput(text);
}

async function processInput(text) {
  setStatus('gold', 'A processar...');
  addLoadingMsg();

  const system = buildSystem();
  const messages = chatHistory.map(m => ({ role: m.role, content: m.content }));

  try {
    const reply = await callAI(messages, system);
    removeLoading();

    // Split main reply from correction
    const corrIdx = reply.indexOf('📝');
    if (corrIdx > 0) {
      const main = reply.substring(0, corrIdx).trim();
      const corr = reply.substring(corrIdx).trim();
      addMsg('tutor', main, corr);
      chatHistory.push({ role: 'assistant', content: reply });
      // Speak only the main part
      speak(main);
    } else {
      addMsg('tutor', reply);
      chatHistory.push({ role: 'assistant', content: reply });
      speak(reply);
    }
  } catch(e) {
    removeLoading();
    setStatus('error', 'Erro de ligação. Tenta de novo.');
  }
}

function buildSystem() {
  return `És uma tutora de ${currentLangName} para Eliana, falante de português brasileiro, nível intermediário em espanhol (portunhol), iniciante nos outros idiomas. Ela mora em Huelva, Espanha.

REGRAS ABSOLUTAS:
1. Responde SEMPRE em ${currentLangName} (a tua resposta principal de conversa).
2. Sê natural, calorosa, como uma amiga que ensina.
3. Mantém respostas CURTAS: máximo 3 frases. Ela vai ouvir por voz.
4. Se houver erros gramaticais ou de vocabulário na fala de Eliana:
   - Primeiro dá uma resposta natural à conversa em ${currentLangName}
   - Depois numa nova linha: 📝 [versão errada] → [versão correta] · [explicação em PT-BR, muito curta]
5. Se não houver erros, elogia brevemente e continua a conversa.
6. Faz sempre uma pergunta para continuar o diálogo.
7. Tema atual: "${currentTopic}"
8. NUNCA uses respostas longas — ela ouve por voz, frases curtas são essenciais.`;
}

async function callAI(messages, system) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system,
      messages
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content[0].text;
}

// ── UI ──
function addMsg(role, text, correction) {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  let html = `<div class="label">${role === 'tutor' ? '🎓 Tutora' : '🎤 Tu'}</div>
              <div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  if (correction) {
    html += `<div class="correction">${correction.replace(/\n/g,'<br>')}</div>`;
  }
  div.innerHTML = html;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addLoadingMsg() {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg tutor';
  div.id = 'loading-msg';
  div.innerHTML = `<div class="label">🎓 Tutora</div>
    <div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

function clearTranscript() {
  document.getElementById('transcript').innerHTML = '';
}

function setStatus(type, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot';
  if (type === 'green') dot.classList.add('green');
  else if (type === 'gold') dot.classList.add('gold');
  else if (type === 'error') dot.classList.add('red');
  document.getElementById('status-text').textContent = text;
}

function toggleTextMode() {
  const row = document.getElementById('text-row');
  row.classList.toggle('show');
}
</script>
</body>
</html>
