// ── Passos da lição, feitos pelo app (frases fixas). A IA só devolve um JSON com a avaliação. ──
// lessonState = { pos: passo atual em lessonSteps(), tries: tentativas erradas neste passo }
function lzNI() { return NATIVES[getNative(PROFILE)]; }
function lzLangName() { return lzNI().group === 'en' ? langUI(currentLang) : langUI(currentLang).toLowerCase(); }
// "Repita comigo" sempre na língua nativa (com "com os seus dados" quando a frase tem "…").
function lzRepeat(it) { return lzNI().repeatEx + (it.t.includes('…') ? ' ' + t('lz_fill') : ''); }
// Pergunta LEMBRAR: só na língua nativa e sem a frase a lembrar ("Como se diz "tchau" em francês?").
function lzRecallQ(it) {
  const m = it.g.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
  return t('lz_recall_q', { txt: m ? m[1] : it.g, lang: lzLangName() }) + (m ? ' (' + m[2] + ')' : '');
}
function lzGloss(it) { return `[nat] (${it.g.replace(/\s*\(([^)]*)\)/g, ' — $1')})`; }
// Mini-conversa: fala da Lia e resposta modelo (frases da lição) da troca n.
function lzTurn(items, n) { const [a, b] = lessonChat(currentLesson)[n] || [0, 0]; return { lia: items[a] || items[0], ans: items[b] || items[0] }; }
// Texto do pedido de um passo (o app escreve tudo): ENSINAR, LEMBRAR ou fala da Lia na mini-conversa.
function lzStepText(step, items, prev) {
  if (step.k === 'teach') { const it = items[step.i]; return `[alvo] ${it.t}\n${lzGloss(it)}\n[nat] ${lzRepeat(it)}.`; }
  if (step.k === 'recall') return (prev && prev.k === 'teach' ? `[nat] ${t('lz_recall_intro')}\n` : '') + `[nat] ${lzRecallQ(items[step.i])}`;
  const tn = lzTurn(items, step.i);
  return (prev && prev.k !== 'chat' ? `[nat] ${t('lz_chat_intro')}\n` : '') + `[alvo] ${tn.lia.t}\n${lzGloss(tn.lia)}`;
}
// O que a aluna deve dizer neste passo (depois de um erro, é sempre a frase a repetir).
function lzExpected(step, items) { return step.k === 'chat' ? lzTurn(items, step.i).ans : items[step.i]; }
// Pedido do passo outra vez (pergunta, resposta pouco clara, JSON inválido).
function lzAgainText(step, items, tries) {
  const ex = lzExpected(step, items);
  if (tries || step.k === 'teach') return `[nat] ${lzRepeat(ex)}:\n[alvo] ${ex.t}`;
  return lzStepText(step, items, null);
}

// Linhas de feedback da IA que nunca aparecem: maiúsculas, acentos, pontuação (o reconhecimento de voz não os escreve),
// progresso, fases, fim da lição ou tentativas (só o app fala disso).
const LZ_TYPO_TALK = /acento|accent|pontua|puntua|punctua|ponctua|punteggiat|mai[uú]scul|may[uú]scul|capital|majuscul|maiuscol|apostro|tilde|cedilh|cedill|c[ée]dille|ortograf|spelling|orthograph/i;
const LZ_PROGRESS_TALK = /conclu|acert|ultim|\blast\b|derni|\bboth\b|ambas|as duas|les deux|entrambe|tutte e due|termin|complet|revis|review|finish|\bfini|finito|ripass|tentativa|tentativo|intento|attempt|tentative|todas as|todas las|toutes les|tutte le|\ball (the )?(\d|five|four|phrases)|\d+ (frases|phrases|frasi)|(licao|leccion|lecon|lezione|lesson) \d|proxima (fase|etapa)|next (step|phase)|proximo passo|vamos lembrar|vamos recordar|let s remember|on revise|ripassiamo|conversa|conversation|conversacion|conversazione|vamos conversar|vamos a hablar|let s talk|let s chat|on va parler|parliamo un po/;
// Notas em inglês (ex.: "Eliana repeated my own words…") para quem não é anglófono.
const LZ_ENGLISH = /\b(the|you|your|is|are|was|answer|learner|repeated|instead|step|said|should|my|own|words|correct|wrong)\b/gi;
function lzNorm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim(); }
// A aluna fez uma pergunta ou pediu explicação (em qualquer língua), em vez de responder? (Não conta como tentativa.)
function lzLooksQuestion(text, expected) {
  const tw = lzNorm(text).split(' ').filter(Boolean), ew = lzNorm(expected).split(' ').filter(Boolean);
  if (!tw.length) return false;
  const m = tw.join(' ').match(/\b(o que|que significa|que quer dizer|que quiere decir|que es|que significa|what does|what is|whats|meaning|mean|c est quoi|ca veut dire|qu est ce que|cosa vuol dire|cosa significa|che cosa|cos e|significa|significado|por que|porque|why|pourquoi|perche|nao entendi|nao percebi|no entiendo|no entendi|dont understand|didnt understand|ne comprends|pas compris|non capisco|non ho capito|explica|explique|explain|spiega|como se diz|como se dice|how do you say|comment dit on|come si dice)\b/);
  // Inícios típicos de pergunta, mesmo com transcrição imperfeita ("qu’est-ce qui ne fait que très bien").
  const s = tw.join(' ').match(/^(qu est ce|quest ce|qu est|kesk|c est quoi|ces quoi|que|cosa|che|what|whats|o que|oque|how|why|pourquoi|perche|por que|porque)\b/);
  // A pergunta não pode ser parte da própria frase da lição (ex.: « C’est quoi, ton numéro ? »).
  const notPhrase = x => !(' ' + ew.join(' ') + ' ').includes(' ' + x + ' ');
  return (!!m && notPhrase(m[1])) || (!!s && notPhrase(s[1]));
}
// Lê o JSON da IA: { result: correct | wrong | question | unclear, feedback }. Inválido → unclear.
function lzParse(reply) {
  try {
    const j = JSON.parse(String(reply).match(/\{[\s\S]*\}/)[0]);
    const r = String(j.result || '').toLowerCase().trim();
    return { result: ['correct', 'wrong', 'question', 'unclear'].includes(r) ? r : 'unclear', feedback: String(j.feedback || '').replace(/\s+/g, ' ').trim() };
  } catch (e) { return { result: 'unclear', feedback: '' }; }
}
// Feedback da IA: uma só linha, na língua nativa, sem comentários proibidos.
function lzCleanFeedback(fb) {
  let s = String(fb || '').split('\n')[0].replace(/\[(nat|alvo)\]\s*/gi, '').replace(/^[📝✅🗣️💡🎯\s]+/u, '').trim();
  if (!s || LZ_TYPO_TALK.test(s) || LZ_PROGRESS_TALK.test(lzNorm(s))) return '';
  if (lzNI().group !== 'en' && (s.match(LZ_ENGLISH) || []).length >= 2) return '';
  return s.length > 220 ? s.slice(0, 217) + '…' : s;
}

// Abre a lição: o app mostra a meta e ensina a primeira frase (sem chamar a IA).
function greetLesson() {
  const i = currentLesson, items = lessonItems(i), steps = lessonSteps(items.length);
  lessonState = { pos: 0, tries: 0 };
  const text = `[nat] ${t('lz_intro', { n: i + 1, title: lessonUI(i)[0], k: items.length })}\n` + lzStepText(steps[0], items);
  chatHistory = [{ role: 'user', content: `(${PROFILE.name} opened lesson ${i + 1}.)` }, { role: 'assistant', content: text }];
  addMsg('tutor', text, '', false, text, items[0].t);
  speak(text);
}

// Resposta da IA no modo Do zero (só JSON). O app escreve tudo o que a aluna vê: confirmação, correção,
// "Repita comigo", o passo seguinte, avisos de fase e o fim da lição.
function processLessonReply(reply) {
  const items = lessonItems(currentLesson), steps = lessonSteps(items.length);
  if (!lessonState) lessonState = { pos: 0, tries: 0 };
  const st = lessonState, step = steps[Math.min(st.pos, steps.length - 1)], ex = lzExpected(step, items);
  const userText = (chatHistory.filter(m => m.role === 'user').pop() || {}).content || '';
  let { result, feedback } = lzParse(reply);
  feedback = lzCleanFeedback(feedback);
  // Pergunta da aluna (mesmo mal transcrita): nunca é acerto nem tentativa.
  if (result !== 'question' && step.k !== 'chat' && lzLooksQuestion(userText, ex.t)) result = 'question';
  const out = [];
  let hint = '', finished = false, advance = false;
  if (result === 'correct') {
    out.push(`[alvo] ${tgt('correct')}`);
    if (feedback) out.push(`[nat] ${feedback}`); // no máximo uma dica de uso
    advance = true;
  } else if (result === 'wrong') {
    if (feedback) out.push(`[nat] ${feedback}`);
    nbAdd({ type: 'erro', wrong: userText, right: ex.t, why: feedback });
    out.push(`[nat] ${t(step.k === 'chat' ? 'lz_possible' : 'lz_answer_is', { a: ex.t })}`);
    if (st.tries >= 1) advance = true; // 2.ª tentativa errada: segue em frente
    else { st.tries++; out.push(`[nat] ${lzRepeat(ex)}:`, `[alvo] ${ex.t}`); }
  } else {
    // question / unclear: explicação curta e o mesmo pedido outra vez (não conta como tentativa)
    if (feedback) out.push(`[nat] ${feedback}`);
    else if (result === 'unclear') out.push(`[nat] ${t('lz_unclear')}`);
    out.push(lzAgainText(step, items, st.tries));
    if (step.k === 'recall' && !st.tries) hint = ex.t;
    if (step.k === 'chat' && !st.tries) hint = ex.t;
  }
  if (advance) {
    st.pos++; st.tries = 0;
    const nx = steps[st.pos];
    if (!nx) { finished = true; out.push(`[nat] ${t('lz_end')}`, `[alvo] ${items.map(x => x.t).join(' · ')}`); }
    else { out.push(lzStepText(nx, items, step)); if (nx.k !== 'teach') hint = lzExpected(nx, items).t; }
  }
  const main = out.join('\n');
  chatHistory.push({ role: 'assistant', content: main });
  const nowStep = !finished && steps[st.pos];
  addMsg('tutor', main, '', false, main, nowStep ? lzExpected(nowStep, items).t : '', hint);
  if (finished && !lessonCompleted && currentLesson !== null) {
    const i = currentLesson;
    lessonCompleted = true;
    markLessonDone(i);
    let shown = false;
    const show = () => { if (shown) return; shown = true; celebrateLesson(i); };
    speak(main, show);
    setTimeout(show, 12000); // se a voz falhar ou for interrompida
  } else {
    speak(main);
  }
}

async function handleUserSpeech(text) {
  if (!text.trim()) return;
  hideSuggestions();
  lastUserDiv = addMsg('user', text);
  countPractice();
  chatHistory.push({ role: 'user', content: text });
  saveLessonSession();
  await processInput(text);
}

async function sendText() {
  if (isBusy()) return; // bloqueado enquanto a tutora pensa ou fala
  const inp = document.getElementById('text-inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  hideSuggestions();
  lastUserDiv = addMsg('user', text);
  countPractice();
  chatHistory.push({ role: 'user', content: text });
  saveLessonSession();
  await processInput(text);
}

async function processInput(text) {
  // Teste de nível: as respostas não são corrigidas nem enviadas à IA uma a uma.
  if (currentTest && !currentTest.finished) { handleTestAnswer(text); return; }
  if (currentTest && currentTest.finished) exitTest(); // depois do resultado, a conversa segue normal
  setStatus('gold', t('st_processing'));
  addLoadingMsg();
  try {
    const inLesson = currentLesson !== null, runAtStart = lessonRun;
    let recent = chatHistory.slice(inLesson ? -40 : -20); // as lições precisam de mais histórico
    while (recent.length && recent[0].role !== 'user') recent = recent.slice(1);
    const reply = await busyAI(inLesson ? [{ role: 'user', content: `${PROFILE.name}'s message: "${text}"` }] : recent.map(m => ({ role: m.role, content: m.content })), inLesson ? buildLessonSystem() : buildSystem());
    removeLoading();
    if (inLesson) { if (currentLesson !== null && lessonRun === runAtStart) processLessonReply(reply); return; } // a aluna não saiu nem recomeçou
    const goalMatch = reply.match(/🎯\s*([A-ZÀ-Ú ]+)/u);
    const goal = goalMatch ? goalMatch[1] : '';
    const lines = reply.replace(/🎯\s*[A-ZÀ-Ú ]*/gu, '').split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
    if (repeatTarget && /ESCLARECIMENTO/i.test(goal)) { repeatTarget = ''; repeatTries = 0; }
    else if (repeatTarget && !/PERGUNTA/i.test(goal)) {
      repeatTries++;
      if (/OK/i.test(goal) || repeatTries >= 2) { repeatTarget = ''; repeatTries = 0; }
    }
    const starts = (l, s) => l.trim().startsWith(s);
    // Uma correção por vez: só a primeira linha 📝; a linha 🗣️ só aparece quando não há 📝.
    // Só conta como correção se os dois lados forem diferentes de verdade (não só maiúsculas, acentos ou pontuação).
    const formKey = t => (t || '').replace(/^[📝\s]+/u, '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    const realFix = l => { const [a, b] = l.split('·')[0].split('→'); return !!(formKey(a) && formKey(b) && formKey(a) !== formKey(b)); };
    const wasRepeating = !!repeatTarget;
    let gramFix = lines.filter(l => starts(l, '📝') && l.includes('→') && realFix(l)).slice(0, 1);
    // Erros extra da mesma fala (➕): não aparecem na conversa, só vão para o caderno (até 3 erros no total).
    let extraFix = wasRepeating ? [] : lines.filter(l => starts(l, '➕') && l.includes('→') && realFix(l.replace(/^[➕\s]+/u, '')));
    const okLine = lines.find(l => starts(l, '✅')) || '';
    const sayLine = lines.find(l => starts(l, '💬')) || '';
    // Sem 📝 mas com erros: a primeira linha ➕ passa a ser a correção; senão, a diferença entre a fala e a ✅.
    if (!gramFix.length && !wasRepeating && !sayLine) {
      if (extraFix.length) gramFix = ['📝 ' + extraFix.shift().replace(/^[➕\s]+/u, '')];
      else { const d = diffFix(text, okLine.replace(/^[✅\s]+/u, '')); if (d) gramFix = [d]; }
    }
    extraFix = extraFix.slice(0, 2);
    const fixLines = gramFix.length ? gramFix : lines.filter(l => starts(l, '🗣')).slice(0, 1);
    let main = lines.filter(l => !['📝', '🗣', '✅', '🔁', '💬', '➕'].some(s => starts(l, s))).join('\n').trim();
    const unq = t => t.replace(/^[📝✅🔁💬🗣️\s]+/u, '').replace(/["“”«»]/g, '').trim();
    const ask = tgt('ask'), rep = tgt('rep');
    // Frase inteira na língua nativa: não é erro; mostra como dizer no idioma e pede para repetir.
    if (!gramFix.length && sayLine && unq(sayLine) && !wasRepeating) {
      const say = unq(sayLine);
      const canSay = tgt('canSay');
      main = `${canSay} «${say}»\n${ask}`;
      repeatTarget = say; repeatTries = 0;
      chatHistory.push({ role: 'assistant', content: main });
      const spokenSay = `${canSay} ${say}. ${rep} ${say}.`;
      addMsg('tutor', main, '', false, spokenSay, say);
      speak(spokenSay);
      return;
    }
    // Frase para repetir: a própria frase ✅ (até 10 palavras, senão só a parte com a correção).
    const fragment = gramFix.length ? repeatPhrase(unq(okLine), unq(gramFix[0].split('·')[0].split('→')[1] || '')) : '';
    if (gramFix.length && !wasRepeating) {
      main = `${ask}: «${fragment}»`;
    }
    chatHistory.push({ role: 'assistant', content: [main, ...fixLines, okLine].filter(Boolean).join('\n') });
    if (fixLines.length) {
      const fixed = okLine.replace('✅', '').trim();
      if (gramFix.length && !wasRepeating) { repeatTarget = fragment; repeatTries = 0; }
      if (gramFix.length) {
        const p0 = gramFix[0].split('·'), [wa, wb] = p0[0].split('→').map(t => unq(t || ''));
        highlightError(lastUserDiv, wa);
        // Guarda a correção no caderno (📒 Meus erros).
        if (wa && wb) nbAdd({ type: 'erro', wrong: wa, right: wb, why: p0.slice(1).join('·').trim() });
        extraFix.forEach(l => {
          const p = l.replace(/^[➕\s]+/u, '').split('·'), [xa, xb] = p[0].split('→').map(t => unq(t || ''));
          if (xa && xb) nbAdd({ type: 'erro', wrong: xa, right: xb, why: p.slice(1).join('·').trim() });
        });
      }
      const short = fixLines.map(l => esc(l.split('·')[0].trim())).join('<br>');
      const why = fixLines.map(l => { const p = l.split('·'); return p[1] ? esc(p[0].replace(/^[📝🗣️\s]+/u,'').trim() + ': ' + p.slice(1).join('·').trim()) : ''; }).filter(Boolean).join('<br>');
      const html = (fixed ? `<div class="fix-main">✅ ${esc(fixed)}</div>` : '') +
        `<div class="fix-list">${short}</div>` +
        (why ? `<details class="fix-why"><summary>${esc(t('why'))}</summary>${why}</details>` : '') +
        (gramFix.length && extraFix.length ? `<div class="fix-more">${esc(t('fix_more', { n: extraFix.length }))}</div>` : '');
      const pairs = gramFix.map(l => {
        const [a, b] = l.split('·')[0].split('→'); return [unq(a), unq(b)];
      }).filter(([a, b]) => a && b);
      const better = BETTER[currentLang] || ((a, b) => `${b}.`);
      const sayFull = tgt('sayFull');
      const spokenFix = pairs.length ? pairs.map(([a, b]) => better(a, b)).join(' ') : (fixed ? `${sayFull} ${fixed}.` : '');
      const spoken = gramFix.length && !wasRepeating ? `${spokenFix} ${rep} ${fragment}.` : (spokenFix ? `${spokenFix} ${main}` : main);
      addMsg('tutor', main, html, true, spoken, fixed);
      speak(spoken);
    } else {
      addMsg('tutor', main || reply);
      speak(main || reply);
    }
  } catch(e) {
    removeLoading();
    setStatus('error', t('st_error') + (e && e.message ? e.message : t('no_connection')));
  }
}

// A IA reescreveu a frase (✅) sem linha 📝: a correção é o trecho em que a fala e a ✅ diferem
// (palavras iguais no início e no fim ficam de fora). Só serve se o trecho for curto (uma correção só).
function diffFix(said, ok) {
  const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  const a = String(said || '').split(/\s+/).filter(w => norm(w)), b = String(ok || '').split(/\s+/).filter(w => norm(w));
  if (!a.length || !b.length) return '';
  const na = a.map(norm), nb = b.map(norm);
  let p = 0; while (p < na.length && p < nb.length && na[p] === nb[p]) p++;
  let s = 0; while (s < na.length - p && s < nb.length - p && na[na.length - 1 - s] === nb[nb.length - 1 - s]) s++;
  let ea = na.length - s, eb = nb.length - s;
  if (p === ea && p === eb) return ''; // iguais (só maiúsculas, acentos ou pontuação)
  if (p === ea || p === eb) { if (p > 0) p--; else { ea++; eb++; } } // palavra que falta ou sobra: mostra com a vizinha
  const wa = a.slice(p, ea), wb = b.slice(p, eb);
  if (!wa.length || !wb.length || wa.length > 6 || wb.length > 8) return '';
  const clean = ws => ws.join(' ').replace(/^[,;:.!?¡¿]+|[,;:.!?]+$/g, '').trim();
  return `📝 ${clean(wa)} → ${clean(wb)}`;
}

// Frase para repetir, tirada da frase ✅ sem reescrever: a oração (entre vírgulas/pontos) que contém a
// correção principal; senão a ✅ inteira se tiver até 10 palavras; senão 10 palavras a partir da correção.
function repeatPhrase(ok, right) {
  const MAX = 10;
  const words = ok.split(/\s+/).filter(Boolean);
  if (!words.length) return right;
  const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  const rw = right.split(/\s+/).map(norm).filter(Boolean);
  const trimP = t => t.trim().replace(/^[,;:]+|[,;:]+$/g, '').trim();
  // A ✅ traz todos os erros corrigidos: prefere a oração que contém a correção principal.
  const clause = rw.length && ok.split(/(?<=[,;:.!?])\s+/).find(c => {
    const cw = c.split(/\s+/).map(norm);
    return cw.length <= MAX && rw.every(w => cw.includes(w));
  });
  if (clause) return trimP(clause);
  if (words.length <= MAX) return ok;
  if (!rw.length) return right;
  const nw = words.map(norm);
  let start = -1;
  for (let i = 0; i + rw.length <= nw.length; i++) if (rw.every((w, j) => nw[i + j] === w)) { start = i; break; }
  if (start < 0) return right; // a correção não aparece na frase ✅: usa o lado direito do 📝
  const size = Math.max(MAX, rw.length);
  const e = Math.min(words.length, start + size);
  const s = Math.max(0, e - size);
  return trimP(words.slice(s, e).join(' '));
}

// Regra de língua no topo das instruções: as instruções estão em inglês, mas tudo o que é para o aluno
// (explicações, traduções, linhas [nat]) vai na língua nativa do perfil.
function langRule(NI) {
  const name = (PROFILE && PROFILE.name) || 'the learner';
  const notEn = NI.group !== 'en';
  return `LANGUAGE (main rule): ${name}'s native language is ${NI.expl.toUpperCase()}. These instructions are in English only for convenience. Explanations, translations, [nat] lines, tips and comments ALWAYS go in ${NI.expl}` +
    (notEn ? `, NEVER in English${currentLang === 'en' ? ' (only the practice sentences in the language being learned, English, are in English)' : ''} and never in any other language.` : ', never in any other language.');
}

// Variante do idioma estudado: espanhol conforme o sotaque do perfil; português conforme a variante do perfil.
function accentRule(P) {
  const EX = NATIVES[getNative(P || PROFILE)].expl;
  if (currentLang === 'pt') {
    // Forma correta da outra variante: não é erro, só se comenta a diferença.
    const diff = ex => `A correct form from the other variant is NOT a mistake: do not correct it and do not use 📝; only comment on the difference in one short line in ${EX} (in conversation, a 🗣️ line, e.g. 🗣️ ${ex} · both forms are correct; in lessons, a [nat] line).`;
    return ptIsPT()
      ? 'Use and teach European Portuguese (Portugal): address the learner as "tu" with 2nd-person verb forms ("tu fazes", "queres"), "estou a fazer" (not "estou fazendo"), pronouns after the verb ("diz-me", "chamo-me"), Portuguese vocabulary (autocarro, comboio, pequeno-almoço, telemóvel, casa de banho). ' + diff('"ônibus" → "autocarro" (Portugal)')
      : 'Use and teach Brazilian Portuguese: "você", "estou fazendo", pronouns before the verb ("me diga", "eu me chamo"), Brazilian vocabulary (ônibus, trem, café da manhã, celular, banheiro). ' + diff('"autocarro" → "ônibus" (Brazil)');
  }
  if (currentLang !== 'es') return '';
  return P && P.accent === 'América Latina'
    ? 'Use Latin American Spanish (ustedes, computadora, carro, celular). Do not mark correct Spain Spanish forms as mistakes.'
    : 'Use Spain Spanish (vosotros, ordenador, coche, móvil). Do not mark correct Latin American Spanish forms as mistakes.';
}

function buildSystem() {
  const P = PROFILE || { name: 'the learner', city: '', levels: {} };
  const NI = NATIVES[getNative(P)];
  const N = P.name, EX = NI.expl, L = currentLangName;
  const lvl = (P.levels && P.levels[currentLang]) || DEFAULT_LEVELS[currentLang] || 'intermediário';
  const typical = (TYPICAL[NI.group] || {})[currentLang];
  const style = {
    'amigável': 'Style: friendly, warm and encouraging.',
    'formal': `Style: formal and polite; address ${N} with the language's polite form (usted, vous, Lei).`,
    'divertida': 'Style: fun and good-humoured, with light humour, without losing focus on corrections.'
  }[P.style] || 'Style: friendly, warm and encouraging.';
  const mem = topErrors(5);
  const memory = mem.length ? `MEMORY (for you only): these are the mistakes ${N} repeats most in ${L}:
${mem.map(e => `- "${e.wrong}" → "${e.right}"${e.why ? ' (' + e.why + ')' : ''}${e.count > 1 ? ' — ' + e.count + ' times' : ''}`).join('\n')}
Now and then (not in every reply), ask natural questions that lead ${N} to use these structures. NEVER announce that you are doing this or mention this list.
` : '';
  return `${langRule(NI)}
You are Lia, a ${L} tutor for ${N}, ${NI.speaker}. All explanations for ${N} are in ${EX}: ${NI.variant}. ${N}'s level in ${L}: ${lvl}. Adapt vocabulary and pace to that level (at beginner level, use very simple sentences).
${style}${accentRule(P) ? ' ' + accentRule(P) : ''}
${P.city ? `Context (for you only): ${N} lives in ${P.city}. Do NOT mention the city in your replies unless ${N} brings it up first.\n` : ''}You talk with ${N} and correct only REAL mistakes.
The text comes from speech recognition. TOLERANCE: ignore ONLY punctuation, capital letters, accents and words clearly mis-heard by the microphone (a sound-alike word that makes no sense there); everything else (grammar AND vocabulary) is checked strictly. Repeated consecutive words (e.g. "el clima el clima") are microphone glitches, and hesitations like "eh", "em", "este", "pues", "um" are normal in speech: always ignore them.
If a word makes no sense but sounds like the right word (e.g. "mi tía ha ido bien" when they meant "mi día"), that is PRONUNCIATION, not grammar: reply as if they had said the right word and use the 🗣️ line.
LETTERS, ACRONYMS, NUMBERS AND SIZES said aloud (e.g. "ex el", "doble ex", "ese eme") are transcription glitches: NEVER correct them as grammar. Understand what ${N} meant (e.g. "ex el" = XL) and teach how to say it in ${L} in a 🗣️ line, with the explanation in ${EX} (e.g. for Spanish: XL = "equis ele").
IF ${N} CORRECTS A PIECE OF INFORMATION (e.g. "no, es XXL", "no, quise decir el martes"): accept the new information naturally and carry on. Do NOT say "${tgt('correct')}" and do NOT correct that clarification.
WHOLE SENTENCE IN THE NATIVE LANGUAGE: if ${N} says a whole sentence in ${NI.short}, that is NOT a mistake: do not use 📝 or ✅. Reply only with one line starting with 💬 that says that sentence in ${L}, simple and at ${N}'s level. E.g.: 💬 ${tgt('sayEx')}
WHAT TO CORRECT: only FORM — grammar, conjugation, agreement, pronouns, prepositions, false friends, words in ${NI.short}, words that do not exist in ${L} or a ${L} word with a different meaning from the one ${N} wants. NEVER change the meaning of what ${N} said and never add information.
EVERY MESSAGE WITH A REAL MISTAKE GETS A 📝 LINE. Check every message word by word, also long ones. If there are several mistakes, choose the most important for the 📝 line, in this order of priority: 1) false friends, 2) words in ${NI.short} or that do not exist in ${L}, 3) conjugation and agreement, 4) pronouns (missing object or reflexive pronoun), 5) prepositions. Silently rephrasing the sentence correctly in your reply or in the ✅ line WITHOUT a 📝 line is NOT a correction and is forbidden: if your ✅ sentence differs from what ${N} said, there MUST be a 📝 line.
EXTRA MISTAKES: if the same message has more real mistakes, add up to 2 more lines starting with ➕, in the same format as 📝 (➕ wrong part → right part · short explanation in ${EX}). They are not shown in the conversation: they are only saved in ${N}'s notebook to review later.
ACCURACY: explanations of vocabulary, meaning and culture must be TRUE. Never invent a meaning or claim that a word is used in some country when you are not sure (e.g. "mole" is NOT a word for "blando" in any Spanish-speaking country). If you are not sure, say so honestly in one short line in ${EX} instead of inventing.
CONJUGATION AND IMPERATIVE: ALWAYS correct conjugation and imperative mistakes, even when the meaning is clear and even in the FIRST message of the conversation (e.g. "me cuenten más" said to you → "cuéntame más"; "me explico primero los documentos" → "explícame primero los documentos"). Do not let them pass just because they are understandable.
WHAT NOT TO CORRECT: correct sentences, sentences acceptable in normal use, or mere style alternatives. Never repeat the sentence if it is correct. A grammar or vocabulary mistake is NEVER a "doubt": if a native speaker would not say it that way, it is a mistake and gets a 📝 line.
ONE CORRECTION AT A TIME: if there are several mistakes, the 📝 line shows ONLY the most important one; the others get only ➕ lines (at most 2), and they all appear corrected in the ✅ sentence.
MAKE ${N} TALK MORE: the goal is for ${N} to talk a lot and you little. Ask OPEN questions that require full sentences (why, how, what would you do, tell me about…). AVOID choice questions ("A or B?") and yes/no questions. After an open question, do NOT add answer options (no "is it because of A, B or C?"): the question ends there. If ${N} answers with only 1 to 3 words, now and then (not always) kindly ask, in ${L}, for a full sentence (e.g. in Spanish: "¿Me lo cuentas con una frase completa?").
CONFUSING SENTENCE: only if the microphone made the sentence impossible to understand (never because of grammar or vocabulary mistakes, which you correct), do NOT guess or correct: reply only, in ${L}, "${tgt('again')}", with no 📝, 🗣️ or ✅ lines.
FORMAT:
- First, a natural, warm reply in ${L}: at most 2 short sentences, followed by ONE open question.
- BEFORE REPLYING, check the grammar of YOUR OWN sentences: tenses, agreement, prepositions. E.g. in Spanish "¿qué necesitas hacer la última vez que fuiste?" is WRONG; the right form is "¿qué necesitaste hacer la última vez que fuiste?". You are ${N}'s model: your sentences must be 100% correct.
- If there is a real mistake (in EVERY message that has one), add at the end ONE SINGLE 📝 line (never more than one), then the ➕ lines if any. The left side of → is EXACTLY the part ${N} said, copied without any change; the right side is the REAL correction, IDENTICAL to the matching part of the ✅ sentence (e.g. ✅ "Tengo muchas dudas" → 📝 tengo muchos gerais → tengo muchas dudas; NEVER "tengo muchos Gerais → tengo muchos gerais"). Both sides must really differ, not only in capitals, accents or punctuation; if that is the only difference, there is no mistake and no 📝 line. If the word came out strange because of the microphone, use the 🗣️ line, not 📝. The explanation after · has at most 10 words and MUST be in ${EX}, never in ${L}. Example:
📝 yo desenfoví → yo desarrollé · ${NI.exFix}
- If there is no grammar mistake but the microphone heard a similar word (pronunciation), add a line, also in ${EX}:
🗣️ ${NI.exPron}
- If there is a 📝 line, then add:
✅ ${N}'s sentence 100% correct in ${L}, with ALL mistakes corrected (including those not in the 📝 line), without changing the meaning or adding information. E.g. "vivo en la ciudad de España, me gusta saber más" → ✅ Vivo en una ciudad de España, me gustaría saber más.
- No mistakes: no 📝, 🗣️ or ✅ lines.
WHEN THERE IS A MISTAKE: after correcting, do NOT continue the topic; the conversation continues after the repetition.
NEVER invent corrections: if a word seems mis-transcribed by the microphone (e.g. "Botía", "lo tomo" instead of "otoño"), do NOT correct it as grammar; at most use a 🗣️ line. Correct alternatives (e.g. "visto que", "ya que", "como") are NOT mistakes.
${typical ? `Watch for real mistakes that ${NI.short} speakers often make in ${L}: ${typical}.\n` : ''}IF ${N} ASKS FOR HELP WITH A WORD OR PRONUNCIATION (e.g. "corrígeme la palabra desarrollar"): do a mini drill. Say the word slowly, split into syllables (e.g. "de-sa-rro-llar"), give a short tip in ${EX} in a 🗣️ line, and ask them to repeat it.
${memory}${repeatTarget ? `REPETITION MODE: you asked ${N} to repeat ONLY this corrected sentence: "${repeatTarget}".
- Evaluate ONLY that sentence and only the main correction (from the previous 📝 line), with no new 📝, ➕ or ✅ lines. Ignore the rest of the sentence, punctuation, hesitations and similar-sounding microphone glitches (e.g. "lo tomo" ≈ "otoño").
- If it is right or almost right: start with "${tgt('correct')}", resume the conversation with ONE open question, and put on a separate last line: 🎯 OK
- If the corrected mistake is still the same: in simple ${L}, say in one short sentence what is still missing, repeat the right sentence slowly, and put on a separate last line: 🎯 DE NOVO. Never call a wrong answer "almost right", "on the right track" or "OK": say clearly what is missing.
- If ${N} asks a question or says they did not understand (in any language): explain in ONE short sentence in ${EX}, on a line starting with [nat] (so the app uses the right voice), then repeat the right sentence ("${repeatTarget}") and ask them to repeat it; put on a separate last line: 🎯 PERGUNTA
- If ${N}, instead of repeating, corrects a piece of information (e.g. "no, es XXL"): accept it, do NOT say "${tgt('correct')}", do not correct, continue the conversation with ONE question and put on a separate last line: 🎯 ESCLARECIMENTO` : ''}
Conversation topic: "${currentTopic}"`;
}

// Instruções da IA no modo 🌱 Do zero (lição currentLesson).
function buildLessonSystem() {
  const P = PROFILE || { name: 'the learner', levels: {} };
  const NI = NATIVES[getNative(P)];
  const N = P.name, EX = NI.expl, L = currentLangName, i = currentLesson;
  const items = lessonItems(i), steps = lessonSteps(items.length);
  const st = lessonState || { pos: 0, tries: 0 };
  const step = steps[Math.min(st.pos, steps.length - 1)], ex = lzExpected(step, items);
  const list = items.map((x, k) => (k + 1) + '. «' + x.t + '» = ' + x.g).join('\n');
  const first = s => String(s).split(/\.\s/)[0].replace(/[.!]+$/, '');
  let task;
  if (st.tries) task = `After a mistake, ${N} was asked to repeat «${ex.t}». Judge if ${N} said it.`;
  else if (step.k === 'teach') task = `${N} was asked to repeat the new phrase «${ex.t}». Judge if ${N} said it.`;
  else if (step.k === 'recall') task = `${N} was asked, in ${EX}, how to say "${ex.g}" in ${L}. Expected answer: «${ex.t}». A different but correct and natural ${L} way to say the same thing in that situation is also correct (e.g. in French «Bonjour» is correct to greet someone in the afternoon).`;
  else { const tn = lzTurn(items, step.i); task = `Short conversation: Lia said «${tn.lia.t}» (${tn.lia.g}). ${N} must reply with a fitting lesson phrase (e.g. «${tn.ans.t}»). Any fitting, correct reply made with the lesson phrases is correct.`; }
  const lastUser = (chatHistory.filter(m => m.role === 'user').pop() || {}).content || '';
  const looksQ = step.k !== 'chat' && lzLooksQuestion(lastUser, ex.t);
  return `You evaluate ONE answer of ${N}, ${NI.speaker}, an absolute beginner in a ${L} lesson. You do NOT talk to ${N}: the app writes everything ${N} sees. ${accentRule(P)}
LESSON PHRASES:
${list}
("…" = ${N} completes it with their own information: accept any sensible completion. "A / B" = both forms are right.)
TASK: ${task}
${looksQ ? `ATTENTION: the message looks like a QUESTION or a request for explanation, maybe badly transcribed by the microphone (e.g. "qu'est-ce qui ne fait que très bien" = "what does «très bien» mean?"): result "question".\n` : ''}The message comes from SPEECH RECOGNITION: ignore capitals, accents, punctuation, apostrophes and similar-sounding glitches; never mention them.
Reply ONLY with this JSON, nothing before or after:
{"result": "correct" | "wrong" | "question" | "unclear", "feedback": "…"}
- "correct": the answer is right. feedback: "" or at most ONE short useful usage tip (when or with whom to use it), or, for a correct alternative, the difference in one short sentence.
- "wrong": a real mistake (wrong or missing word, wrong phrase). feedback: ONE short sentence saying what was wrong or missing (e.g. "${first(NI.exWrong)}"), without the full right answer.
- "question": ${N} asks a question or asks for an explanation, in any language (e.g. "o que significa…?", "¿qué quiere decir…?", "c'est quoi… ?", "what does … mean?", "não entendi"). feedback: a short answer to the question.
- "unclear": the message makes no sense, is garbled, repeats Lia's question or answers something else. feedback: ONE short sentence saying what happened (e.g. "${first(NI.exOff)}").
feedback: ONE sentence, in ${EX} ONLY (${NI.variant})${NI.group !== 'en' ? ', NEVER in English' : ''}. Never talk about progress, phases, attempts or the end of the lesson; never give instructions such as "repeat after me"; never write notes about ${N} in the third person.`;
}

// ── Tutora ocupada: microfone e envio de texto bloqueados enquanto pensa (chamada à IA) ou fala ──
let aiBusy = 0;
function isBusy() { return aiBusy > 0 || isSpeaking; }
async function busyAI(messages, system) {
  aiBusy++; updateBusyUI();
  try { return await callAI(messages, system); }
  finally { aiBusy--; updateBusyUI(); }
}
function updateBusyUI() {
  const busy = isBusy() && !isRecording;
  const btn = document.getElementById('mic-btn'), lab = document.getElementById('mic-label'), send = document.getElementById('send-btn');
  if (btn) btn.classList.toggle('busy', busy);
  if (send) send.disabled = busy;

}

// Chamada à IA. Erros com mensagem clara na língua do aluno: sem internet, demora (45 s) ou resposta inválida.
const AI_TIMEOUT_MS = 45000;
async function callAI(messages, system) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), AI_TIMEOUT_MS) : null;
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: 1024, thinking: { type: 'disabled' }, system, messages }),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch(e) {
    throw new Error(e && e.name === 'AbortError' ? t('ai_timeout') : t('no_connection'));
  } finally {
    if (timer) clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); } catch(e) { throw new Error(t('empty_reply') + ' (HTTP ' + res.status + ')'); }
  if (data.error) throw new Error(data.error.message);
  const text = (data.content || []).filter(b => b.type === 'text' && b.text).map(b => b.text).join('\n').trim();
  if (!text) throw new Error(t('empty_reply') + (data.stop_reason ? ' (' + data.stop_reason + ')' : ''));
  return text;
}

let lastUserDiv = null;
function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// spoken: o texto que a tutora falou (o botão 🔊 repete-o); por omissão, o próprio texto.
// saveText: o que o ⭐ guarda no caderno (ex.: a frase ✅); se a aluna selecionar um trecho da mensagem, guarda o trecho.
// hint: resposta escondida no botão "💡 Dica" (passo LEMBRAR das lições).
// No modo Do zero, cada mensagem entra no registo da lição (lessonLog) para "Continuar lição" a poder repor.
function addMsg(role, text, correction, correctionFirst, spoken, saveText, hint) {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const clean = role === 'tutor' ? stripTags(text) : text; // sem as marcas [nat]/[alvo]

  const label = `<div class="label">${role === 'tutor' ? esc(t('lbl_tutor')) : userLabelHtml()}</div>`;
  const bubble = `<div class="bubble">${role === 'tutor' ? renderTagged(text) : esc(text).replace(/\n/g,'<br>')}</div>`;
  const corr = correction ? `<div class="correction">${correction.replace(/\n/g,'<br>')}</div>` : '';
  div.innerHTML = correctionFirst ? label + corr + bubble : label + bubble + corr;
  if (role === 'tutor') {
    const tools = document.createElement('div');
    tools.className = 'msg-tools';
    const bListen = document.createElement('button');
    bListen.textContent = '🔊'; bListen.title = t('btn_listen_again');
    bListen.onclick = () => speakToggle(spoken || text);
    const bTr = document.createElement('button');
    bTr.textContent = '🌐'; bTr.title = t('btn_translate');
    bTr.onclick = () => toggleTranslation(div, clean);
    const bStar = document.createElement('button');
    bStar.textContent = '⭐'; bStar.title = t('btn_save');
    let picked = '';
    // Lê a seleção antes do toque no botão (no telemóvel o toque pode apagá-la).
    bStar.addEventListener('pointerdown', () => { picked = selectionIn(div); });
    bStar.onclick = () => {
      const txt = stripTags(picked || selectionIn(div) || saveText || clean).replace(/🔁/g, '').replace(/\s+/g, ' ').trim();
      picked = '';
      if (!txt) return;
      nbAdd({ type: 'salva', text: txt });
      bStar.textContent = t('saved');
      setTimeout(() => { bStar.textContent = '⭐'; }, 1500);
    };
    tools.append(bListen, bTr, bStar);
    if (hint) {
      const bHint = document.createElement('button');
      bHint.textContent = t('hint_label');
      const hd = document.createElement('div');
      hd.className = 'msg-hint hide'; hd.textContent = '💡 ' + hint;

    }

    lessonLog.push({ role, text, correction: correction || '', correctionFirst: !!correctionFirst, spoken: spoken || '', saveText: saveText || '', hint: hint || '' });
    div.dataset.log = lessonLog.length - 1;

}

// Balão da tutora: linhas [nat] em itálico (língua nativa), linhas [alvo] normais; as marcas não aparecem.
function renderTagged(text) {
  return String(text || '').split('\n').map(line => {
    const m = line.match(VOICE_TAG);
    const s = line.replace(VOICE_TAG, '').replace(/\[(nat|alvo)\]\s*/gi, '');
    return m && m[1].toLowerCase() === 'nat' ? `<span class="ln-nat">${esc(s)}</span>` : esc(s);
  }).join('<br>');
}

// Destaca em vermelho, no balão "TU", o trecho errado (lado esquerdo do 📝), ignorando maiúsculas, acentos e pontuação.
function highlightError(div, left) {
  if (!div || !left) return;
  const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  const lw = left.split(/\s+/).map(norm).filter(Boolean);
  if (!lw.length) return;
  const parts = (div.dataset.text || '').split(/(\s+)/);
  const widx = parts.map((p, i) => (i % 2 === 0 && norm(p)) ? i : -1).filter(i => i >= 0);
  const wn = widx.map(i => norm(parts[i]));
  let s = -1;
  for (let i = 0; i + lw.length <= wn.length; i++) if (lw.every((w, j) => wn[i + j] === w)) { s = i; break; }
  if (s < 0) return;
  const a = widx[s], b = widx[s + lw.length - 1];
  const html = parts.map((p, i) => (i === a ? '<mark class="err">' : '') + esc(p) + (i === b ? '</mark>' : '')).join('');
  const bubble = div.querySelector('.bubble');
  if (bubble) bubble.innerHTML = html;
  // Guarda o destaque no registo da lição (para repor ao continuar).
  if (div.dataset.log && !restoringLesson && lessonLog[+div.dataset.log]) { lessonLog[+div.dataset.log].hl = left; saveLessonSession(); }
}

// localStorage 'tutora_caderno' = { es: [itens], en: [...], ... }, mais recentes primeiro, máx. 300 por idioma.
// Item: { id, type: 'erro' | 'salva', date, wrong, right, why } ou { id, type: 'salva', date, text }.
const NB_KEY = 'tutora_caderno', NB_MAX = 300;
let nbCurrentTab = 'erro';

function nbLoad() {
  try { const nb = JSON.parse(localStorage.getItem(NB_KEY) || '{}'); return nb && typeof nb === 'object' ? nb : {}; } catch(e) { return {}; }
}
function nbStore(nb) { try { localStorage.setItem(NB_KEY, JSON.stringify(nb)); } catch(e) {} }
function nbList() { const l = nbLoad()[currentLang]; return Array.isArray(l) ? l : []; }

function nbAdd(item) {
  const nb = nbLoad();
  const list = Array.isArray(nb[currentLang]) ? nb[currentLang] : [];
  list.unshift(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: new Date().toISOString() }, item));
  nb[currentLang] = list.slice(0, NB_MAX); // apaga os mais antigos
  nbStore(nb);
  if (currentView === 'notebook') renderNotebook();
}

function nbDelete(id) {
  const nb = nbLoad();
  nb[currentLang] = nbList().filter(i => i.id !== id);
  nbStore(nb);
  renderNotebook();
}

// Os erros que a aluna mais repete: agrupa por "errado → certo" (sem maiúsculas, acentos nem pontuação).
function topErrors(n) {
  const key = t => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const groups = new Map();
  nbList().forEach((it, idx) => {
    if (it.type !== 'erro') return;
    const k = key(it.wrong) + '→' + key(it.right);
    const g = groups.get(k);
    if (g) g.count++; else groups.set(k, { wrong: it.wrong, right: it.right, why: it.why, count: 1, order: idx });
  });
  return [...groups.values()].sort((a, b) => b.count - a.count || a.order - b.order).slice(0, n || 5);
}

function nbTab(tab) { nbCurrentTab = tab; renderNotebook(); }

function renderNotebook() {

  const box = document.getElementById('nb-list');
  box.innerHTML = '';

      ? `<div class="nb-empty">${t('nb_empty_errors')}</div>`
      : `<div class="nb-empty">${t('nb_empty_saved')}</div>`;
    return;
  }
  const loc = nativeInfo().date;
  const mk = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; return d; };
  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'nb-item';
    const body = document.createElement('div'); body.className = 'nb-body';
    if (it.type === 'erro') {
      const line = document.createElement('div');

      const r = document.createElement('span'); r.className = 'nb-right'; r.textContent = it.right;
      line.append(w, ' → ', r);
      body.appendChild(line);
      if (it.why) body.appendChild(mk('nb-why', it.why));
    } else {
      body.appendChild(mk('', it.text));
    }
    let dateTxt = '';
    try { dateTxt = new Date(it.date).toLocaleDateString(loc, { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch(e) {}
    body.appendChild(mk('nb-date', dateTxt));
    const act = document.createElement('div'); act.className = 'nb-actions';
    const bS = document.createElement('button'); bS.textContent = '🔊'; bS.title = t('listen');
    bS.onclick = () => speakToggle(it.type === 'erro' ? it.right : it.text);
    const bD = document.createElement('button'); bD.textContent = '🗑️'; bD.title = t('delete');
    bD.onclick = () => nbDelete(it.id);
    act.append(bS, bD);
    row.append(body, act);
    box.appendChild(row);
  });
}

// ── 🔥 RACHA ──
// localStorage 'tutora_racha' = { days: { 'AAAA-MM-DD': nº de falas enviadas nesse dia } }.
// Um dia conta como praticado com pelo menos 5 falas; a racha são os dias seguidos até hoje (ou até ontem, se hoje ainda não completou).
const STREAK_KEY = 'tutora_racha', STREAK_GOAL = 5;
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function streakLoad() {
  try { const s = JSON.parse(localStorage.getItem(STREAK_KEY) || 'null'); return s && s.days && typeof s.days === 'object' ? s : { days: {} }; } catch(e) { return { days: {} }; }
}
function streakStore(s) { try { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch(e) {} }

function streakStats() {
  const s = streakLoad(), today = new Date(), tk = dayKey(today);
  const done = k => (s.days[k] || 0) >= STREAK_GOAL;
  let cur = 0, d = done(tk) ? today : addDays(today, -1);
  while (done(dayKey(d))) { cur++; d = addDays(d, -1); }
  const doneDays = Object.keys(s.days).filter(done).sort();
  let best = 0, run = 0, prev = '';
  doneDays.forEach(k => {
    run = prev && dayKey(addDays(new Date(prev + 'T12:00:00'), 1)) === k ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  });
  const mon = addDays(today, -((today.getDay() + 6) % 7)); // semana de segunda a domingo
  const week = t('week').split(',').map((label, i) => {
    const k = dayKey(addDays(mon, i));
    return { label, done: done(k), today: k === tk };
  });
  return { cur, best: Math.max(best, cur), total: doneDays.length, todayCount: s.days[tk] || 0, todayDone: done(tk), week };
}

function weekHtml(week) {
  return '<div class="week-row">' + week.map(w =>
    `<div class="week-day"><div class="week-dot${w.done ? ' done' : ''}${w.today ? ' today' : ''}">${w.done ? '🔥' : ''}</div>${w.label}</div>`
  ).join('') + '</div>';
}

// Chamada a cada fala enviada; na 5.ª fala do dia, celebra.
function countPractice() {
  const s = streakLoad(), k = dayKey();
  s.days[k] = (s.days[k] || 0) + 1;
  streakStore(s);
  updateStreakBadge();
  if (s.days[k] === STREAK_GOAL) celebrate();
}

function updateStreakBadge() {
  const st = streakStats(), b = document.getElementById('streak-badge');
  if (!b) return;
  b.textContent = '🔥 ' + st.cur;
  b.classList.toggle('off', !st.todayDone);
  b.title = st.todayDone ? t('badge_done', { n: st.cur }) : t('badge_left', { n: st.todayCount, g: STREAK_GOAL });
}

let celebrateTimer = null;
function celebrate() {
  const st = streakStats();
  const phrase = tgt('great');
  document.getElementById('cel-card').innerHTML =
    `<div class="cel-flame">🔥</div><div class="cel-title">${phrase}</div>` +
    `<div class="cel-sub">${esc(st.cur === 1 ? t('day_one') : t('day_many', { n: st.cur }))}</div>` + weekHtml(st.week);
  document.getElementById('celebrate').classList.add('show');
  clearTimeout(celebrateTimer);
  celebrateTimer = setTimeout(hideCelebrate, 4000);
}
function hideCelebrate() { clearTimeout(celebrateTimer); document.getElementById('celebrate').classList.remove('show'); }

function renderStreakStats() {
  const st = streakStats(), el = document.getElementById('pf-streak');
  if (!el) return;
  el.innerHTML = `<div class="streak-grid">
      <div><div class="streak-num">🔥 ${st.cur}</div><div class="streak-lbl">${esc(t('st_current'))}</div></div>
      <div><div class="streak-num">${st.best}</div><div class="streak-lbl">${esc(t('st_best'))}</div></div>
      <div><div class="streak-num">${st.total}</div><div class="streak-lbl">${esc(t('st_total'))}</div></div>
    </div>${weekHtml(st.week)}
    <div class="streak-today">${esc(st.todayDone ? t('today_done') : t('today_left', { n: st.todayCount, g: STREAK_GOAL }))}</div>`;
}

    const out = await busyAI([{ role: 'user', content: 'Create the test questions.' }], system);
    removeLoading();
    if (currentTest !== test) return; // a aluna saiu do teste entretanto
    const j = parseJsonReply(out);
    const qs = j && Array.isArray(j.perguntas) ? j.perguntas.filter(s => typeof s === 'string' && s.trim()).map(s => s.trim()).slice(0, TEST_TOTAL) : [];
    if (qs.length < 6) throw new Error(t('test_fail'));
    test.q = qs;
    askTestQuestion();
  } catch(e) {
    removeLoading();
    if (currentTest !== test) return;
    exitTest();
    setStatus('error', t('st_error') + (e && e.message ? e.message : t('no_connection')));
  }
}
function askTestQuestion() {
  const q = currentTest.q[currentTest.idx];
  updateLessonBanner();
  addMsg('tutor', q);
  speak(q);
}
// Resposta da aluna a uma pergunta do teste (sem correção nem chamada à IA).
function handleTestAnswer(text) {
  const test = currentTest;
  if (!test || test.finished || !test.q.length) return;
  test.a[test.idx] = text;
  test.idx++;
  if (test.idx < test.q.length) setTimeout(() => { if (currentTest === test) askTestQuestion(); }, 300);
  else finishTest();
}
function skipTestQuestion() {
  if (!currentTest || currentTest.finished || !currentTest.q.length) return;
  synth.cancel();
  addMsg('user', '🤷 ' + t('test_skip_said'));
  handleTestAnswer('(no answer)');
}
async function finishTest() {
  const test = currentTest;
  test.finished = true;
  setTestUI(false);
  document.getElementById('hint-btn').style.display = 'none';
  updateLessonBanner();
  setStatus('gold', t('st_processing'));
  addLoadingMsg();
  const P = PROFILE, NI = NATIVES[getNative(P)], EX = NI.expl, lang = currentLang;
  const system = `${langRule(NI)}
You are a ${currentLangName} examiner. Assess the spoken level of ${P.name} (${NI.speaker}) from the answers to a ${TEST_TOTAL}-question test of increasing difficulty. The answers come from speech recognition: ignore punctuation, capitals, accents and microphone glitches. "(no answer)" = they did not answer. ${accentRule(P)}
Levels: "iniciante" (does not answer or only isolated words), "básico" (simple present-tense sentences), "intermediário" (uses past and future with some mistakes, explains opinions), "avançado" (uses hypotheses and complex structures with few mistakes).
Reply ONLY with JSON: {"nivel": "iniciante|básico|intermediário|avançado", "explicacao": "one short sentence in ${EX}", "fortes": ["…", "…"], "melhorar": ["…", "…"]}. The texts go in ${EX} (${NI.variant}), at most 12 words each; "fortes" and "melhorar" have exactly 2 items. Keep the JSON keys and the level values exactly as shown.`;
  const qa = test.q.map((q, i) => `${i + 1}. ${q}\nAnswer: ${test.a[i] || '(no answer)'}`).join('\n\n');
  try {
    const out = await busyAI([{ role: 'user', content: qa }], system);
    removeLoading();
    if (currentTest !== test) return;
    const j = parseJsonReply(out) || {};
    const level = normLevel(j.nivel);
    if (!level) throw new Error(t('test_eval_fail'));
    const list = v => (Array.isArray(v) ? v : []).filter(s => typeof s === 'string' && s.trim()).map(s => s.trim()).slice(0, 2);
    const result = { date: new Date().toISOString(), level, explanation: String(j.explicacao || '').trim(), strengths: list(j.fortes), improve: list(j.melhorar) };
    const all = testLoad(); all[lang] = result; testStore(all);
    test.done = true;
    updateLessonBanner();
    showTestResult(result);
  } catch(e) {
    removeLoading();
    if (currentTest !== test) return;
    exitTest();
    setStatus('error', t('st_error') + (e && e.message ? e.message : t('no_connection')));
  }
}
function showTestResult(r) {
  const li = arr => arr.map(s => `<li>${esc(s)}</li>`).join('');
  const html = `<div class="test-card"><div class="lvl-title">${esc(t('test_result_title', { level: t('lvl_' + r.level) }))}</div>` +
    (r.strengths.length ? `<div class="sec">${esc(t('test_strong'))}</div><ul>${li(r.strengths)}</ul>` : '') +
    (r.improve.length ? `<div class="sec">${esc(t('test_improve'))}</div><ul>${li(r.improve)}</ul>` : '') +
    `<div class="sec">${esc(t('test_recommend'))}</div><div class="rec"></div></div>`;
  const div = addMsg('tutor', '[nat] ' + (r.explanation || t('test_result_title', { level: t('lvl_' + r.level) })), html, true);
  // Recomendação: iniciante/básico → próxima lição do Do zero; senão → Conversar.
  const next = nextLessonIdx(zeroLang().done);
  const lessonFirst = (r.level === 'iniciante' || r.level === 'básico') && next >= 0;
  const rec = div.querySelector('.rec');
  const bLesson = document.createElement('button');
  if (next >= 0) {
    bLesson.textContent = t('test_rec_lesson', { n: next + 1, title: lessonUI(next)[0] });
    bLesson.onclick = () => { exitTest(); startLesson(next); };
  }
  const bChat = document.createElement('button');
  bChat.textContent = t('test_rec_chat');
  bChat.onclick = () => { exitTest(); const free = document.querySelectorAll('.topic-pill')[1]; setTopic(free, 'Free conversation'); };
  (lessonFirst ? bLesson : bChat).classList.add('primary');
  if (lessonFirst) rec.append(bLesson, bChat); else { rec.append(bChat); if (next >= 0) rec.append(bLesson); }
  setStatus('ready', t('st_ready'));
  renderHome();
  // Atualiza o nível do idioma no perfil, com confirmação.
  const cur = (PROFILE.levels || {})[currentLang] || DEFAULT_LEVELS[currentLang];
  if (r.level !== cur) {
    setTimeout(() => {
      if (confirm(t('test_confirm', { lang: langUI(currentLang), level: t('lvl_' + r.level) }))) {
        PROFILE.levels = Object.assign({}, DEFAULT_LEVELS, PROFILE.levels || {}, { [currentLang]: r.level });
        try { localStorage.setItem('tutora_profile', JSON.stringify(PROFILE)); } catch(e) {}
      }
    }, 600);
  }
}
function exitTest() {
  if (currentTest === null) return;
  currentTest = null;
  setTestUI(false);
  if (topicElBeforeLesson && currentLesson === null) topicElBeforeLesson.classList.add('active');
  updateLessonBanner();
}
function renderTestsSummary() {
  const box = document.getElementById('pf-tests'), all = testLoad();
  const rows = visibleLangs().filter(l => all[l.code] && normLevel(all[l.code].level));
  if (!rows.length) { box.innerHTML = `<div class="none">${esc(t('pf_tests_none'))}</div>`; return; }
  box.innerHTML = rows.map(l => {
    const r = all[l.code];
    let d = '';
    try { d = new Date(r.date).toLocaleDateString(nativeInfo().date); } catch(e) {}
    return `<div>${langFlag(l.code)} ${esc(langUI(l.code))}: <span class="lvl">${esc(t('lvl_' + normLevel(r.level)))}</span> <span class="when">· ${esc(d)}</span></div>`;
  }).join('');
}

// ── 📷 FOTO DO PERFIL ──
// localStorage 'tutora_foto' = data URL JPEG, reduzida para caber em 256×256.
const PHOTO_KEY = 'tutora_foto', PHOTO_MAX = 256;
function loadPhoto() { try { return localStorage.getItem(PHOTO_KEY) || ''; } catch(e) { return ''; } }
function handlePhoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, PHOTO_MAX / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    try { localStorage.setItem(PHOTO_KEY, c.toDataURL('image/jpeg', 0.85)); }
    catch(e) { alert(t('photo_save_fail')); return; }
    renderPhotos();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert(t('photo_fail')); };
  img.src = url;
}
function removePhoto() {
  try { localStorage.removeItem(PHOTO_KEY); } catch(e) {}
  renderPhotos();
}
// Mostra a foto (ou 👤) no perfil, no Início e nas falas já escritas.
function renderPhotos() {
  const p = loadPhoto();
  ['pf-photo', 'home-photo'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = '';
    if (p) { const img = document.createElement('img'); img.src = p; img.alt = ''; el.appendChild(img); }
    else el.textContent = '👤';
  });
  document.getElementById('photo-remove').style.display = p ? '' : 'none';
  document.querySelectorAll('.msg.user .label').forEach(l => { l.innerHTML = userLabelHtml(); });
}
function userLabelHtml() {
  const p = loadPhoto(), name = t('lbl_you').replace(/^🎤\s*/u, '');
  return p ? `<img class="lbl-photo" src="${p}" alt="">${esc(name)}` : esc(t('lbl_you'));
}

// ── CÓPIA DE SEGURANÇA ──
// Exporta perfil + caderno (todos os idiomas) + racha num .json. A chave API NUNCA entra no arquivo.
function exportData() {
  const data = { app: 'tutora-voz', version: 3, exportedAt: new Date().toISOString(), profile: loadProfile(), foto: loadPhoto() || null, caderno: nbLoad(), racha: streakLoad(), zero: zeroLoad(), teste: testLoad() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `parlia-dados-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importData(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try { data = JSON.parse(reader.result); } catch(e) {}
    if (!data || data.app !== 'tutora-voz') { alert(t('import_invalid')); return; }
    const caderno = {};
    Object.keys(data.caderno && typeof data.caderno === 'object' ? data.caderno : {}).forEach(lang => {
      const l = data.caderno[lang];
      if (Array.isArray(l)) caderno[lang] = l.filter(i => i && typeof i === 'object' && i.type).slice(0, NB_MAX);
    });
    const racha = data.racha && data.racha.days && typeof data.racha.days === 'object' ? { days: data.racha.days } : { days: {} };
    const nItems = Object.values(caderno).reduce((n, l) => n + l.length, 0);
    let when = '';
    try { when = new Date(data.exportedAt).toLocaleDateString(nativeInfo().date); } catch(e) {}
    const nDays = Object.keys(racha.days).length;
    // Progresso do Do zero (cópias antigas, sem "zero", mantêm o progresso atual).
    const hasZero = !!(data.zero && typeof data.zero === 'object');
    const zero = {};
    Object.keys(hasZero ? data.zero : {}).forEach(lang => {
      const e = data.zero[lang];
      if (e && typeof e === 'object') zero[lang] = { done: Array.isArray(e.done) ? e.done.filter(n => Number.isInteger(n) && n >= 0 && n < ZERO_TOTAL) : [], seen: !!e.seen, current: Number.isInteger(e.current) && e.current >= 0 && e.current < ZERO_TOTAL ? e.current : null };
    });
    const nLessons = Object.values(zero).reduce((n, e) => n + e.done.length, 0);
    const ok = confirm(t('import_confirm', {
      lessons: hasZero ? t('lessons_n', { n: nLessons }) : '—',
      when: when ? t('import_when', { date: when }) : '',
      name: data.profile && data.profile.name ? ' (' + data.profile.name + ')' : '',
      items: nItems === 1 ? t('item_one') : t('item_many', { n: nItems }),
      days: nDays === 1 ? t('dayp_one') : t('dayp_many', { n: nDays })
    }));
    if (!ok) return;
    try {
      if (data.profile && data.profile.name) localStorage.setItem('tutora_profile', JSON.stringify(data.profile));
      localStorage.setItem(NB_KEY, JSON.stringify(caderno));
      localStorage.setItem(STREAK_KEY, JSON.stringify(racha));
      if (hasZero) localStorage.setItem(ZERO_KEY, JSON.stringify(zero));
      // Teste de nível: só substitui se a cópia o trouxer.
      if (data.teste && typeof data.teste === 'object') {
        const tst = {};
        Object.keys(data.teste).forEach(lang => {
          const r = data.teste[lang], lv = r && normLevel(r.level);
          const strs = v => (Array.isArray(v) ? v : []).filter(s => typeof s === 'string').slice(0, 2);
          if (lv) tst[lang] = { date: String(r.date || ''), level: lv, explanation: String(r.explanation || ''), strengths: strs(r.strengths), improve: strs(r.improve) };
        });
        localStorage.setItem(TEST_KEY, JSON.stringify(tst));
      }
      // Foto: só substitui se a cópia trouxer uma imagem válida.
      if (typeof data.foto === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data.foto)) localStorage.setItem(PHOTO_KEY, data.foto);
    } catch(e) { alert(t('import_save_fail') + (e && e.message ? e.message : e)); return; }
    PROFILE = loadProfile() || PROFILE;
    // Recomeça a conversa com os dados importados (outra língua, outros níveis…).
    chatHistory = []; repeatTarget = ''; repeatTries = 0; clearTranscript();
    init();
    fillProfileForm();      // mostra os dados importados nos campos do perfil
    updateStreakBadge();
    alert(t('import_ok'));
  };
  reader.onerror = () => alert(t('read_fail'));
  reader.readAsText(file);
}

// Aviso curto, por cima da barra de navegação.
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

function hideSuggestions() {
  const box = document.getElementById('suggest-box');
  if (box) { box.classList.remove('show'); box.innerHTML = ''; }
}

function addLoadingMsg() {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg tutor'; div.id = 'loading-msg';
  div.innerHTML = `<div class="label">${esc(t('lbl_tutor'))}</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeLoading() { const el = document.getElementById('loading-msg'); if (el) el.remove(); }
function clearTranscript() { document.getElementById('transcript').innerHTML = ''; lastUserDiv = null; hideSuggestions(); }
function setStatus(type, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot';
  if (type === 'green') dot.classList.add('green');
  else if (type === 'gold') dot.classList.add('gold');
  else if (type === 'error') dot.classList.add('red');
  document.getElementById('status-text').textContent = text;
}
function toggleTextMode() { document.getElementById('text-row').classList.toggle('show'); }
