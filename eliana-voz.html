// ── SPEECH SYNTHESIS ──
// Marcas de voz no início das linhas: [nat] = língua nativa do aluno, [alvo] = idioma estudado (linha sem marca = idioma estudado).
const VOICE_TAG = /^\s*\[(nat|alvo)\]\s*/i;
function stripTags(text) { return String(text || '').split('\n').filter(l => !IMG_TAG.test(l) && !LBL_TAG.test(l) && !voiceOnly(l)).map(l => l.replace(VOICE_TAG, '').replace(EST_TAG, '').replace(VER_TAG, '')).join('\n').replace(/\[(nat|alvo)\]\s*/gi, ''); }
// Linha [img] = ilustração (emoji grande) das lições: só se mostra.
const IMG_TAG = /^\s*\[img\]\s*/i;
// Linha [est] = estrutura da lição dos Primeiros passos (caixa): só se mostra.
const EST_TAG = /^\s*\[est\]\s*/i;
// Linha [lbl] = rótulo (ex.: "Frase nova 3/5"): só se mostra.
const LBL_TAG = /^\s*\[lbl\]\s*/i;
const VER_TAG = /^\s*\[ver\]\s*/i;
const PAUSE_TAG = /^\s*\[pausa\]\s*$/i, SLOW_TAG = /^\s*\[devagar\]\s*/i, VOZ_TAG = /^\s*\[voz\]\s*/i;
function voiceOnly(line) { return PAUSE_TAG.test(line) || SLOW_TAG.test(line) || VOZ_TAG.test(line); }
// Variantes de uma frase ("A / B" ou "A /= B" = forma de homem / forma de mulher; "/=" = mesma pronúncia).
function lzForms(s) {
  s = String(s || ''); const same = s.includes(' /= ');
  const p = s.split(same ? ' /= ' : ' / ').map(x => x.trim());
  return p.length === 2 ? { a: p[0], b: p[1], same } : null;
}
// Para mostrar: "Enchanté ! (homem) · Enchantée ! (mulher) — mesma pronúncia".
function lzShow(s) { const v = lzForms(s); return v ? `${v.a} (${t('var_m')}) · ${v.b} (${t('var_f')})` + (v.same ? ` — ${t('var_same')}` : '') : String(s || ''); }
// Forma simples "A / B" (listas, instruções da IA, traduções).
function lzPlain(s) { return String(s || '').split(' /= ').join(' / '); }
// Linhas de uma frase no idioma estudado: mostrada com as variantes; dita uma vez se a pronúncia é igual,
// as duas com uma pausa se muda. slow = só a leitura lenta.
function lzAlvo(s, slow) {
  const v = lzForms(s);
  if (!v) return (slow ? '[devagar] ' : '[alvo] ') + s;
  const tag = slow ? '[devagar]' : '[voz]';
  return (slow ? '' : `[ver] ${lzShow(s)}\n`) + (v.same ? `${tag} ${v.a}` : `${tag} ${v.a}\n[pausa]\n${tag} ${v.b}`);
}
// Deixa curta falada nas perguntas de LEMBRAR e CRIAR.
function yourTurnCue() { return { fr: 'À toi !', es: '¡Te toca!', en: 'Your turn!', it: 'Tocca a te!', pt: ptIsPT() ? 'É a tua vez!' : 'Sua vez!' }[currentLang] || 'Your turn!'; }
// Barra de estado na vez da aluna (LEMBRAR, CRIAR e mini-conversa): "👉 Sua vez: responda em francês".
function lzYourTurnStatus() {
  if (currentLesson === null || !lessonState || lessonCompleted) return '';
  const st = lessonSteps(lessonItems(currentLesson).length)[lessonState.pos];
  return st && ['recall', 'create', 'chat'].includes(st.k) ? t('lz_your_turn', { lang: lzLangName() }) : '';
}
// Pedido curto falado no idioma estudado, para a vez da aluna.
function repShort() { return { fr: 'Répète !', es: '¡Repite!', en: 'Repeat!', it: 'Ripeti!', pt: ptIsPT() ? 'Repete!' : 'Repita!' }[currentLang] || 'Repeat!'; }
// Só as linhas [alvo] são lidas em voz alta; as [nat] só se o perfil tiver "Ler explicações em voz alta".
// As traduções entre parênteses ficam sempre só escritas.
function voiceParts(text) {
  const parts = [];
  const readNat = !!(PROFILE && PROFILE.readNative);
  String(text || '').split('\n').forEach(line => {
    if (IMG_TAG.test(line) || EST_TAG.test(line) || LBL_TAG.test(line) || VER_TAG.test(line)) return; // ilustração, estrutura, rótulo e texto só mostrado: não se leem
    if (PAUSE_TAG.test(line)) { parts.push({ who: 'pause', ms: 800 }); return; }
    if (SLOW_TAG.test(line) || VOZ_TAG.test(line)) { const s = line.replace(SLOW_TAG, '').replace(VOZ_TAG, '').replace(/[\p{Extended_Pictographic}\u200D\uFE0F\u20E3]/gu, '').trim(); if (s) parts.push({ who: 'alvo', text: s, slow: SLOW_TAG.test(line), solo: true }); return; }
    const m = line.match(VOICE_TAG);
    const who = m ? m[1].toLowerCase() : 'alvo';
    if (who === 'nat' && !readNat) return;
    const s = line.replace(VOICE_TAG, '').replace(/\[(nat|alvo)\]\s*/gi, '').replace(/[📝✅❌🎤🔊💡👤🛒🏥🏠🏦🎓🗣️🎯🔁💬🌐🌱]/gu, '').replace(/[\p{Extended_Pictographic}\u200D\uFE0F\u20E3]/gu, '').replace(/\*\*/g, '')
      .replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return;
    const last = parts[parts.length - 1];
    if (last && last.who === who && !last.solo) last.text += ' ' + s; else parts.push({ who, text: s });
  });
  return parts;
}
// Voz da língua nativa (para as linhas [nat]).
function nativeVoiceLocale() {
  const n = getNative(PROFILE);
  if (n === 'es') return PROFILE && PROFILE.accent === 'América Latina' ? 'es-MX' : 'es-ES';
  return NATIVES[n].locale;
}

let speakToken = 0, speakStopper = null;
// Tempo estimado da fala (para a segurança do fim da fala): ~13 caracteres por segundo à velocidade 1, mais 3 s.
const SPEECH_CHARS_PER_SEC = 13, SPEECH_GRACE_MS = 3000;
// Interromper a fala (toque no avatar ou no 🔊 enquanto a tutora fala).
function stopSpeaking() { if (isSpeaking && speakStopper) speakStopper(); }
// 🔊: se a tutora está a falar, para; senão, fala o texto.
function speakToggle(text) { if (isSpeaking) stopSpeaking(); else speak(text); }
// Depois de o microfone fechar, o Android pode engolir a fala que começa logo a seguir: espera até 1 s.
const RECOG_RELEASE_MS = 1000;
let speakRefs = []; // referências às falas em curso (o Chrome pode perder os eventos se forem recolhidas da memória)
function speak(text, onEnd) {
  ttsCancel('speak');
  const token = ++speakToken;
  let parts = voiceParts(text);
  if (typeof SpeechSynthesisUtterance === 'undefined' || !parts.length) { if (onEnd) onEnd(); return; }
  // Leitura lenta: voz local ou pedaços curtos com pausas (ver slowPlan).
  const sp = parts.some(p => p.slow) ? slowPlan(voiceLocale()) : null;
  if (sp) lastSlowPlan = { path: sp.path, voice: sp.voice ? sp.voice.name : '(padrão)', rate: sp.rate };
  if (sp && sp.chunks) parts = parts.flatMap(p => p.slow ? slowChunks(p.text).flatMap((c, k) => (k ? [{ who: 'pause', ms: 300 }] : []).concat([{ who: 'alvo', text: c, slow: true, solo: true }])) : [p]);
  const base = RATES[PROFILE && PROFILE.speed] || 0.95;
  isSpeaking = true;
  avatarState('talking', true);
  setStatus('green', t('speaking'));
  updateBusyUI();
  let finished = false;
  const finish = (ok) => {
    if (finished || token !== speakToken) return; // já terminou, ou já começou outra fala
    finished = true; speakRefs = [];
    dlog(0, 'fim da fala (' + (ok ? 'ok' : 'erro') + ')');
    isSpeaking = false; speakStopper = null;
    avatarState('talking', false);
    setStatus('ready', lzYourTurnStatus() || (ok ? t('st_ready_reply') : t('st_ready')));
    updateBusyUI();
    if (onEnd) onEnd();
  };
  speakStopper = () => { dlog(0, 'fala interrompida pela aluna'); finish(true); ttsCancel('interromper'); };
  let estMs = 0;
  const rateOf = p => p.slow ? Math.max(0.5, base * 0.6) : p.who === 'alvo' && (currentLesson !== null || guidedMode) ? Math.max(0.55, base * 0.8) : base;
  parts.forEach(p => { estMs += p.who === 'pause' ? p.ms : p.text.length / (SPEECH_CHARS_PER_SEC * rateOf(p)) * 1000; });
  // As partes são ditas uma a uma: as pausas ([pausa]) esperam, a frase lenta ([devagar]) vai mais devagar.
  const say = i => {
    if (finished || token !== speakToken) return;
    if (i >= parts.length) { finish(true); return; }
    const p = parts[i];
    if (p.who === 'pause') { setTimeout(() => say(i + 1), p.ms); return; }
    const utt = new SpeechSynthesisUtterance(p.text);
    const loc = p.who === 'nat' ? nativeVoiceLocale() : voiceLocale();
    utt.lang = loc; utt.pitch = 1.0;
    utt.rate = p.slow && sp ? sp.rate : rateOf(p); // nas lições e na Conversa guiada, o idioma estudado é lido mais devagar
    const voice = p.slow && sp && sp.voice ? sp.voice : getBestVoice(loc);
    if (voice) utt.voice = voice;
    const id = ++diagUtt;
    dlog(id, `fala «${p.text}» · voz ${voice ? voice.name : '(padrão)'} · ${loc} · rate ${Math.round(utt.rate * 100) / 100}${p.slow ? ' · lenta' : ''}`);
    utt.onstart = () => dlog(id, 'onstart');
    utt.onend = () => { dlog(id, 'onend'); say(i + 1); };
    // Um erro numa parte não cala o resto: regista e passa à parte seguinte.
    utt.onerror = (e) => { dlog(id, 'onerror: ' + (e && e.error || '?')); if (token === speakToken && !finished) say(i + 1); };
    speakRefs.push(utt);
    if (synth.paused) { try { synth.resume(); } catch(e) {} }
    synth.speak(utt);
  };
  // Depois de cancel() (e de o microfone fechar), o Chrome do Android pode perder a 1.ª frase se falar logo.
  const delay = Math.max(120, RECOG_RELEASE_MS - (Date.now() - lastRecogEnd));
  dlog(0, `speak(): ${parts.filter(p => p.who !== 'pause').length} partes · começa daqui a ${delay} ms`);
  setTimeout(() => say(0), delay);
  // Segurança: alguns aparelhos não avisam o fim da fala. Depois do tempo estimado + 3 s, sai do estado "falando"
  // (sem cortar o som, para não interromper uma voz que seja só mais lenta do que o previsto).
  setTimeout(() => { if (!finished && token === speakToken) { dlog(0, 'fim por segurança (sem onend)'); finish(true); } }, delay + estMs + SPEECH_GRACE_MS);
}

// ── Passos da lição, feitos pelo app (frases fixas). A IA só devolve um JSON com a avaliação. ──
// lessonState = { pos: passo atual em lessonSteps(), tries: tentativas erradas neste passo }
function lzNI() { return NATIVES[getNative(PROFILE)]; }
function lzLangName() { return lzNI().group === 'en' ? langUI(currentLang) : langUI(currentLang).toLowerCase(); }
// "Repita comigo" sempre na língua nativa (com "com os seus dados" quando a frase tem "…").
function lzRepeat(it) { return lzNI().repeatEx + (it.t.includes('…') ? ' ' + t('lz_fill') : ''); }
// Pergunta LEMBRAR: só na língua nativa e sem a frase a lembrar ("Como se diz "tchau" em francês?").
function lzRecallQ(it) {

function lzGloss(it) { return `[nat] (${it.g.replace(/\s*\(([^)]*)\)/g, ' — $1')})`; }
// Mini-conversa: instrução curta na língua nativa quando a fala da Lia não é uma pergunta ('pt | es | en | fr | it').
// Chave: 'z' + lição + '-' + troca (Do zero) ou 'p' + lição + '-' + troca (Primeiros passos); sem chave, uma instrução geral.
const CHAT_TASK = {

function chatTask(i, n, lia) {
  if (/[?？]\s*[»”"]?\s*$/.test(String(lia || '').trim())) return ''; // é uma pergunta: não precisa de instrução
  const row = CHAT_TASK[(isPP(i) ? 'p' + (i - PP_START) : 'z' + i) + '-' + n] || CHAT_TASK['*'];

// Mini-conversa: fala da Lia e resposta modelo (frases da lição) da troca n (cena de LESSON_SCENES).
function lzTurn(items, n) { return lessonScene(currentLesson, n, items); }
// Texto do pedido de um passo (o app escreve tudo): ENSINAR, LEMBRAR ou fala da Lia na mini-conversa.
function lzStepText(step, items, prev) {
  if (step.k === 'teach') { const it = items[step.i]; return `[lbl] ${t('lz_new_phrase', { n: step.i + 1, k: items.length })}\n` + (it.e ? `[img] ${it.e}\n` : '') + `[pausa]\n${lzAlvo(it.t)}\n${lzAlvo(it.t, true)}\n${lzGloss(it)}\n[nat] ${lzRepeat(it)}.\n[voz] ${repShort()}`; }
  if (step.k === 'recall') return (prev && prev.k === 'teach' ? `[nat] ${t('lz_recall_intro')}\n` : '') + `[nat] ${items[step.i].e ? items[step.i].e + ' ' : ''}${lzRecallQ(items[step.i])}\n[voz] ${yourTurnCue()}`;
  if (step.k === 'create') { const c = ppCreate(currentLesson, step.i); return (prev && prev.k !== 'create' ? `[nat] ${t('lz_create_intro')}\n` : '') + `[nat] ✍️ ${c.q.g}\n[voz] ${yourTurnCue()}`; }
  const tn = lzTurn(items, step.i);

  return (prev && prev.k !== 'chat' ? `[nat] ${t('lz_chat_intro')}\n` : '') + `[alvo] ${tn.lia.t}\n${lzGloss(tn.lia)}` + (task ? `\n[nat] 👉 ${task}` : '');
}
// O que a aluna deve dizer neste passo (depois de um erro, é sempre a frase a repetir).
function lzExpected(step, items) { return step.k === 'create' ? ppCreate(currentLesson, step.i).ex : step.k === 'chat' ? lzTurn(items, step.i).ans : items[step.i]; }
// Frase com "…" completada com os dados do perfil (nome; cidade; idade e telefone de exemplo), para as correções.
function lzFill(text) {
  const s = String(text || '');
  if (!s.includes('…')) return s;
  const P = PROFILE || {}, i = currentLesson;
  let v = P.name || 'Lia';
  if (i === 2) v = P.city || 'Lisboa';
  if (i === 6) v = /\b(ans|años|years|anni|anos)\b/i.test(s) ? '30' : '912 345 678';
  return s.replace(/\s*…\s*$/, ' ' + v + '.').replace(/…/g, v).replace(/\s+([.!?])$/, '$1');
}
// Pedido do passo outra vez (pergunta, resposta pouco clara, JSON inválido).
function lzAgainText(step, items, tries) {
  const ex = lzExpected(step, items);

  return lzStepText(step, items, null);
}

const LZ_TYPO_TALK = /acento|accent|pontua|puntua|punctua|ponctua|punteggiat|mai[uú]scul|may[uú]scul|capital|majuscul|maiuscol|apostro|tilde|cedilh|cedill|c[ée]dille|ortograf|spelling|orthograph/i;
const LZ_PROGRESS_TALK = /conclu|acert|ultim|\blast\b|derni|\bboth\b|ambas|as duas|les deux|entrambe|tutte e due|termin|complet|revis|review|finish|\bfini|finito|ripass|tentativa|tentativo|intento|attempt|tentative|todas as|todas las|toutes les|tutte le|\ball (the )?(\d|five|four|phrases)|\d+ (frases|phrases|frasi)|(licao|leccion|lecon|lezione|lesson) \d|proxima (fase|etapa)|next (step|phase)|proximo passo|vamos lembrar|vamos recordar|let s remember|on revise|ripassiamo|conversa|conversation|conversacion|conversazione|vamos conversar|vamos a hablar|let s talk|let s chat|on va parler|parliamo un po/;
// Notas em inglês (ex.: "Eliana repeated my own words…") para quem não é anglófono.
const LZ_ENGLISH = /\b(the|you|your|is|are|was|answer|learner|repeated|instead|step|said|should|my|own|words|correct|wrong)\b/gi;
function lzNorm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim(); }
// A aluna fez uma pergunta ou pediu explicação (em qualquer língua), em vez de responder? (Não conta como tentativa.)
function lzLooksQuestion(text, expected) {
  const tw = lzNorm(text).split(' ').filter(Boolean), ew = lzNorm(expected).split(' ').filter(Boolean);
  if (!tw.length) return false;
  const m = tw.join(' ').match(/\b(o que|que significa|que quer dizer|que quiere decir|que es|que significa|what does|what is|whats|meaning|mean|c est quoi|ca veut dire|qu est ce que|cosa vuol dire|cosa significa|che cosa|cos e|significa|significado|por que|porque|why|pourquoi|perche|nao entendi|nao percebi|no entiendo|no entendi|dont understand|didnt understand|ne comprends|pas compris|non capisco|non ho capito|explica|explique|explain|spiega|como se diz|como se dice|how do you say|comment dit on|come si dice)\b/);
  // Inícios típicos de pergunta, mesmo com transcrição imperfeita ("qu’est-ce qui ne fait que très bien").
  const s = tw.join(' ').match(/^(qu est ce|quest ce|qu est|kesk|c est quoi|ces quoi|que|cosa|che|what|whats|o que|oque|how|why|pourquoi|perche|por que|porque)\b/);
  // A pergunta não pode ser parte da própria frase da lição (ex.: « C’est quoi, ton numéro ? »).
  const notPhrase = x => !(' ' + ew.join(' ') + ' ').includes(' ' + x + ' ');
  return (!!m && notPhrase(m[1])) || (!!s && notPhrase(s[1]));
}
// A aluna repetiu a fala da Lia (quase) inteira, em vez de responder? (Só quando a fala é diferente da resposta.)
function lzEcho(text, turn) {
  const u = lzNorm(text), l = lzNorm(turn.lia.t), a = lzNorm(turn.ans.t);
  if (!u || !l || l === a) return false;
  const lw = l.split(' '), uw = new Set(u.split(' '));
  if (lw.length < 2) return false;
  const hit = lw.filter(w => uw.has(w)).length;
  return (' ' + u + ' ').includes(' ' + l + ' ') || hit / lw.length >= 0.8;
}
// Lê o JSON da IA: { result: correct | wrong | question | unclear, feedback }. Inválido → unclear.
function lzParse(reply) {
  try {
    const j = JSON.parse(String(reply).match(/\{[\s\S]*\}/)[0]);
    const r = String(j.result || '').toLowerCase().trim();
    return { result: ['correct', 'wrong', 'question', 'unclear'].includes(r) ? r : 'unclear', feedback: String(j.feedback || '').replace(/\s+/g, ' ').trim() };
  } catch (e) { return { result: 'unclear', feedback: '' }; }
}
// Em que língua está uma explicação? Conta palavras típicas de cada língua (as frases citadas entre «», "" ou “” não
// contam, porque são do idioma estudado). Devolve o grupo (pt, es, en, fr, it) e a pontuação de cada um.
const LANG_WORDS = {
  pt: 'não é são você uma um com do da dos das em ao às também isso isto essa esse palavra faltou falta certo correto aqui pelo pela ou mas fica depois sem quer dizer diz os o nas nos no na muito ela ele eu usa usa-se quando está estão vai tem têm usar som até umas uns dia meio amigos lugar pronome significa sobre outra outro mesmo assim já só ainda forma tempo passado pessoa terminação acento troca trocar errado',
  es: 'es son el la los las del al una con más también eso esto palabra correcto aquí pero lo muy hay y sin quiere decir dice en se usa cuando está están va tiene usar sonido hasta unos día amigos lugar pronombre significa sobre otra otro mismo así ya solo todavía forma tiempo pasado persona desde irse llegar falta',
  en: 'is are the an with for more also this that word here but not and of to it you your use say means verb correct missing when should must be about places place pronoun from arriving leaving evening friends instead needs there only same other form tense past person ending',
  fr: 'est sont le la les des du une un avec pour plus aussi ce cette mot ici mais ne pas et qui que on dit très sans au aux il elle c l d qu quand verbe faut pronom manque veut dire dès en arrivant partant lieu doit être pluriel entre amis autre même aussi forme temps passé personne',
  it: 'è sono il lo la gli della dello delle nel nella una un con per più anche questo questa parola qui ma non che di si dice molto senza quando verbo serve va al plurale pronome manca vuol dire riguardo luogo dopo arrivi amici altra altro stesso così già solo ancora forma tempo passato persona'
};
// Terminações típicas (contam como uma palavra da língua).
const LANG_ENDINGS = { pt: /(ção|ções|ões|ão|lh|nh)/, es: /(ción|ciones|ll|ñ)/, en: /(ing|th|ght|ould)$/, fr: /(eau|eux|oir|ais|ait)$/, it: /(zione|zioni|cch|gli|zz)/ };
const LANG_SETS = Object.fromEntries(Object.entries(LANG_WORDS).map(([k, v]) => [k, new Set(v.split(' '))]));
function guessLang(s) {
  const txt = String(s || '').replace(/«[^»]*»|"[^"]*"|“[^”]*”/g, ' ').toLowerCase();
  const words = txt.split(/[^\p{L}-]+/u).filter(Boolean);
  const sc = { pt: 0, es: 0, en: 0, fr: 0, it: 0 };
  for (const w of words) for (const g in LANG_SETS) { if (LANG_SETS[g].has(w)) sc[g]++; else if (w.length > 3 && LANG_ENDINGS[g].test(w)) sc[g] += 0.5; }
  if (/[ãõ]/.test(txt)) sc.pt += 2;
  if (/[ñ¿¡]/.test(txt)) sc.es += 2;
  if (/\b[ldcjnmsq]['’]/.test(txt)) sc.fr += 1;
  const best = Object.keys(sc).sort((a, b) => sc[b] - sc[a])[0];
  return { best, sc };
}
// A explicação está na língua nativa do perfil? Só se recusa quando é claramente de outra língua
// (2 ou mais palavras típicas dessa língua e bem menos da língua nativa); na dúvida, fica.
function inNativeLang(s) {
  if (!s) return true;
  const nat = NATIVES[getNative(PROFILE)].group, { best, sc } = guessLang(s);
  return best === nat || sc[best] < 2 || sc[nat] >= sc[best] - 1;
}
function nativeOnly(s) { return inNativeLang(s) ? s : ''; }
// Só a primeira frase (as explicações são de uma frase; "!" ou "?" dentro de «…» não contam).
function firstSentence(s) { return String(s || '').split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Ý«"“¿¡])/)[0].trim(); }
// Feedback da IA: uma só linha, na língua nativa, sem comentários proibidos.
function lzCleanFeedback(fb) {
  let s = firstSentence(String(fb || '').split('\n')[0].replace(/\[(nat|alvo)\]\s*/gi, '').replace(/^[📝✅🗣️💡🎯\s]+/u, '').trim());
  if (!s || LZ_TYPO_TALK.test(s) || LZ_PROGRESS_TALK.test(lzNorm(s))) return '';
  if (!inNativeLang(s)) return '';
  if (lzNI().group !== 'en' && (s.replace(/«[^»]*»|"[^"]*"|“[^”]*”/g, ' ').match(LZ_ENGLISH) || []).length >= 2) return '';
  return s.length > 220 ? s.slice(0, 217) + '…' : s;
}

// Abre a lição: o app mostra a meta e ensina a primeira frase (sem chamar a IA).
function greetLesson() {
  const i = currentLesson, items = lessonItems(i), steps = lessonSteps(items.length);
  lessonState = { pos: 0, tries: 0 };
  updateLessonBanner();
  const stc = isPP(i) ? ppStructure(i) : null;
  const text = (stc ? `[nat] ${t('lz2_intro', { n: lessonNum(i), title: lessonUI(i)[0] })}\n[est] ${stc.t}\n${lzGloss(stc)}\n` : `[nat] ${t('lz_intro', { n: i + 1, title: lessonUI(i)[0], k: items.length })}\n`) + lzStepText(steps[0], items);
  chatHistory = [{ role: 'user', content: `(${PROFILE.name} opened lesson ${i + 1}.)` }, { role: 'assistant', content: text }];
  addMsg('tutor', text, '', false, text, items[0].t);
  speak(text);
}

// Resposta da IA no modo Do zero (só JSON). O app escreve tudo o que a aluna vê: confirmação, correção,
// "Repita comigo", o passo seguinte, avisos de fase e o fim da lição.
function processLessonReply(reply) {
  const items = lessonItems(currentLesson), steps = lessonSteps(items.length);
  if (!lessonState) lessonState = { pos: 0, tries: 0 };
  const st = lessonState, step = steps[Math.min(st.pos, steps.length - 1)], ex = lzExpected(step, items);
  const userText = (chatHistory.filter(m => m.role === 'user').pop() || {}).content || '';
  let { result, feedback } = lzParse(reply);
  feedback = lzCleanFeedback(feedback);
  // Mini-conversa: a aluna repetiu a fala da Lia inteira → aceita, mas diz que ali bastava responder.
  const echo = step.k === 'chat' && lzEcho(userText, lzTurn(items, step.i));
  if (echo) { result = 'correct'; feedback = ''; }
  // Pergunta da aluna (mesmo mal transcrita): nunca é acerto nem tentativa.
  if (result !== 'question' && step.k !== 'chat' && lzLooksQuestion(userText, ex.t)) result = 'question';
  const out = [];
  let hint = '', finished = false, advance = false;
  if (result === 'correct' && echo) {
    out.push(`[nat] ${t('lz_chat_echo', { a: lzShow(ex.t) })}`);
    advance = true;
  } else if (result === 'correct') {
    out.push(`[alvo] ${tgt('correct')}`);
    if (feedback && step.k !== 'recall') out.push(`[nat] ${feedback}`); // no máximo uma dica de uso (não ao LEMBRAR)
    advance = true;
  } else if (result === 'wrong') {
    if (feedback) out.push(`[nat] ${feedback}`);
    if (step.k !== 'create') nbAdd({ type: 'erro', wrong: userText, right: lzPlain(lzFill(ex.t)), why: feedback });
    out.push(`[nat] ${t(step.k === 'chat' || step.k === 'create' ? 'lz_possible' : 'lz_answer_is', { a: lzShow(lzFill(ex.t)) })}`);
    if (st.tries >= 1) advance = true; // 2.ª tentativa errada: segue em frente
    else if (step.k === 'create') { st.tries++; out.push(`[nat] ${t('lz_create_again')}`); hint = ex.t; }
    else { st.tries++; out.push(`[nat] ${lzRepeat(ex)}:`, lzAlvo(lzFill(ex.t))); }
  } else {
    // question / unclear: explicação curta e o mesmo pedido outra vez (não conta como tentativa)
    if (result === 'unclear' && step.k === 'teach') out.push(`[nat] ${t('lz_just_repeat', { a: lzFill(ex.t) })}`, lzAlvo(lzFill(ex.t)));
    else {
      if (feedback) out.push(`[nat] ${feedback}`);
      else if (result === 'unclear') out.push(`[nat] ${t('lz_unclear')}`);
      out.push(lzAgainText(step, items, st.tries));
    }
    if (step.k === 'recall' && !st.tries) hint = lzShow(lzFill(ex.t));
    if (step.k === 'chat' && !st.tries) hint = lzShow(lzFill(ex.t));
    if (step.k === 'create') hint = ex.t;
  }
  if (advance) {
    st.pos++; st.tries = 0;
    const nx = steps[st.pos];
    if (!nx) { finished = true; out.push(`[nat] ${t('lz_end')}`, `[ver] ${items.map(x => lzPlain(x.t)).join(' · ')}`, `[voz] ${items.map(x => { const v = lzForms(x.t); return v ? (v.same ? v.a : v.a + ' ' + v.b) : x.t; }).join(' · ')}`); }
    else { out.push(lzStepText(nx, items, step)); if (nx.k !== 'teach') hint = lzShow(lzFill(lzExpected(nx, items).t)); }
  }
  const main = out.join('\n');
  chatHistory.push({ role: 'assistant', content: main });
  updateLessonBanner();
  const nowStep = !finished && steps[st.pos];
  addMsg('tutor', main, '', false, main, nowStep ? lzExpected(nowStep, items).t : '', hint);
  if (finished && !lessonCompleted && currentLesson !== null) {
    const i = currentLesson;
    lessonCompleted = true;
    markLessonDone(i);
    addLessonEndActions(i);
    let shown = false;
    const show = () => { if (shown) return; shown = true; celebrateLesson(i); };
    speak(main, show);
    setTimeout(show, 12000); // se a voz falhar ou for interrompida
  } else {
    speak(main);
  }
}

async function handleUserSpeech(text) {
  if (!text.trim()) return;
  // Lição concluída: o que se diz ou escreve já não é avaliado; mostra outra vez as opções.
  if (currentLesson !== null && lessonCompleted) { addLessonEndActions(currentLesson, true); setStatus('ready', t('st_ready')); return; }
  hideSuggestions();
  lastUserDiv = addMsg('user', text);
  countPractice();
  chatHistory.push({ role: 'user', content: text });
  saveLessonSession();
  await processInput(text);
}

async function sendText() {
  if (isBusy()) return; // bloqueado enquanto a tutora pensa ou fala
  const inp = document.getElementById('text-inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  hideSuggestions();
  lastUserDiv = addMsg('user', text);
  countPractice();
  chatHistory.push({ role: 'user', content: text });
  saveLessonSession();
  await processInput(text);
}

async function processInput(text) {
  // Teste de nível: as respostas não são corrigidas nem enviadas à IA uma a uma.
  if (currentTest && !currentTest.finished) { handleTestAnswer(text); return; }
  if (currentTest && currentTest.finished) exitTest(); // depois do resultado, a conversa segue normal
  setStatus('gold', t('st_processing'));
  addLoadingMsg();
  try {
    const inLesson = currentLesson !== null, runAtStart = lessonRun;
    if (!inLesson && chatFocus && ++focusTurns >= FOCUS_EVERY) pickFocus();
    let recent = chatHistory.slice(inLesson ? -40 : -20); // as lições precisam de mais histórico
    while (recent.length && recent[0].role !== 'user') recent = recent.slice(1);
    const reply = await busyAI(inLesson ? [{ role: 'user', content: `${PROFILE.name}'s message: "${text}"` }] : recent.map(m => ({ role: m.role, content: m.content })), inLesson ? buildLessonSystem() : buildSystem());
    removeLoading();
    if (inLesson) { if (currentLesson !== null && lessonRun === runAtStart) processLessonReply(reply); return; } // a aluna não saiu nem recomeçou
    const goalMatch = reply.match(/🎯\s*([A-ZÀ-Ú ]+)/u);
    const goal = goalMatch ? goalMatch[1] : '';
    const lines = reply.replace(/🎯\s*[A-ZÀ-Ú ]*/gu, '').split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
    if (repeatTarget && /ESCLARECIMENTO/i.test(goal)) { repeatTarget = ''; repeatTries = 0; dunnoEasier = false; }
    else if (repeatTarget && !/PERGUNTA/i.test(goal)) {
      repeatTries++;
      if (/OK/i.test(goal) || repeatTries >= 2) { repeatTarget = ''; repeatTries = 0; dunnoEasier = false; }
    }
    const starts = (l, s) => l.trim().startsWith(s);
    // Uma correção por vez: só a primeira linha 📝; a linha 🗣️ só aparece quando não há 📝.
    // Só conta como correção se os dois lados forem diferentes de verdade (não só maiúsculas, acentos ou pontuação).
    const formKey = t => (t || '').replace(/^[📝\s]+/u, '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    const realFix = l => { const [a, b] = l.split('·')[0].split('→'); return !!(formKey(a) && formKey(b) && formKey(a) !== formKey(b)); };
    const wasRepeating = !!repeatTarget;
    let gramFix = lines.filter(l => starts(l, '📝') && l.includes('→') && realFix(l)).slice(0, 1);
    // Erros extra da mesma fala (➕): não aparecem na conversa, só vão para o caderno (até 3 erros no total).
    let extraFix = wasRepeating ? [] : lines.filter(l => starts(l, '➕') && l.includes('→') && realFix(l.replace(/^[➕\s]+/u, '')));
    const okLine = lines.find(l => starts(l, '✅')) || '';
    const sayLine = lines.find(l => starts(l, '💬')) || '';
    // Sem 📝 mas com erros: a primeira linha ➕ passa a ser a correção; senão, a diferença entre a fala e a ✅.
    if (!gramFix.length && !wasRepeating && !sayLine) {
      if (extraFix.length) gramFix = ['📝 ' + extraFix.shift().replace(/^[➕\s]+/u, '')];
      else { const d = diffFix(text, okLine.replace(/^[✅\s]+/u, '')); if (d) gramFix = [d]; }
    }
    extraFix = extraFix.slice(0, 2);
    const fixLines = gramFix.length ? gramFix : lines.filter(l => starts(l, '🗣')).slice(0, 1);
    const guidedSugg = guidedMode ? guidedSplit(lines.join('\n')).sugg : [];
    let main = lines.filter(l => !['📝', '🗣', '✅', '🔁', '💬', '➕', '💭'].some(s => starts(l, s))).join('\n').trim();
    const unq = t => t.replace(/^[📝✅🔁💬🗣️\s]+/u, '').replace(/["“”«»]/g, '').trim();
    const ask = tgt('ask'), rep = tgt('rep');
    // Frase inteira na língua nativa: não é erro; mostra como dizer no idioma e pede para repetir.
    if (!gramFix.length && sayLine && unq(sayLine) && !wasRepeating) {
      const say = unq(sayLine);
      const canSay = tgt('canSay');
      main = `${canSay} «${say}»\n${ask}`;
      repeatTarget = say; repeatTries = 0;
      chatHistory.push({ role: 'assistant', content: main });
      const spokenSay = `${canSay} ${say}. ${rep} ${say}.`;
      addMsg('tutor', main, '', false, spokenSay, say);
      speak(spokenSay);
      return;
    }
    // Frase para repetir: a própria frase ✅ (até 10 palavras, senão só a parte com a correção).
    const fragment = gramFix.length ? repeatPhrase(unq(okLine), unq(gramFix[0].split('·')[0].split('→')[1] || '')) : '';
    if (gramFix.length && !wasRepeating) {
      main = `${ask}: «${fragment}»`;
    }
    chatHistory.push({ role: 'assistant', content: [main, ...fixLines, okLine].filter(Boolean).join('\n') });
    if (fixLines.length) {
      const fixed = okLine.replace('✅', '').trim();
      if (gramFix.length && !wasRepeating) { repeatTarget = fragment; repeatTries = 0; }
      if (gramFix.length) {
        const p0 = gramFix[0].split('·'), [wa, wb] = p0[0].split('→').map(t => unq(t || ''));
        highlightError(lastUserDiv, wa);
        // Guarda a correção no caderno (📒 Meus erros).
        if (wa && wb) nbAdd({ type: 'erro', wrong: wa, right: wb, why: firstSentence((p0[1] || '').trim()), more: p0.slice(2).join('·').trim() });
        extraFix.forEach(l => {
          const p = l.replace(/^[➕\s]+/u, '').split('·'), [xa, xb] = p[0].split('→').map(t => unq(t || ''));
          if (xa && xb) nbAdd({ type: 'erro', wrong: xa, right: xb, why: firstSentence((p[1] || '').trim()), more: p.slice(2).join('·').trim() });
        });
      }
      // Linha da correção e, logo abaixo, a explicação curta (uma frase); a explicação longa fica em "Por quê?".
      const short = fixLines.map(l => { const p = l.split('·'); const sh = nativeOnly(firstSentence((p[1] || '').trim())); return esc(p[0].trim()) + (sh ? `<div class="fix-short">${esc(sh)}</div>` : ''); }).join('');
      const why = fixLines.map(l => esc(nativeOnly(l.split('·').slice(2).join('·').trim()))).filter(Boolean).join('<br>');
      const html = (fixed ? `<div class="fix-main">✅ ${esc(fixed)}</div>` : '') +
        `<div class="fix-list">${short}</div>` +
        (why ? `<details class="fix-why"><summary>${esc(t('why'))}</summary>${why}</details>` : '') +
        (gramFix.length && extraFix.length ? `<div class="fix-more">${esc(t('fix_more', { n: extraFix.length }))}</div>` : '');
      const pairs = gramFix.map(l => {
        const [a, b] = l.split('·')[0].split('→'); return [unq(a), unq(b)];
      }).filter(([a, b]) => a && b);
      const better = BETTER[currentLang] || ((a, b) => `${b}.`);
      const sayFull = tgt('sayFull');
      const spokenFix = pairs.length ? pairs.map(([a, b]) => better(a, b)).join(' ') : (fixed ? `${sayFull} ${fixed}.` : '');
      const spoken = gramFix.length && !wasRepeating ? `${spokenFix} ${rep} ${fragment}.` : (spokenFix ? `${spokenFix} ${main}` : main);
      addMsg('tutor', main, html, true, spoken, fixed);
      speak(spoken);
    } else {
      main = limitEmoji(main || reply);
      addMsg('tutor', main);
      speak(main);
      if (guidedMode && !repeatTarget) showSuggestions(guidedSugg);
    }
  } catch(e) {
    removeLoading();
    setStatus('error', t('st_error') + (e && e.message ? e.message : t('no_connection')));
  }
}

// A IA reescreveu a frase (✅) sem linha 📝: a correção é o trecho em que a fala e a ✅ diferem
// (palavras iguais no início e no fim ficam de fora). Só serve se o trecho for curto (uma correção só).
function diffFix(said, ok) {
  const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  const a = String(said || '').split(/\s+/).filter(w => norm(w)), b = String(ok || '').split(/\s+/).filter(w => norm(w));
  if (!a.length || !b.length) return '';
  const na = a.map(norm), nb = b.map(norm);
  let p = 0; while (p < na.length && p < nb.length && na[p] === nb[p]) p++;
  let s = 0; while (s < na.length - p && s < nb.length - p && na[na.length - 1 - s] === nb[nb.length - 1 - s]) s++;
  let ea = na.length - s, eb = nb.length - s;
  if (p === ea && p === eb) return ''; // iguais (só maiúsculas, acentos ou pontuação)
  if (p === ea || p === eb) { if (p > 0) p--; else { ea++; eb++; } } // palavra que falta ou sobra: mostra com a vizinha
  const wa = a.slice(p, ea), wb = b.slice(p, eb);
  if (!wa.length || !wb.length || wa.length > 6 || wb.length > 8) return '';
  const clean = ws => ws.join(' ').replace(/^[,;:.!?¡¿]+|[,;:.!?]+$/g, '').trim();
  return `📝 ${clean(wa)} → ${clean(wb)}`;
}

// Frase para repetir, tirada da frase ✅ sem reescrever: a oração (entre vírgulas/pontos) que contém a
// correção principal; senão a ✅ inteira se tiver até 10 palavras; senão 10 palavras a partir da correção.
function repeatPhrase(ok, right) {
  const MAX = 10;
  const words = ok.split(/\s+/).filter(Boolean);
  if (!words.length) return right;
  const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  const rw = right.split(/\s+/).map(norm).filter(Boolean);
  const trimP = t => t.trim().replace(/^[,;:]+|[,;:]+$/g, '').trim();
  // A ✅ traz todos os erros corrigidos: prefere a oração que contém a correção principal.
  const clause = rw.length && ok.split(/(?<=[,;:.!?])\s+/).find(c => {
    const cw = c.split(/\s+/).map(norm);
    return cw.length <= MAX && rw.every(w => cw.includes(w));
  });
  if (clause) return trimP(clause);
  if (words.length <= MAX) return ok;
  if (!rw.length) return right;
  const nw = words.map(norm);
  let start = -1;
  for (let i = 0; i + rw.length <= nw.length; i++) if (rw.every((w, j) => nw[i + j] === w)) { start = i; break; }
  if (start < 0) return right; // a correção não aparece na frase ✅: usa o lado direito do 📝
  const size = Math.max(MAX, rw.length);
  const e = Math.min(words.length, start + size);
  const s = Math.max(0, e - size);
  return trimP(words.slice(s, e).join(' '));
}

// Regra de língua no topo das instruções: as instruções estão em inglês, mas tudo o que é para o aluno
// (explicações, traduções, linhas [nat]) vai na língua nativa do perfil.
function langRule(NI) {
  const name = (PROFILE && PROFILE.name) || 'the learner';
  const notEn = NI.group !== 'en';

🗣️ ${NI.exPron}

${guidedMode ? guidedRules(P, NI, N, EX, L) : ''}Conversation topic: "${currentTopic}"`;

// Regras da Conversa guiada (substituem as regras de tamanho e de perguntas acima).
function guidedRules(P, NI, N, EX, L) {
  const turn = chatHistory.filter(m => m.role === 'user').length + 1;
  const learned = learnedPhrases(60);
  const qs = turn <= 3 ? 'Ask a CLOSED question: yes/no or a simple choice ("A or B?").'
    : turn <= 7 ? 'Alternate closed questions (yes/no, A or B) and very simple open questions (what, where, when).'
    : 'Ask simple open questions (what, where, why, how) that need a short sentence.';
  return `GUIDED CONVERSATION: ${N} is a beginner. These rules OVERRIDE the length and question rules above:
- Your reply: at most 2 very short, simple sentences in ${L}, each with AT MOST 8 words, in the present tense when possible.
- After EACH of your sentences in ${L}, add a line "[nat] (translation in ${EX})".
- Questions (this is ${N}'s message number ${turn}): ${qs}
${learned.length ? `- Prefer the words and structures ${N} already learned in the lessons: ${learned.join(' · ')}\n` : ''}- At the very end, add exactly 2 lines starting with "💭 ", each a short possible answer for ${N} to your question, in ${L} (at most 8 words, simple, different from each other), in this format: 💭 answer in ${L} | its translation in ${EX}
- Corrections: check EVERY message of ${N} word by word BEFORE replying (determiners and articles, e.g. French "tes magazine" → "ces magazines"; agreement, e.g. "tout" → "tous"; plurals; verb forms). Being a beginner is NOT a reason to let a real mistake pass: whenever there is one, correct the most important one as usual (one 📝 line and the ✅ line); the app asks ${N} to repeat it.
`;
}

function buildLessonSystem() {
  const P = PROFILE || { name: 'the learner', levels: {} };

  const first = s => String(s).split(/\.\s/)[0].replace(/[.!]+$/, '');
  let task;
  if (st.tries && step.k !== 'create') task = `After a mistake, ${N} was asked to repeat «${ex.t}». Judge if ${N} said it.`;
  else if (step.k === 'teach') task = `${N} was asked to repeat the new phrase «${ex.t}». Judge if ${N} said it.`;
  else if (step.k === 'recall') task = `${N} was asked, in ${EX}, how to say "${ex.g}" in ${L}. Expected answer: «${ex.t}». A different but correct and natural ${L} way to say the same thing in that situation is also correct (e.g. in French «Bonjour» is correct to greet someone in the afternoon).`;
  else if (step.k === 'create') { const c = ppCreate(i, step.i), stc = ppStructure(i); task = `CREATE: ${N} was asked, in ${EX}: "${c.en}". ${N} must answer with their OWN sentence in ${L} using the lesson structure «${stc.t}». Any correct, natural ${L} sentence that uses the structure and answers the request is correct, whatever the personal content (example: «${c.ex.t}»). Mark "wrong" only for a real grammar or vocabulary mistake, or if the structure is not used at all; then the feedback names the main mistake.`; }
  else { const tn = lzTurn(items, step.i); task = `Short real-life scene: Lia said «${tn.lia.t}» (= ${tn.lia.g}). Lia may use simple words outside the list, but ${N} must reply with the lesson phrase(s) that fit (model answer: «${tn.ans.t}»). Any fitting, correct reply made with the lesson phrases is correct, also only part of the model answer if it fits the scene.`; }
  const usage = isPP(i) ? (ppLesson(i).u || {})[currentLang] : (LZ_USAGE[currentLang] || {})[i];
  const lastUser = (chatHistory.filter(m => m.role === 'user').pop() || {}).content || '';
  const looksQ = step.k !== 'chat' && lzLooksQuestion(lastUser, ex.t);
  return `You evaluate ONE answer of ${N}, ${NI.speaker}, ${isPP(i) ? 'a beginner (level A1) learning to build sentences' : 'an absolute beginner'} in a ${L} lesson. You do NOT talk to ${N}: the app writes everything ${N} sees. ${accentRule(P)}
LESSON PHRASES:
${list}
${isPP(i) ? `STRUCTURE OF THIS LESSON: «${ppStructure(i).t}» (the words in [ ] can be replaced by others)\n` : ''}("…" = ${N} MUST complete it with their own information (e.g. their name, ${N}): any sensible completion is correct, but the phrase said without the information is "wrong" (feedback: the personal information is missing). "A / B" = both forms are right: they are the forms for a man and for a woman, ${N} may say either; never comment on which written form the speech recognition chose, especially when they sound the same.)
${usage ? `USAGE NOTES (the facts for every tip; never contradict them): ${usage}
` : ''}TASK: ${task}
${looksQ ? `ATTENTION: the message looks like a QUESTION or a request for explanation, maybe badly transcribed by the microphone (e.g. "qu'est-ce qui ne fait que très bien" = "what does «très bien» mean?"): result "question".\n` : ''}The message comes from SPEECH RECOGNITION: ignore capitals, accents, punctuation, apostrophes and similar-sounding glitches; never mention them.
Reply ONLY with this JSON, nothing before or after:
{"result": "correct" | "wrong" | "question" | "unclear", "feedback": "…"}
- "correct": the answer is right. feedback: "" or at most ONE useful usage tip (one objective sentence of at most 12 words, e.g. "${NI.exShort}") ABOUT THE ${L.toUpperCase()} PHRASE, quoted in ${L} between «» (when or with whom to use it), NEVER about its translation (wrong: "Use «tchau» para se despedir de amigos"; right: "«Goodbye!» é um pouco formal; entre amigos se diz mais «Bye!»"); or, for a correct alternative, the difference in one short sentence. Tips must be true and consistent with the usage notes and with the other lesson phrases (e.g. «Good afternoon» from noon until about 6 p.m.).
- "wrong": a real mistake (wrong or missing word, wrong phrase). feedback: ONE objective sentence of at most 12 words saying what was wrong or missing (e.g. "${first(NI.exWrong)}"), without the full right answer.
- "question": ${N} asks a question or asks for an explanation, in any language (e.g. "o que significa…?", "¿qué quiere decir…?", "c'est quoi… ?", "what does … mean?", "não entendi"). feedback: a short answer to the question (one sentence of at most 12 words).
- "unclear": the message makes no sense, is garbled, repeats Lia's question or answers something else. feedback: ONE kind sentence of at most 12 words saying what to do (never say that the answer «makes no sense») (e.g. "${first(NI.exOff)}").
feedback: ONE objective sentence of AT MOST 12 WORDS, in ${EX} ONLY (${NI.variant})${NI.group !== 'en' ? ', NEVER in English' : ''}; only the quoted ${L} phrases are in ${L}. Write gender-neutral: never assume the gender of ${N} or of other people (say "the person"/"someone"; e.g. in Portuguese "sem ver a pessoa logo", not "sem vê-lo"). Never talk about progress, phases, attempts or the end of the lesson; never give instructions such as "repeat after me"; never write notes about ${N} in the third person.`;
}

// ── Tutora ocupada: microfone e envio de texto bloqueados enquanto pensa (chamada à IA) ou fala ──
let aiBusy = 0;
function isBusy() { return aiBusy > 0 || isSpeaking; }
async function busyAI(messages, system) {
  aiBusy++; updateBusyUI();
  try { return await callAI(messages, system); }
  finally { aiBusy--; updateBusyUI(); }
}
function updateBusyUI() {
  const busy = isBusy() && !isRecording;
  const btn = document.getElementById('mic-btn'), lab = document.getElementById('mic-label'), send = document.getElementById('send-btn');
  if (btn) btn.classList.toggle('busy', busy);
  if (btn) btn.classList.toggle('your-turn', !busy && !isRecording && currentView === 'chat' && ((currentLesson !== null && !lessonCompleted) || (guidedMode && !currentTest)) && !!document.getElementById('transcript').children.length);
  if (send) send.disabled = busy;
  if (lab) lab.textContent = isRecording ? t('mic_listening') : aiBusy > 0 ? t('busy_thinking') : isSpeaking ? t('busy_speaking') : t('mic_tap');
  const av = document.getElementById('avatar'); if (av) av.classList.toggle('can-stop', isSpeaking);

// Chamada à IA. Erros com mensagem clara na língua do aluno: sem internet, demora (45 s) ou resposta inválida.
const AI_TIMEOUT_MS = 45000;
async function callAI(messages, system) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), AI_TIMEOUT_MS) : null;
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: 1024, thinking: { type: 'disabled' }, system, messages }),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch(e) {
    throw new Error(e && e.name === 'AbortError' ? t('ai_timeout') : t('no_connection'));
  } finally {
    if (timer) clearTimeout(timer);
  }
  let data;
  try { data = await res.json(); } catch(e) { throw new Error(t('empty_reply') + ' (HTTP ' + res.status + ')'); }
  if (data.error) throw new Error(data.error.message);
  const text = (data.content || []).filter(b => b.type === 'text' && b.text).map(b => b.text).join('\n').trim();
  if (!text) throw new Error(t('empty_reply') + (data.stop_reason ? ' (' + data.stop_reason + ')' : ''));
  return text;
}

  const bubble = `<div class="bubble">${role === 'tutor' ? renderTagged(text) : esc(text).replace(/\n/g,'<br>')}</div>`;
  const corr = correction ? `<div class="correction">${correction.replace(/\n/g,'<br>')}</div>` : '';
  div.innerHTML = correctionFirst ? label + corr + bubble : label + bubble + corr;
  if (role === 'tutor') {
    const tools = document.createElement('div');
    tools.className = 'msg-tools';
    const bListen = document.createElement('button');
    bListen.textContent = '🔊'; bListen.title = t('btn_listen_again');
    bListen.onclick = () => speakToggle(spoken || text);
    const bTr = document.createElement('button');
    bTr.textContent = '🌐'; bTr.title = t('btn_translate');
    bTr.onclick = () => toggleTranslation(div, clean);
    const bStar = document.createElement('button');
    bStar.textContent = '⭐'; bStar.title = t('btn_save');
    let picked = '';
    // Lê a seleção antes do toque no botão (no telemóvel o toque pode apagá-la).
    bStar.addEventListener('pointerdown', () => { picked = selectionIn(div); });
    bStar.onclick = () => {
      const txt = stripTags(picked || selectionIn(div) || saveText || clean).replace(/🔁/g, '').replace(/\s+/g, ' ').trim();
      picked = '';
      if (!txt) return;
      nbAdd({ type: 'salva', text: txt });
      bStar.textContent = t('saved');
      setTimeout(() => { bStar.textContent = '⭐'; }, 1500);
    };
    tools.append(bListen, bTr, bStar);
    if (hint) {
      const bHint = document.createElement('button');
      bHint.textContent = t('hint_label');
      const hd = document.createElement('div');
      hd.className = 'msg-hint hide'; hd.textContent = '💡 ' + hint;
      bHint.onclick = () => hd.classList.toggle('hide');
      tools.appendChild(bHint);
      div.appendChild(tools);
      div.appendChild(hd);
    } else {
      div.appendChild(tools);
    }
  }
  box.appendChild(div);
  scrollChatToEnd();
  if (currentLesson !== null && !restoringLesson) {
    lessonLog.push({ role, text, correction: correction || '', correctionFirst: !!correctionFirst, spoken: spoken || '', saveText: saveText || '', hint: hint || '' });
    div.dataset.log = lessonLog.length - 1;
    saveLessonSession();
  }
  return div;
}

// Balão da tutora: linhas [nat] em itálico (língua nativa), linhas [alvo] normais; as marcas não aparecem.
function renderTagged(text) {
  return String(text || '').split('\n').filter(line => !voiceOnly(line)).map(line => {
    if (IMG_TAG.test(line)) return `<span class="lz-emoji" aria-hidden="true">${esc(line.replace(IMG_TAG, ''))}</span>`;
    if (EST_TAG.test(line)) return `<span class="lz-pattern">🧩 ${esc(line.replace(EST_TAG, ''))}</span>`;
    if (LBL_TAG.test(line)) return `<span class="lz-label">${esc(line.replace(LBL_TAG, ''))}</span>`;
    if (VER_TAG.test(line)) return esc(line.replace(VER_TAG, ''));
    const m = line.match(VOICE_TAG);
    const s = line.replace(VOICE_TAG, '').replace(/\[(nat|alvo)\]\s*/gi, '');
    return m && m[1].toLowerCase() === 'nat' ? `<span class="ln-nat">${esc(s)}</span>` : esc(s);
  }).join('<br>');
}

// Destaca em vermelho, no balão "TU", o trecho errado (lado esquerdo do 📝), ignorando maiúsculas, acentos e pontuação.
function highlightError(div, left) {
  if (!div || !left) return;
  const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  const lw = left.split(/\s+/).map(norm).filter(Boolean);
  if (!lw.length) return;
  const parts = (div.dataset.text || '').split(/(\s+)/);
  const widx = parts.map((p, i) => (i % 2 === 0 && norm(p)) ? i : -1).filter(i => i >= 0);
  const wn = widx.map(i => norm(parts[i]));
  let s = -1;
  for (let i = 0; i + lw.length <= wn.length; i++) if (lw.every((w, j) => wn[i + j] === w)) { s = i; break; }
  if (s < 0) return;
  const a = widx[s], b = widx[s + lw.length - 1];
  const html = parts.map((p, i) => (i === a ? '<mark class="err">' : '') + esc(p) + (i === b ? '</mark>' : '')).join('');
  const bubble = div.querySelector('.bubble');
  if (bubble) bubble.innerHTML = html;
  // Guarda o destaque no registo da lição (para repor ao continuar).
  if (div.dataset.log && !restoringLesson && lessonLog[+div.dataset.log]) { lessonLog[+div.dataset.log].hl = left; saveLessonSession(); }
}

// ── 📒 MEU CADERNO ──
// localStorage 'tutora_caderno' = { es: [itens], en: [...], ... }, mais recentes primeiro, máx. 300 por idioma.
// Item: { id, type: 'erro' | 'salva', date, wrong, right, why } ou { id, type: 'salva', date, text }.
const NB_KEY = 'tutora_caderno', NB_MAX = 300;
let nbCurrentTab = 'erro';

function nbLoad() {
  let nb;
  try { nb = JSON.parse(store.getItem(NB_KEY) || '{}'); } catch(e) { nb = {}; }
  if (!nb || typeof nb !== 'object') return {};
  // Junta os erros repetidos já guardados (cadernos antigos ou importados).
  let changed = false;
  for (const lang of Object.keys(nb)) if (Array.isArray(nb[lang])) { const m = nbMerge(nb[lang]); if (m.length !== nb[lang].length) { nb[lang] = m; changed = true; } }
  if (changed) nbStore(nb);
  return nb;
}
// Mesmo erro = mesmo trecho errado e mesma correção, sem maiúsculas, acentos nem pontuação (a mesma chave da memória da Lia).
function nbKey(it) {
  const k = t => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  return k(it.wrong) + '→' + k(it.right);
}
// Junta os cartões repetidos de uma lista: soma as vezes, fica a data mais recente e a explicação mais recente.
function nbMerge(list) {
  const out = [], seen = new Map();
  for (const it of list) { // a lista está do mais recente para o mais antigo
    if (!it || it.type !== 'erro') { out.push(it); continue; }
    const k = nbKey(it), g = seen.get(k);
    if (!g) { const c = Object.assign({}, it, { count: it.count || 1 }); seen.set(k, c); out.push(c); continue; }
    g.count += it.count || 1;
    if (!g.why && it.why) g.why = it.why;
    if (!g.more && it.more) g.more = it.more;
    if (String(it.date) > String(g.date)) g.date = it.date;
  }
  return out;
}
function nbStore(nb) { try { store.setItem(NB_KEY, JSON.stringify(nb)); } catch(e) {} }
function nbList() { const l = nbLoad()[currentLang]; return Array.isArray(l) ? l : []; }

function nbAdd(item) {
  if (item.type === 'erro') item = Object.assign({}, item, { why: nativeOnly(item.why || ''), more: nativeOnly(item.more || '') });
  const nb = nbLoad();
  const list = Array.isArray(nb[currentLang]) ? nb[currentLang] : [];
  // Erro que já está no caderno: não cria cartão novo; sobe para o topo, com a data de hoje e mais uma vez no contador.
  if (item.type === 'erro') {
    const k = nbKey(item), i = list.findIndex(x => x && x.type === 'erro' && nbKey(x) === k);
    if (i >= 0) {
      const old = list.splice(i, 1)[0];
      list.unshift(Object.assign({}, old, { date: new Date().toISOString(), count: (old.count || 1) + 1, why: item.why || old.why, more: item.more || old.more }));
      nb[currentLang] = list.slice(0, NB_MAX);
      nbStore(nb);
      if (currentView === 'notebook') renderNotebook();
      return;
    }
    item = Object.assign({ count: 1 }, item);
  }
  list.unshift(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: new Date().toISOString() }, item));
  nb[currentLang] = list.slice(0, NB_MAX); // apaga os mais antigos
  nbStore(nb);
  if (currentView === 'notebook') renderNotebook();
}

function nbDelete(id) {
  const nb = nbLoad();
  nb[currentLang] = nbList().filter(i => i.id !== id);
  nbStore(nb);
  renderNotebook();
}

// Os erros que a aluna mais repete: agrupa por "errado → certo" (sem maiúsculas, acentos nem pontuação).
function topErrors(n) {
  const key = t => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const groups = new Map();
  nbList().forEach((it, idx) => {
    if (it.type !== 'erro') return;
    const k = key(it.wrong) + '→' + key(it.right);
    const g = groups.get(k);
    if (g) g.count += it.count || 1; else groups.set(k, { wrong: it.wrong, right: it.right, why: it.why, count: it.count || 1, order: idx });
  });
  return [...groups.values()].sort((a, b) => b.count - a.count || a.order - b.order).slice(0, n || 5);
}

function nbTab(tab) { nbCurrentTab = tab; renderNotebook(); }
// Ordem da aba "Meus erros": 'recent' (mais recentes) ou 'count' (mais repetidos). Fica guardada neste aparelho.
let nbSort = (() => { try { return store.getItem('tutora_caderno_ordem') === 'count' ? 'count' : 'recent'; } catch(e) { return 'recent'; } })();
function nbSetSort(s) { nbSort = s; try { store.setItem('tutora_caderno_ordem', s); } catch(e) {} renderNotebook(); }

function renderNotebook() {
  const all = nbList();
  const errs = all.filter(i => i.type === 'erro'), saved = all.filter(i => i.type === 'salva');
  document.getElementById('nb-title').textContent = t('nb_title') + ' · ' + langUI(currentLang);
  const tE = document.getElementById('nb-tab-erro'), tS = document.getElementById('nb-tab-salva');
  tE.textContent = `${t('tab_errors')} (${errs.length})`; tS.textContent = `${t('tab_saved')} (${saved.length})`;
  tE.classList.toggle('active', nbCurrentTab === 'erro'); tS.classList.toggle('active', nbCurrentTab === 'salva');
  const box = document.getElementById('nb-list');
  box.innerHTML = '';
  let items = nbCurrentTab === 'erro' ? errs : saved;
  const sortRow = document.getElementById('nb-sort');
  sortRow.style.display = nbCurrentTab === 'erro' && errs.length > 1 ? 'flex' : 'none';
  sortRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.sort === nbSort));
  if (nbCurrentTab === 'erro' && nbSort === 'count') items = items.slice().sort((a, b) => (b.count || 1) - (a.count || 1) || String(b.date).localeCompare(String(a.date)));
  if (!items.length) {
    box.innerHTML = nbCurrentTab === 'erro'
      ? `<div class="nb-empty">${t('nb_empty_errors')}</div>`
      : `<div class="nb-empty">${t('nb_empty_saved')}</div>`;
    return;
  }
  const loc = nativeInfo().date;
  const mk = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; return d; };
  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'nb-item';
    const body = document.createElement('div'); body.className = 'nb-body';
    if (it.type === 'erro') {
      const line = document.createElement('div');
      const w = document.createElement('span'); w.className = 'nb-wrong'; w.textContent = it.wrong;
      const r = document.createElement('span'); r.className = 'nb-right'; r.textContent = it.right;
      line.append(w, ' → ', r);
      if ((it.count || 1) > 1) { const c = document.createElement('span'); c.className = 'nb-count'; c.textContent = '×' + it.count; c.title = t('nb_times', { n: it.count }); line.append(' ', c); }
      body.appendChild(line);
      if (it.why) body.appendChild(mk('nb-why', it.why));
      if (it.more) { // explicação mais longa, em "Por quê?"
        const d = document.createElement('details'); d.className = 'nb-more';
        const sm = document.createElement('summary'); sm.textContent = t('why');
        d.append(sm, mk('', it.more)); body.appendChild(d);
      }
    } else {
      body.appendChild(mk('', it.text));
    }
    let dateTxt = '';
    try { dateTxt = new Date(it.date).toLocaleDateString(loc, { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch(e) {}
    body.appendChild(mk('nb-date', dateTxt));
    const act = document.createElement('div'); act.className = 'nb-actions';
    const bS = document.createElement('button'); bS.textContent = '🔊'; bS.title = t('listen');
    bS.onclick = () => speakToggle(it.type === 'erro' ? it.right : it.text);
    const bD = document.createElement('button'); bD.textContent = '🗑️'; bD.title = t('delete');
    bD.onclick = () => nbDelete(it.id);
    act.append(bS, bD);
    row.append(body, act);
    box.appendChild(row);
  });
}

// ── 🔥 RACHA ──
// localStorage 'tutora_racha' = { days: { 'AAAA-MM-DD': nº de falas enviadas nesse dia } }.
// Um dia conta como praticado com pelo menos 5 falas; a racha são os dias seguidos até hoje (ou até ontem, se hoje ainda não completou).
const STREAK_KEY = 'tutora_racha', STREAK_GOAL = 5;
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function streakLoad() {
  try { const s = JSON.parse(store.getItem(STREAK_KEY) || 'null'); return s && s.days && typeof s.days === 'object' ? s : { days: {} }; } catch(e) { return { days: {} }; }
}
function streakStore(s) { try { store.setItem(STREAK_KEY, JSON.stringify(s)); } catch(e) {} }

function streakStats() {
  const s = streakLoad(), today = new Date(), tk = dayKey(today);
  const done = k => (s.days[k] || 0) >= STREAK_GOAL;
  let cur = 0, d = done(tk) ? today : addDays(today, -1);
  while (done(dayKey(d))) { cur++; d = addDays(d, -1); }
  const doneDays = Object.keys(s.days).filter(done).sort();
  let best = 0, run = 0, prev = '';
  doneDays.forEach(k => {
    run = prev && dayKey(addDays(new Date(prev + 'T12:00:00'), 1)) === k ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  });
  const mon = addDays(today, -((today.getDay() + 6) % 7)); // semana de segunda a domingo
  const week = t('week').split(',').map((label, i) => {
    const k = dayKey(addDays(mon, i));
    return { label, done: done(k), today: k === tk };
  });
  return { cur, best: Math.max(best, cur), total: doneDays.length, todayCount: s.days[tk] || 0, todayDone: done(tk), week };
}

function weekHtml(week) {
  return '<div class="week-row">' + week.map(w =>
    `<div class="week-day"><div class="week-dot${w.done ? ' done' : ''}${w.today ? ' today' : ''}">${w.done ? '🔥' : ''}</div>${w.label}</div>`
  ).join('') + '</div>';
}

// Chamada a cada fala enviada; na 5.ª fala do dia, celebra.
function countPractice() {
  const s = streakLoad(), k = dayKey();
  s.days[k] = (s.days[k] || 0) + 1;
  streakStore(s);
  updateStreakBadge();
  if (s.days[k] === STREAK_GOAL) celebrate();
}

function updateStreakBadge() {
  const st = streakStats(), b = document.getElementById('streak-badge');
  if (!b) return;
  b.textContent = '🔥 ' + st.cur;
  b.classList.toggle('off', !st.todayDone);
  b.title = st.todayDone ? t('badge_done', { n: st.cur }) : t('badge_left', { n: st.todayCount, g: STREAK_GOAL });
}

let celebrateTimer = null;
function celebrate() {
  const st = streakStats();
  const phrase = tgt('great');
  document.getElementById('cel-card').innerHTML =
    `<div class="cel-flame">🔥</div><div class="cel-title">${phrase}</div>` +
    `<div class="cel-sub">${esc(st.cur === 1 ? t('day_one') : t('day_many', { n: st.cur }))}</div>` + weekHtml(st.week);
  document.getElementById('celebrate').classList.add('show');
  clearTimeout(celebrateTimer);
  celebrateTimer = setTimeout(hideCelebrate, 4000);
}
function hideCelebrate() { clearTimeout(celebrateTimer); document.getElementById('celebrate').classList.remove('show'); }

function renderStreakStats() {
  const st = streakStats(), el = document.getElementById('pf-streak');
  if (!el) return;
  el.innerHTML = `<div class="streak-grid">
      <div><div class="streak-num">🔥 ${st.cur}</div><div class="streak-lbl">${esc(t('st_current'))}</div></div>
      <div><div class="streak-num">${st.best}</div><div class="streak-lbl">${esc(t('st_best'))}</div></div>
      <div><div class="streak-num">${st.total}</div><div class="streak-lbl">${esc(t('st_total'))}</div></div>
    </div>${weekHtml(st.week)}
    <div class="streak-today">${esc(st.todayDone ? t('today_done') : t('today_left', { n: st.todayCount, g: STREAK_GOAL }))}</div>`;
}

// ── 📊 TESTE DE NÍVEL ──
// 8 perguntas (geradas pela IA numa chamada), respondidas sem correção; no fim, uma chamada avalia tudo.
// Último resultado por idioma no localStorage 'tutora_teste' = { idioma: { date, level, explanation, strengths, improve } }.
const TEST_KEY = 'tutora_teste', TEST_TOTAL = 8;
let currentTest = null; // { q: [perguntas], a: [respostas], idx, finished }
function testLoad() { try { const s = JSON.parse(store.getItem(TEST_KEY) || '{}'); return s && typeof s === 'object' ? s : {}; } catch(e) { return {}; } }
function testStore(s) { try { store.setItem(TEST_KEY, JSON.stringify(s)); } catch(e) {} }
// Lê o primeiro objeto JSON de uma resposta da IA (ignora texto à volta).
function parseJsonReply(text) {
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(text.slice(a, b + 1)); } catch(e) { return null; }
}
// Aceita "Intermediário", "intermediario", etc.
function normLevel(v) {
  const k = String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  return LEVELS.find(l => l.normalize('NFD').replace(/[̀-ͯ]/g, '') === k) || null;

function setTestUI(on) {

async function startTest() {

  updateLessonBanner();

  addMsg('tutor', '[nat] ' + t('test_intro'));

  const P = PROFILE, NI = NATIVES[getNative(P)];

Write ${TEST_TOTAL} short questions (at most 15 words each) in ${currentLangName}, addressed to ${P.name}, in increasing difficulty:
1. greeting and asking their name; 2. everyday present (where they are from, where they live); 3. everyday present (routine); 4. past (what they did yesterday); 5. past (last weekend); 6. future plans; 7. opinion and why, on an everyday topic; 8. hypothesis ("what would you do if…").
No translations and no numbering inside the sentences. Reply ONLY with JSON: {"perguntas": ["…", "…"]}`;

  } catch(e) {
    removeLoading();
    if (currentTest !== test) return;
    exitTest();
    setStatus('error', t('st_error') + (e && e.message ? e.message : t('no_connection')));
  }
}
function askTestQuestion() {
  const q = currentTest.q[currentTest.idx];
  updateLessonBanner();
  addMsg('tutor', q);
  speak(q);
}
// Resposta da aluna a uma pergunta do teste (sem correção nem chamada à IA).
function handleTestAnswer(text) {
  const test = currentTest;
  if (!test || test.finished || !test.q.length) return;
  test.a[test.idx] = text;
  test.idx++;
  if (test.idx < test.q.length) setTimeout(() => { if (currentTest === test) askTestQuestion(); }, 300);
  else finishTest();
}
function skipTestQuestion() {
  if (!currentTest || currentTest.finished || !currentTest.q.length) return;
  ttsCancel();
  addMsg('user', '🤷 ' + t('test_skip_said'));
  handleTestAnswer('(no answer)');
}
async function finishTest() {
  const test = currentTest;
  test.finished = true;
  setTestUI(false);
  document.getElementById('hint-btn').style.display = 'none';
  updateLessonBanner();
  setStatus('gold', t('st_processing'));
  addLoadingMsg();
  const P = PROFILE, NI = NATIVES[getNative(P)], EX = NI.expl, lang = currentLang;
  const system = `${langRule(NI)}
You are a ${currentLangName} examiner. Assess the spoken level of ${P.name} (${NI.speaker}) from the answers to a ${TEST_TOTAL}-question test of increasing difficulty. The answers come from speech recognition: ignore punctuation, capitals, accents and microphone glitches. "(no answer)" = they did not answer. ${accentRule(P)}
Levels: "iniciante" (does not answer or only isolated words), "básico" (simple present-tense sentences), "intermediário" (uses past and future with some mistakes, explains opinions), "avançado" (uses hypotheses and complex structures with few mistakes).
Reply ONLY with JSON: {"nivel": "iniciante|básico|intermediário|avançado", "explicacao": "one short sentence in ${EX}", "fortes": ["…", "…"], "melhorar": ["…", "…"]}. The texts go in ${EX} (${NI.variant}), at most 12 words each; "fortes" and "melhorar" have exactly 2 items. Keep the JSON keys and the level values exactly as shown.`;
  const qa = test.q.map((q, i) => `${i + 1}. ${q}\nAnswer: ${test.a[i] || '(no answer)'}`).join('\n\n');
  try {
    const out = await busyAI([{ role: 'user', content: qa }], system);
    removeLoading();
    if (currentTest !== test) return;
    const j = parseJsonReply(out) || {};
    const level = normLevel(j.nivel);
    if (!level) throw new Error(t('test_eval_fail'));
    const list = v => (Array.isArray(v) ? v : []).filter(s => typeof s === 'string' && s.trim()).map(s => s.trim()).slice(0, 2);
    const result = { date: new Date().toISOString(), level, explanation: String(j.explicacao || '').trim(), strengths: list(j.fortes), improve: list(j.melhorar) };
    const all = testLoad(); all[lang] = result; testStore(all);
    test.done = true;
    updateLessonBanner();
    showTestResult(result);
  } catch(e) {
    removeLoading();
    if (currentTest !== test) return;
    exitTest();
    setStatus('error', t('st_error') + (e && e.message ? e.message : t('no_connection')));
  }
}
function showTestResult(r) {
  const li = arr => arr.map(s => `<li>${esc(s)}</li>`).join('');
  const html = `<div class="test-card"><div class="lvl-title">${esc(t('test_result_title', { level: t('lvl_' + r.level) }))}</div>` +
    (r.strengths.length ? `<div class="sec">${esc(t('test_strong'))}</div><ul>${li(r.strengths)}</ul>` : '') +
    (r.improve.length ? `<div class="sec">${esc(t('test_improve'))}</div><ul>${li(r.improve)}</ul>` : '') +
    `<div class="sec">${esc(t('test_recommend'))}</div><div class="rec"></div></div>`;
  const div = addMsg('tutor', '[nat] ' + (r.explanation || t('test_result_title', { level: t('lvl_' + r.level) })), html, true);
  // Recomendação: iniciante/básico → próxima lição do Do zero; senão → Conversar.
  const next = nextLessonIdx(zeroLang().done);
  const lessonFirst = (r.level === 'iniciante' || r.level === 'básico') && next >= 0;
  const rec = div.querySelector('.rec');
  const bLesson = document.createElement('button');
  if (next >= 0) {
    bLesson.textContent = t('test_rec_lesson', { n: next + 1, title: lessonUI(next)[0] });
    bLesson.onclick = () => { exitTest(); startLesson(next); };
  }
  const bChat = document.createElement('button');
  bChat.textContent = t('test_rec_chat');
  bChat.onclick = () => { exitTest(); const free = document.querySelectorAll('.topic-pill')[1]; setTopic(free, 'Free conversation'); };
  (lessonFirst ? bLesson : bChat).classList.add('primary');
  if (lessonFirst) rec.append(bLesson, bChat); else { rec.append(bChat); if (next >= 0) rec.append(bLesson); }
  setStatus('ready', t('st_ready'));
  renderHome();
  // Atualiza o nível do idioma no perfil, com confirmação.
  const cur = (PROFILE.levels || {})[currentLang] || DEFAULT_LEVELS[currentLang];
  if (r.level !== cur) {
    setTimeout(() => {
      if (confirm(t('test_confirm', { lang: langUI(currentLang), level: t('lvl_' + r.level) }))) {
        PROFILE.levels = Object.assign({}, DEFAULT_LEVELS, PROFILE.levels || {}, { [currentLang]: r.level });
        try { store.setItem('tutora_profile', JSON.stringify(PROFILE)); } catch(e) {}
      }
    }, 600);
  }
}
function exitTest() {
  if (currentTest === null) return;
  currentTest = null;
  setTestUI(false);
  if (topicElBeforeLesson && currentLesson === null) topicElBeforeLesson.classList.add('active');
  updateLessonBanner();
}
function renderTestsSummary() {
  const box = document.getElementById('pf-tests'), all = testLoad();
  const rows = visibleLangs().filter(l => all[l.code] && normLevel(all[l.code].level));
  if (!rows.length) { box.innerHTML = `<div class="none">${esc(t('pf_tests_none'))}</div>`; return; }
  box.innerHTML = rows.map(l => {
    const r = all[l.code];
    let d = '';
    try { d = new Date(r.date).toLocaleDateString(nativeInfo().date); } catch(e) {}
    return `<div>${langFlag(l.code)} ${esc(langUI(l.code))}: <span class="lvl">${esc(t('lvl_' + normLevel(r.level)))}</span> <span class="when">· ${esc(d)}</span></div>`;
  }).join('');
}

// ── 📷 FOTO DO PERFIL ──
// localStorage 'tutora_foto' = data URL JPEG, reduzida para caber em 256×256.
const PHOTO_KEY = 'tutora_foto', PHOTO_MAX = 256;
function loadPhoto() { try { return store.getItem(PHOTO_KEY) || ''; } catch(e) { return ''; } }
function handlePhoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, PHOTO_MAX / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    try { store.setItem(PHOTO_KEY, c.toDataURL('image/jpeg', 0.85)); }
    catch(e) { alert(t('photo_save_fail')); return; }
    renderPhotos();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert(t('photo_fail')); };
  img.src = url;
}
function removePhoto() {
  try { store.removeItem(PHOTO_KEY); } catch(e) {}
  renderPhotos();
}
// Mostra a foto (ou 👤) no perfil, no Início e nas falas já escritas.
function renderPhotos() {
  const p = loadPhoto();
  ['pf-photo', 'home-photo'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = '';
    if (p) { const img = document.createElement('img'); img.src = p; img.alt = ''; el.appendChild(img); }
    else el.textContent = '👤';
  });
  document.getElementById('photo-remove').style.display = p ? '' : 'none';
  document.querySelectorAll('.msg.user .label').forEach(l => { l.innerHTML = userLabelHtml(); });
}
function userLabelHtml() {
  const p = loadPhoto(), name = t('lbl_you').replace(/^🎤\s*/u, '');
  return p ? `<img class="lbl-photo" src="${p}" alt="">${esc(name)}` : esc(t('lbl_you'));
}

// ── CÓPIA DE SEGURANÇA ──
// Exporta perfil + caderno (todos os idiomas) + racha num .json. A chave API NUNCA entra no arquivo.
function exportData() {
  const data = { app: 'tutora-voz', version: 3, exportedAt: new Date().toISOString(), profile: loadProfile(), foto: loadPhoto() || null, caderno: nbLoad(), racha: streakLoad(), zero: zeroLoad(), teste: testLoad() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const who = String((PROFILE && PROFILE.name) || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  a.href = url; a.download = `parlia-dados-${who ? who + '-' : ''}${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importData(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try { data = JSON.parse(reader.result); } catch(e) {}
    if (!data || data.app !== 'tutora-voz') { alert(t('import_invalid')); return; }
    const caderno = {};
    Object.keys(data.caderno && typeof data.caderno === 'object' ? data.caderno : {}).forEach(lang => {
      const l = data.caderno[lang];
      if (Array.isArray(l)) caderno[lang] = l.filter(i => i && typeof i === 'object' && i.type).slice(0, NB_MAX);
    });
    const racha = data.racha && data.racha.days && typeof data.racha.days === 'object' ? { days: data.racha.days } : { days: {} };
    const nItems = Object.values(caderno).reduce((n, l) => n + l.length, 0);
    let when = '';
    try { when = new Date(data.exportedAt).toLocaleDateString(nativeInfo().date); } catch(e) {}
    const nDays = Object.keys(racha.days).length;
    // Progresso do Do zero (cópias antigas, sem "zero", mantêm o progresso atual).
    const hasZero = !!(data.zero && typeof data.zero === 'object');
    const zero = {};
    Object.keys(hasZero ? data.zero : {}).forEach(lang => {
      const e = data.zero[lang];
      if (e && typeof e === 'object') zero[lang] = { done: Array.isArray(e.done) ? e.done.filter(n => Number.isInteger(n) && n >= 0 && n < LESSON_COUNT) : [], seen: !!e.seen, current: Number.isInteger(e.current) && e.current >= 0 && e.current < ZERO_TOTAL ? e.current : null };
    });
    const nLessons = Object.values(zero).reduce((n, e) => n + e.done.length, 0);
    const ok = confirm(t('import_confirm', {
      lessons: hasZero ? t('lessons_n', { n: nLessons }) : '—',
      when: when ? t('import_when', { date: when }) : '',
      name: data.profile && data.profile.name ? ' (' + data.profile.name + ')' : '',
      items: nItems === 1 ? t('item_one') : t('item_many', { n: nItems }),
      days: nDays === 1 ? t('dayp_one') : t('dayp_many', { n: nDays })
    }));
    if (!ok) return;
    try {
      if (data.profile && data.profile.name) store.setItem('tutora_profile', JSON.stringify(data.profile));
      store.setItem(NB_KEY, JSON.stringify(caderno));
      store.setItem(STREAK_KEY, JSON.stringify(racha));
      if (hasZero) store.setItem(ZERO_KEY, JSON.stringify(zero));
      // Teste de nível: só substitui se a cópia o trouxer.
      if (data.teste && typeof data.teste === 'object') {
        const tst = {};
        Object.keys(data.teste).forEach(lang => {
          const r = data.teste[lang], lv = r && normLevel(r.level);
          const strs = v => (Array.isArray(v) ? v : []).filter(s => typeof s === 'string').slice(0, 2);
          if (lv) tst[lang] = { date: String(r.date || ''), level: lv, explanation: String(r.explanation || ''), strengths: strs(r.strengths), improve: strs(r.improve) };
        });
        store.setItem(TEST_KEY, JSON.stringify(tst));
      }
      // Foto: só substitui se a cópia trouxer uma imagem válida.
      if (typeof data.foto === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data.foto)) store.setItem(PHOTO_KEY, data.foto);
    } catch(e) { alert(t('import_save_fail') + (e && e.message ? e.message : e)); return; }
    PROFILE = loadProfile() || PROFILE;
    // Recomeça a conversa com os dados importados (outra língua, outros níveis…).
    chatHistory = []; repeatTarget = ''; repeatTries = 0; clearTranscript();
    init();
    fillProfileForm();      // mostra os dados importados nos campos do perfil
    updateStreakBadge();
    alert(t('import_ok'));
  };
  reader.onerror = () => alert(t('read_fail'));
  reader.readAsText(file);
}

// Aviso curto, por cima da barra de navegação.
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

function hideSuggestions() {
  const box = document.getElementById('suggest-box');
  if (box) { box.classList.remove('show'); box.innerHTML = ''; }
}

function addLoadingMsg() {
  const box = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg tutor'; div.id = 'loading-msg';
  div.innerHTML = `<div class="label">${esc(t('lbl_tutor'))}</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
  box.appendChild(div);
  scrollChatToEnd();
}

function removeLoading() { const el = document.getElementById('loading-msg'); if (el) el.remove(); }
function clearTranscript() { document.getElementById('transcript').innerHTML = ''; lastUserDiv = null; hideSuggestions(); }
function setStatus(type, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot';
  if (type === 'green') dot.classList.add('green');
  else if (type === 'gold') dot.classList.add('gold');
  else if (type === 'error') dot.classList.add('red');
  document.getElementById('status-text').textContent = text;
}
function toggleTextMode() {
  const row = document.getElementById('text-row');
  row.classList.toggle('show');
  if (row.classList.contains('show')) document.getElementById('text-inp').focus();
}
// Conversa: rola até a mensagem mais recente. Enquanto a aluna estiver no fim, fica no fim mesmo quando
// a área muda de tamanho (sugestões, caixa de texto, teclado); se ela subir para reler, não a puxa.
let chatStick = true;
function scrollChatToEnd() { const b = document.getElementById('chat-body'); if (b) { b.scrollTop = b.scrollHeight; chatStick = true; } }
// Altura real da barra de baixo (muda com o tamanho do texto): a tela Conversar acaba logo acima dela.
function syncTabbarH() {
  const tb = document.getElementById('tabbar');
  const hgt = tb && getComputedStyle(tb).display !== 'none' ? tb.offsetHeight : 0;
  document.documentElement.style.setProperty('--tabbar-h', hgt + 'px');
}
(function () {
  const b = document.getElementById('chat-body'), tb = document.getElementById('tabbar');
  if (b) b.addEventListener('scroll', () => { chatStick = b.scrollHeight - b.scrollTop - b.clientHeight < 60; });
  if (window.ResizeObserver) {
    if (tb) new ResizeObserver(syncTabbarH).observe(tb);
    if (b) new ResizeObserver(() => { if (chatStick) b.scrollTop = b.scrollHeight; }).observe(b);
    const tr = document.getElementById('transcript');
    if (tr) new ResizeObserver(() => { if (chatStick && b) b.scrollTop = b.scrollHeight; }).observe(tr);
  }
  window.addEventListener('resize', syncTabbarH);
  syncTabbarH();
})();
</script>
